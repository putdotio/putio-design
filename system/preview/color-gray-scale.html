<!DOCTYPE html>
<html lang="en" class="dark"><head>
<script>
  /* Theme bootstrap — runs synchronously before paint.
     One token-driven design system. .dark on <html> = dark; no class = light.
     Lock: <html data-theme-lock="dark"> pins the file to one mode (used for
       fixed-mode product mockups: TV's Liquid Glass, mobile-shell hero).
     Standalone: 'putio-ds-theme' from localStorage (shared with the guide).
     URL ?theme=light|dark wins for screenshots / shared links.
     Embedded: parent broadcasts theme via postMessage (handled in _resize.js,
       which also respects the lock). */
  (function () {
    var root = document.documentElement;
    function setDark(b) { root.classList.toggle('dark', !!b); }
    var lock = root.getAttribute('data-theme-lock');
    if (lock === 'dark')  { setDark(true);  return; }
    if (lock === 'light') { setDark(false); return; }
    var dark = true;                                       // default
    try {
      var saved = localStorage.getItem('putio-ds-theme');
      if (saved === 'light') dark = false;
      else if (saved === 'dark') dark = true;
      var p = new URLSearchParams(location.search);
      var q = p.get('theme');
      if (q === 'light') dark = false;
      if (q === 'dark')  dark = true;
    } catch (e) {}
    setDark(dark);
  })();
</script>
