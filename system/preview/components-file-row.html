<!DOCTYPE html>
<html lang="en" class="dark"><head>
<title>put.io design preview</title><meta charset="utf-8">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/standard/font.css">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/mono/font.css">
<link rel="stylesheet" href="https://static.put.io/fonts/berkeley-mono/variable/font.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { height: 100%; background: var(--bg); color: var(--text); }
  .card { padding: 24px; display:flex; flex-direction:column; gap: 14px; }
  .label {
    font-family: var(--font-ui-mono); font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary);
  }
  .row {
    display:flex; align-items:center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    transition: background var(--dur-fast) var(--ease-out);
  }
  .row:hover { background: var(--list-item-bg-hover); }
  .row.active { background: var(--list-item-bg-active); }
  .row .name { flex: 1; font-size: var(--fs-base); color: var(--text); }
  .row .meta { font-family: var(--font-ui-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--text-secondary); min-width: 80px; text-align:right; }
  .row .date { font-family: var(--font-ui-mono); font-size: var(--fs-xs); color: var(--text-secondary); min-width: 110px; text-align:right; }

  /* Lucide-style inline icons */
  .row .lucide-icon {
    width: 18px; height: 18px; flex-shrink: 0;
    color: var(--text-secondary);
  }
  .row .lucide-icon.fldr,
  .row .lucide-icon.audio { color: var(--yellow-solid); }

  .checkbox {
    width: 14px; height: 14px; border: 1.5px solid var(--border-hover);
    border-radius: var(--radius-sm); flex-shrink: 0;
  }
  .checkbox.checked {
    background: var(--yellow-solid); border-color: var(--yellow-solid);
    position: relative;
  }
  .checkbox.checked::after {
    content:''; position:absolute; left: 3px; top: 0px; width: 5px; height: 9px;
    border: solid #000; border-width: 0 2px 2px 0; transform: rotate(45deg);
  }

  .lucide-icon { display: inline-block; vertical-align: -0.125em; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: 0 0 auto; }
</style><script src="./_resize.js" defer></script>
</head>
<body>
<div class="card">
  <div class="label">File list — dark mode (app default)</div>

  <div class="row">
    <div class="checkbox"></div>
    <svg class="lucide-icon fldr" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
    <div class="name">homework_answers_DONT_DELETE</div>
    <div class="meta">—</div>
    <div class="date">Mar 14 · 16:02</div>
  </div>

  <div class="row active">
    <div class="checkbox checked"></div>
    <svg class="lucide-icon fldr" aria-hidden="true" viewBox="0 0 24 24"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg>
    <div class="name">TV Shows</div>
    <div class="meta">—</div>
    <div class="date">Mar 12 · 09:41</div>
  </div>

  <div class="row">
    <div class="checkbox"></div>
    <svg class="lucide-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/></svg>
    <div class="name">The.Wire.S03E04.Back.Burners.1080p.BluRay.x264-DEMAND.mkv</div>
    <div class="meta">3.42 GB</div>
    <div class="date">Mar 14 · 22:18</div>
  </div>

  <div class="row">
    <div class="checkbox"></div>
    <svg class="lucide-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v6h6"/></svg>
    <div class="name">Invoices Q1 2026.pdf</div>
    <div class="meta">210 kB</div>
    <div class="date">Mar 07 · 14:00</div>
  </div>

  <div class="row">
    <div class="checkbox"></div>
    <svg class="lucide-icon audio" aria-hidden="true" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <div class="name">ambient-session-03.mp3</div>
    <div class="meta">72.4 MB</div>
    <div class="date">Feb 29 · 03:17</div>
  </div>
</div>
</body></html>
