<!DOCTYPE html>
<html lang="en" class="dark"><head>
<script>
  /* Theme bootstrap — runs synchronously before paint.
     One token-driven design system. .dark on <html> = dark; no class = light.
     Lock: <html data-theme-lock="dark"> pins the file to one mode (used for
       fixed-mode product mockups: TV surfaces, mobile-shell hero).
     Standalone: 'putio-ds-theme' from localStorage (shared with the guide).
     URL ?theme=light|dark wins for screenshots / shared links.
     Embedded: parent broadcasts theme via postMessage (handled in _resize.js,
       which also respects the lock). */
  (function () {
    var root = document.documentElement;
    function setDark(b) { root.classList.toggle('dark', !!b); }
    var lock = root.getAttribute('data-theme-lock');
    if (lock === 'dark')  { setDark(true);  return; }
    if (lock === 'light') { setDark(false); return; }
    var dark = true;                                       // default
    try {
      var saved = localStorage.getItem('putio-ds-theme');
      if (saved === 'light') dark = false;
      else if (saved === 'dark') dark = true;
      var p = new URLSearchParams(location.search);
      var q = p.get('theme');
      if (q === 'light') dark = false;
      if (q === 'dark')  dark = true;
    } catch (e) {}
    setDark(dark);
  })();
</script>
<title>put.io · components · file row</title><meta charset="utf-8">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/standard/font.css">

<style>
  html, body { background: var(--bg); color: var(--text); }
  .preview-shell { padding: 24px; display:flex; flex-direction:column; gap: 14px; }
  .label {
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary);
  }
  .row {
    display:flex; align-items:center; gap: 12px;
    padding: 10px 12px; border-radius: var(--radius-sm);
    transition: background var(--dur-fast) var(--ease-out);
  }
  .row:hover { background: var(--list-item-bg-hover); }
  .row.active { background: var(--list-item-bg-active); }
  .row .name { flex: 1; font-size: var(--fs-base); color: var(--text); }
  .row .meta { font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: var(--fs-xs); color: var(--text-secondary); min-width: 80px; text-align:right; }
  .row .date { font-family: var(--font-mono); font-size: var(--fs-xs); color: var(--text-secondary); min-width: 110px; text-align:right; }

  /* Phosphor-driven icons — every file kind carries --file-row-icon, not just
     the folder. Utility icons (kebab, chevron) stay neutral; there are none in
     this specimen's rows. */
  .row i {
    font-size: 18px; line-height: 1; flex-shrink: 0;
    color: var(--file-row-icon);
    width: 18px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
  }

  .checkbox {
    width: 14px; height: 14px; border: 1.5px solid var(--border-hover);
    border-radius: var(--radius-sm); flex-shrink: 0;
  }
  .checkbox.checked {
    background: var(--yellow-solid); border-color: var(--yellow-solid);
    position: relative;
  }
  .checkbox.checked::after {
    content:''; position:absolute; left: 3px; top: 0px; width: 5px; height: 9px;
    border: solid var(--primary-foreground); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
</style><script src="./_resize.js" defer></script>
</head>
