<!DOCTYPE html>
<html lang="en" class="dark"><head>
<title>put.io design preview</title><meta charset="utf-8">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/standard/font.css">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/mono/font.css">
<link rel="stylesheet" href="https://static.put.io/fonts/berkeley-mono/variable/font.css">
<link rel="stylesheet" href="../tokens.css">
<style>
  html, body { height: 100%; background: var(--bg); }
  .card { padding: 24px; display:flex; flex-direction:column; gap: 10px; }
  .row { display:flex; align-items:center; gap: 16px; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary); width: 110px; }
  .bar {
    background: var(--yellow-solid); height: 18px; border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
  }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text); width: 48px; text-align:right; }
  .note { font-size: 11px; color: var(--text-secondary); margin-top: 8px; max-width: 560px; line-height: 1.5; }
</style><script src="./_resize.js" defer></script>
</head>
<body>
<div class="card">
  <div class="row"><div class="token">--space-1</div><div class="bar" style="width:4px"></div><div class="px">4</div></div>
  <div class="row"><div class="token">--space-2</div><div class="bar" style="width:8px"></div><div class="px">8</div></div>
  <div class="row"><div class="token">--space-3</div><div class="bar" style="width:16px"></div><div class="px">16</div></div>
  <div class="row"><div class="token">--space-4</div><div class="bar" style="width:32px"></div><div class="px">32</div></div>
  <div class="row"><div class="token">--space-5</div><div class="bar" style="width:64px"></div><div class="px">64</div></div>
  <div class="row"><div class="token">--space-6</div><div class="bar" style="width:128px"></div><div class="px">128</div></div>
  <div class="row"><div class="token">--space-7</div><div class="bar" style="width:256px"></div><div class="px">256</div></div>
  <div class="note">4px base, aggressive scale inherited from the current web app. Component-internal padding almost always uses 4/8/16; layout gutters use 32/64.</div>
</div>
</body></html>
