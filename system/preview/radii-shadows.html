<!DOCTYPE html>
<html lang="en" class="dark"><head>
<script>
  /* Theme bootstrap — runs synchronously before paint.
     One token-driven design system. .dark on <html> = dark; no class = light.
     Lock: <html data-theme-lock="dark"> pins the file to one mode (used for
       fixed-mode product mockups: TV surfaces, mobile-shell hero).
     Standalone: 'putio-ds-theme' from localStorage (shared with the guide).
     URL ?theme=light|dark wins for screenshots / shared links.
     Embedded: parent broadcasts theme via postMessage (handled in _resize.js,
       which also respects the lock). */
  (function () {
    var root = document.documentElement;
    function setDark(b) { root.classList.toggle('dark', !!b); }
    var lock = root.getAttribute('data-theme-lock');
    if (lock === 'dark')  { setDark(true);  return; }
    if (lock === 'light') { setDark(false); return; }
    var dark = true;                                       // default
    try {
      var saved = localStorage.getItem('putio-ds-theme');
      if (saved === 'light') dark = false;
      else if (saved === 'dark') dark = true;
      var p = new URLSearchParams(location.search);
      var q = p.get('theme');
      if (q === 'light') dark = false;
      if (q === 'dark')  dark = true;
    } catch (e) {}
    setDark(dark);
  })();
</script>
<title>put.io · radii shadows</title><meta charset="utf-8">
<link rel="stylesheet" href="https://static.put.io/fonts/gt-america/standard/font.css">
<link rel="stylesheet" href="https://static.put.io/fonts/berkeley-mono/variable/font.css">
<link rel="stylesheet" href="../tokens.css">

<style>
  html, body { background: var(--bg); }
  .preview-shell { padding: 24px; display:flex; flex-direction:column; gap: 24px; }
  .row { display:flex; gap: 18px; align-items:flex-end; }
  .box {
    background: var(--component-bg);
    border: 1px solid var(--border);
    width: 88px; height: 88px;
    display:flex; align-items:flex-end; padding: 6px;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
  }
  .label { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 6px; text-align:center; }
  .shadow-row { display:flex; gap: 24px; margin-top: 8px; }
  .sh {
    width: 110px; height: 80px; background: var(--component-bg); border-radius: var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary);
  }
  .sh-sm { box-shadow: 0 1px 2px hsla(0,0%,0%,0.4); }
  .sh-md { box-shadow: 0 4px 12px hsla(0,0%,0%,0.5); }
  .sh-lg { box-shadow: 0 16px 40px hsla(0,0%,0%,0.6); }
  .sh-focus { box-shadow: 0 0 0 3px hsla(47,100%,65%,0.4); border: 1px solid var(--yellow-solid); }
  .section-label { font-size: 11px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-secondary); }
</style><script src="./_resize.js" defer></script>
</head>
<body>
<div class="preview-shell">
  <div>
    <div class="section-label">Radii — 6px is default</div>
    <div class="row" style="margin-top: 10px;">
      <div>
        <div class="box" style="border-radius:4px">4px</div>
        <div class="label">--radius-sm</div>
      </div>
      <div>
        <div class="box" style="border-radius:6px; border-color:var(--yellow-solid); background: color-mix(in srgb, var(--yellow-solid) 14%, transparent); color: var(--yellow-text-secondary);">6px</div>
        <div class="label">--radius · default</div>
      </div>
      <div>
        <div class="box" style="border-radius:8px">8px</div>
        <div class="label">--radius-md</div>
      </div>
      <div>
        <div class="box" style="border-radius:10px">10px</div>
        <div class="label">--radius-lg</div>
      </div>
      <div>
        <div class="box" style="border-radius:999px">pill</div>
        <div class="label">--radius-pill</div>
      </div>
    </div>
  </div>

  <div>
    <div class="section-label">Shadows — quiet, subtle, borders do most of the work</div>
    <div class="shadow-row">
      <div>
        <div class="sh sh-sm">sm</div>
        <div class="label">hover / focus</div>
      </div>
      <div>
        <div class="sh sh-md">md</div>
        <div class="label">popover, menu</div>
      </div>
      <div>
        <div class="sh sh-lg">lg</div>
        <div class="label">modal, sheet</div>
      </div>
      <div>
        <div class="sh sh-focus">focus</div>
        <div class="label">yellow focus ring</div>
      </div>
    </div>
  </div>
</div>
