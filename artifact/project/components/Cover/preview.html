<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>put.io design</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        background: var(--app-bg);
        color: var(--text);
        font-family: var(--font-display);
        overflow: hidden;
      }
      .cover {
        position: relative;
        width: 960px;
        height: 300px;
        overflow: hidden;
      }
      .art {
        position: absolute;
        top: 0;
        left: 480px;
        width: 480px;
        height: 300px;
      }
      .brand {
        fill: var(--yellow-solid);
      }
      .ink {
        fill: var(--text);
      }
      .tint {
        fill: var(--yellow-component-bg);
      }
      .row {
        fill: var(--app-bg);
        rx: var(--radius);
      }
      .text {
        position: absolute;
        left: 40px;
        bottom: 32px;
        max-width: 440px;
      }
      .name {
        margin: 0;
        font-size: 104px;
        font-weight: var(--fw-black);
        line-height: 0.95;
        letter-spacing: var(--tracking-tight);
      }
      .tagline {
        margin: 16px 0 0;
        font-family: var(--font-sans);
        font-size: 14px;
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <svg class="art" viewBox="0 0 480 300" aria-hidden="true">
        <!--
          blocks: yellow-solid 256 wide (space-7) bleeding top and bottom; text 224×128 and yellow-component-bg 224×172 off the right edge
          arrangement: one tall brand slab with two satellites stacked beside it
          pattern: file rows cut from the slab in app-bg; put.io is a list-first file browser, so the shape it is remembered by is the row
          scales: rows button-height-md 32 tall at a 48 pitch (32 + space-3), inset space-4 32, corners radius 6
        -->
        <rect class="brand" x="0" y="0" width="256" height="300" />
        <rect class="ink" x="256" y="0" width="224" height="128" />
        <rect class="tint" x="256" y="128" width="224" height="172" />
        <rect class="row" x="32" y="32" width="192" height="32" />
        <rect class="row" x="32" y="80" width="160" height="32" />
        <rect class="row" x="32" y="128" width="176" height="32" />
        <rect class="row" x="32" y="176" width="128" height="32" />
        <rect class="row" x="32" y="224" width="192" height="32" />
      </svg>
      <div class="text">
        <p class="name">put.io<br />design</p>
        <p class="tagline">A content-agnostic cloud file product.</p>
      </div>
    </div>
  </body>
</html>
