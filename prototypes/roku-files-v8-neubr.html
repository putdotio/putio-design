<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io — Roku Files (Neubrutalism)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800;900&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F0EBE0;
    --surface: #FFFFFF;
    --border: #1A1A1A;
    --text: #1A1A1A;
    --text-2: #5C5C5C;
    --yellow: #FDCE45;
    --green: #4CC38A;
    --red: #FF6369;
    --shadow: 8px 8px 0 #1A1A1A;
    --shadow-sm: 5px 5px 0 #1A1A1A;
    --border-w: 4px;
  }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .tv-frame { width: 1920px; height: 1080px; overflow: hidden; display: flex; flex-direction: column; }

  /* Top Bar */
  .top-bar {
    display: flex; align-items: center; gap: 30px;
    padding: 36px 72px 0;
    flex-shrink: 0;
  }
  .logo {
    font-size: 54px; font-weight: 900; letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .logo span { color: var(--yellow); background: var(--text); padding: 0 9px; }
  .top-spacer { flex: 1; }
  .top-bar-btn {
    width: 72px; height: 72px;
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top-bar-btn svg { width: 36px; height: 36px; fill: var(--text); }

  /* Content */
  .content { flex: 1; padding: 36px 72px 30px; display: flex; flex-direction: column; overflow: hidden; }

  /* Page Header */
  .page-header {
    display: flex; align-items: baseline; gap: 30px; margin-bottom: 30px;
  }
  .page-title {
    font-size: 66px; font-weight: 900; letter-spacing: -0.02em;
    text-transform: uppercase;
  }
  .page-count {
    font-size: 30px; font-weight: 700; color: var(--text-2);
  }

  /* File list */
  .file-list { flex: 1; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }

  .section-header {
    font-size: 24px; font-weight: 900; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.1em;
    padding: 12px 0 6px;
    border-bottom: 3px solid var(--border);
    margin-bottom: 6px;
  }

  .file-row {
    display: flex; align-items: center; gap: 24px;
    padding: 21px 30px;
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    box-shadow: var(--shadow-sm);
    cursor: pointer;
  }
  .file-row.focused {
    background: var(--yellow);
    box-shadow: var(--shadow);
  }

  .f-icon {
    width: 66px; height: 66px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: var(--border-w) solid var(--border);
  }
  .f-icon.folder { background: var(--yellow); }
  .f-icon.video { background: var(--green); }
  .f-icon.audio { background: #C4B8FF; }
  .f-icon svg { width: 36px; height: 36px; fill: var(--text); }

  .f-name {
    flex: 1; font-size: 36px; font-weight: 700;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .f-badge {
    font-size: 24px; font-weight: 800;
    background: var(--text);
    color: var(--surface);
    padding: 3px 18px;
    text-transform: uppercase;
    flex-shrink: 0;
  }
  .file-row.focused .f-badge {
    background: var(--surface);
    color: var(--text);
  }

  .f-size {
    font-size: 30px; font-weight: 700; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 150px; text-align: right;
  }
  .file-row.focused .f-size { color: var(--text); }

  .f-chevron svg { width: 42px; height: 42px; fill: var(--text); }

  /* Footer */
  .footer-hint {
    display: flex; align-items: center; justify-content: center; gap: 48px;
    padding: 24px 0 0; flex-shrink: 0;
    font-size: 27px; font-weight: 700; color: var(--text-2);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .hint-key {
    display: inline-flex; align-items: center; gap: 12px;
  }
  .key-box {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 54px; height: 48px; padding: 0 12px;
    background: var(--surface);
    border: var(--border-w) solid var(--border);
    box-shadow: 3px 3px 0 var(--border);
    font-size: 21px; font-weight: 800;
  }
</style>
</head>
<body>
