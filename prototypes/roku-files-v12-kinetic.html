<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>put.io — Roku Files (Kinetic)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #06060C;
    --surface: #101018;
    --surface-2: #1A1A26;
    --text: #F0F0FA;
    --text-2: #8888A0;
    --text-3: #505068;
    --yellow: #FDCE45;
    --yellow-glow: rgba(253,206,69,0.12);
    --green: #4CC38A;
    --green-glow: rgba(76,195,138,0.10);
    --gradient-1: linear-gradient(135deg, #FDCE45 0%, #FF8A45 100%);
    --gradient-2: linear-gradient(135deg, #4CC38A 0%, #45B8FD 100%);
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .tv-frame {
    width: 1280px; height: 720px; overflow: hidden;
    display: flex; flex-direction: column;
    position: relative;
    background: var(--bg);
  }
  /* Animated BG */
  .bg-anim {
    position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: radial-gradient(ellipse at 30% 10%, rgba(253,206,69,0.05) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 90%, rgba(76,195,138,0.04) 0%, transparent 50%);
    animation: bgPulse 6s ease-in-out infinite alternate;
  }
  @keyframes bgPulse {
    0% { opacity: 1; }
    100% { opacity: 0.5; }
  }
  .tv-frame > *:not(.bg-anim) { position: relative; z-index: 1; }

  /* Top Bar */
  .top-bar {
    display: flex; align-items: center; gap: 20px;
    padding: 28px 48px 0;
    flex-shrink: 0;
  }
  .logo {
    font-size: 32px; font-weight: 800; letter-spacing: -0.02em;
    background: var(--gradient-1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .top-spacer { flex: 1; }
  .top-bar-btn {
    width: 44px; height: 44px; border-radius: 999px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.04);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top-bar-btn svg { width: 22px; height: 22px; fill: var(--text-2); }

  /* Content */
  .content { flex: 1; padding: 24px 48px 24px; display: flex; flex-direction: column; overflow: hidden; }

  .page-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  }
  .page-title {
    font-size: 36px; font-weight: 800; letter-spacing: -0.02em;
    background: var(--gradient-1);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleGlow 3s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    0% { filter: brightness(1); }
    100% { filter: brightness(1.2); }
  }
  .page-spacer { flex: 1; }
  .sort-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; color: var(--text-2);
    background: var(--surface); padding: 10px 20px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
    border: 1px solid rgba(255,255,255,0.04);
  }
  .sort-pill svg { width: 18px; height: 18px; fill: currentColor; }

  .section-header {
    font-size: 14px; font-weight: 700; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 4px 0 8px;
  }

  /* File list */
  .file-list { flex: 1; display: flex; flex-direction: column; gap: 5px; overflow: hidden; }

  .file-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    background: var(--surface);
    border-radius: 12px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.15s;
  }
  .file-row:hover { background: var(--surface-2); }
  .file-row.focused {
    border-color: var(--yellow);
    background: var(--surface-2);
    animation: rowPulse 2.5s ease-in-out infinite;
  }
  @keyframes rowPulse {
    0%, 100% { box-shadow: 0 0 12px rgba(253,206,69,0.08); }
    50% { box-shadow: 0 0 20px rgba(253,206,69,0.15); }
  }

  .f-icon {
    width: 42px; height: 42px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    position: relative;
  }
  .f-icon.folder { background: var(--yellow-glow); }
  .f-icon.folder svg { fill: var(--yellow); width: 24px; height: 24px; }
  .f-icon.video { background: var(--green-glow); }
  .f-icon.video svg { fill: var(--green); width: 22px; height: 22px; }
  .f-icon.audio { background: rgba(138,130,255,0.10); }
  .f-icon.audio svg { fill: #8A82FF; width: 22px; height: 22px; }

  /* Subtle icon pulse on focused row */
  .file-row.focused .f-icon::after {
    content: '';
    position: absolute; inset: -3px;
    border-radius: 14px;
    background: var(--gradient-1);
    opacity: 0;
    animation: iconGlow 2s ease-in-out infinite;
    z-index: -1;
  }
  @keyframes iconGlow {
    0%, 100% { opacity: 0; }
    50% { opacity: 0.12; }
  }

  .f-name {
    flex: 1; font-size: 22px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .f-badge {
    font-size: 14px; font-weight: 700;
    background: var(--yellow-glow);
    color: var(--yellow);
    padding: 3px 10px; border-radius: 8px;
    flex-shrink: 0;
  }

  .f-size {
    font-size: 18px; color: var(--text-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 90px; text-align: right;
  }

  .f-chevron svg { width: 22px; height: 22px; fill: var(--text-3); }
  .file-row.focused .f-chevron svg { fill: var(--yellow); }

  /* Footer */
  .footer-hint {
    display: flex; align-items: center; justify-content: center; gap: 28px;
    padding: 14px 0 0; flex-shrink: 0;
    font-size: 16px; color: var(--text-3);
  }
  .hint-key { display: inline-flex; align-items: center; gap: 6px; }
  .key-box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 26px; border-radius: 6px;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,0.04);
    font-size: 13px; font-weight: 600; color: var(--text-2);
  }
</style>
</head>
<body>
