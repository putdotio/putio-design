<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=412">
<title>put.io -- Android Onboarding (M3 Clean)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111113; --bg-2: #19191B; --bg-3: #222225; --bg-4: #2C2C30;
    --line: #3E3E44; --border: #4B4B52; --focus: #65656D;
    --solid: #7C7C85; --text-2: #ABABB2; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.12);
    --green: #30A46C; --red: #E5484D;
    --surface: #1E1E21;
    --surface-v: #252528;
  }

  body {
    font-family: 'Inter', 'Roboto', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: 412px;
    height: 915px;
    display: flex; flex-direction: column;
    position: relative; overflow: hidden;
  }

  /* Android status bar */
  .status-bar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px;
    font-size: 12px; font-weight: 500; color: var(--text-2);
  }
  .status-icons { display: flex; align-items: center; gap: 4px; }

  /* Header */
  .header {
    padding: 16px 24px 8px;
  }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--yellow); }

  /* ViewPager content */
  .viewpager {
    flex: 1; display: flex; flex-direction: column;
    padding: 16px 24px 0;
    overflow: hidden;
  }

  .vp-card {
    flex: 1;
    background: var(--surface);
    border-radius: 28px;
    padding: 28px 24px 24px;
    display: flex; flex-direction: column;
    position: relative;
  }

  .vp-step {
    display: inline-flex; align-items: center; gap: 10px;
    margin-bottom: 20px;
  }
  .vp-step .chip {
    padding: 4px 14px; border-radius: 999px;
    background: var(--yellow-subtle);
    font-size: 12px; font-weight: 600;
    color: var(--yellow);
  }
  .vp-step .of {
    font-size: 12px; color: var(--solid);
  }

  .vp-card h2 {
    font-size: 28px; font-weight: 800;
    letter-spacing: -0.03em; line-height: 1.15;
    margin-bottom: 8px;
  }
  .vp-card h2 .yellow { color: var(--yellow); }

  .vp-card .desc {
    font-size: 15px; color: var(--text-2); line-height: 1.6;
    margin-bottom: 20px;
  }

  /* Visual content */
  .vp-visual {
    flex: 1; display: flex; flex-direction: column; gap: 12px;
  }

  /* M3 style cards */
  .m3-card {
    background: var(--surface-v);
    border-radius: 16px;
    padding: 16px;
    display: flex; align-items: center; gap: 14px;
  }
  .m3-icon {
    width: 44px; height: 44px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .m3-icon.y { background: var(--yellow-subtle); color: var(--yellow); }
  .m3-icon.g { background: rgba(48, 164, 108, 0.12); color: var(--green); }
  .m3-icon.w { background: rgba(238, 238, 240, 0.06); color: var(--text-2); }
  .m3-text { flex: 1; }
  .m3-title { font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .m3-sub { font-size: 12px; color: var(--solid); line-height: 1.4; }

  /* M3 input */
  .m3-input {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-v);
    border-radius: 16px; padding: 14px 16px;
    border: 1px solid transparent;
  }
  .m3-input.focused {
    border-color: var(--yellow);
  }
  .m3-input .input-icon { color: var(--solid); flex-shrink: 0; }
  .m3-input .ph {
    font-size: 14px; color: var(--solid); flex: 1;
  }
  .m3-input .fab {
    width: 36px; height: 36px; border-radius: 12px;
    background: var(--yellow); color: #111113;
    display: flex; align-items: center; justify-content: center;
    border: none; cursor: pointer;
  }

  /* Mini player */
  .m3-player {
    background: var(--surface-v); border-radius: 16px;
    overflow: hidden;
  }
  .m3p-screen {
    height: 140px;
    background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .m3p-play {
    width: 52px; height: 52px; border-radius: 16px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .m3p-info { padding: 12px 16px; display: flex; align-items: center; gap: 10px; }
  .m3p-title { font-size: 14px; font-weight: 600; flex: 1; }
  .m3p-time { font-size: 12px; color: var(--solid); }
  .m3p-progress { height: 4px; background: var(--bg-4); margin: 0 16px 12px; border-radius: 2px; overflow: hidden; }
  .m3p-fill { height: 100%; width: 55%; background: var(--yellow); border-radius: 2px; }

  /* Platform chips */
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .m3-chip {
    padding: 8px 14px; border-radius: 8px;
    background: var(--surface-v);
    font-size: 12px; color: var(--text-2); font-weight: 500;
  }

  /* Aside */
  .aside-text {
    font-size: 13px; color: var(--solid); line-height: 1.5;
    font-style: italic; margin-top: auto; padding-top: 8px;
  }

  /* Bottom area */
  .bottom-area {
    padding: 12px 24px 8px;
  }

  /* ViewPager dots */
  .vp-dots {
    display: flex; align-items: center; justify-content: center;
    gap: 8px; padding: 14px 0;
  }
  .vp-dot {
    width: 8px; height: 8px; border-radius: 999px;
    background: var(--border);
  }
  .vp-dot.active {
    width: 24px;
    background: var(--yellow);
    border-radius: 4px;
  }

  .btn-row {
    display: flex; gap: 12px;
  }
  .btn-text {
    flex: 1; display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--yellow);
    font-size: 14px; font-weight: 600; padding: 16px;
    border-radius: 999px; border: none; cursor: pointer;
    font-family: inherit;
  }
  .btn-filled {
    flex: 2; display: flex; align-items: center; justify-content: center;
    background: var(--yellow); color: #111113;
    font-size: 14px; font-weight: 700; padding: 16px;
    border-radius: 999px; border: none; cursor: pointer;
    font-family: inherit;
  }

  /* Nav bar */
  .nav-bar {
    display: flex; align-items: center; justify-content: center;
    padding: 8px 0 8px;
  }
  .nav-pill {
    width: 120px; height: 4px; border-radius: 2px;
    background: var(--text); opacity: 0.2;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">
    <span>12:00</span>
    <div class="status-icons">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="var(--text-2)" stroke-width="1">
        <path d="M0.5 4C3 1.5 11 1.5 13.5 4" stroke-linecap="round"/>
        <path d="M2.5 6.5C4 5 10 5 11.5 6.5" stroke-linecap="round"/>
        <path d="M5 9C6 8 8 8 9 9" stroke-linecap="round"/>
        <circle cx="7" cy="11" r="0.8" fill="var(--text-2)"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="var(--text-2)">
        <rect x="0" y="5" width="3" height="7" rx="0.5" opacity="0.4"/>
        <rect x="4" y="3" width="3" height="9" rx="0.5" opacity="0.6"/>
        <rect x="8" y="1" width="3" height="11" rx="0.5" opacity="0.8"/>
        <rect x="12" y="0" width="3" height="12" rx="0.5"/>
      </svg>
      <svg width="22" height="12" viewBox="0 0 22 12" fill="none">
        <rect x="0.5" y="0.5" width="18" height="11" rx="2" stroke="var(--text-2)" stroke-opacity="0.4"/>
        <rect x="19" y="3" width="2" height="6" rx="0.5" fill="var(--text-2)" opacity="0.3"/>
        <rect x="1.5" y="1.5" width="13" height="9" rx="1.5" fill="var(--yellow)"/>
      </svg>
    </div>
  </div>

  <!-- Header -->
  <div class="header">
    <div class="logo">put<span>.</span>io</div>
  </div>

  <!-- ViewPager -->
  <div class="viewpager">
    <div class="vp-card">
      <div class="vp-step">
        <span class="chip">Step 1</span>
        <span class="of">of 3</span>
      </div>

      <h2><span class="yellow">(=^-^=)</span><br>Add your stuff</h2>
      <p class="desc">Paste a magnet link, a URL, or a .torrent file. We'll handle it from there.</p>

      <div class="vp-visual">
        <div class="m3-input focused">
          <svg class="input-icon" width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M7 13L4 10C2.6 8.6 2.6 6.4 4 5C5.4 3.6 7.6 3.6 9 5L9.5 5.5" stroke-linecap="round"/>
            <path d="M11 5L14 8C15.4 9.4 15.4 11.6 14 13C12.6 14.4 10.4 14.4 9 13L8.5 12.5" stroke-linecap="round"/>
          </svg>
          <span class="ph">Paste magnet link or URL</span>
          <button class="fab">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 8h10M9 4l4 4-4 4" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>

        <div class="m3-card">
          <div class="m3-icon y">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M10 3v10M7 10l3 3 3-3" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M3 14v2a1.5 1.5 0 001.5 1.5h11A1.5 1.5 0 0017 14v-2" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="m3-text">
            <div class="m3-title">.torrent files</div>
            <div class="m3-sub">open with put.io from any file manager</div>
          </div>
        </div>

        <div class="m3-card">
          <div class="m3-icon g">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="2" width="16" height="12" rx="2"/>
              <path d="M7 14v4M13 14v4M5 18h10" stroke-linecap="round"/>
              <path d="M8 8h4M10 6v4" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="m3-text">
            <div class="m3-title">Browser extension</div>
            <div class="m3-sub">right-click any link on desktop</div>
          </div>
        </div>

        <div class="aside-text">paste anything. we're not picky.</div>
      </div>
    </div>
  </div>

  <!-- Bottom -->
  <div class="bottom-area">
    <div class="vp-dots">
      <div class="vp-dot active"></div>
      <div class="vp-dot"></div>
      <div class="vp-dot"></div>
    </div>
    <div class="btn-row">
      <button class="btn-text">Skip</button>
      <button class="btn-filled">Next</button>
    </div>
  </div>

  <div class="nav-bar"><div class="nav-pill"></div></div>

</div>
</body>
</html>
