  /* Subtitle display */
  .subtitle-container {

  .subtitle-text {
    background: rgba(0, 0, 0, 0.75);

  .transport-bar {

    padding: 0 90px 40px;

  }

  .scrubber-row {

  }
  .time-label {

    font-variant-numeric: tabular-nums;
    min-width: 60px; text-align: right;
  }
  .progress-track {
    flex: 1; height: 4px; background: rgba(255,255,255,0.15);
    border-radius: 2px; position: relative;
  }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 42%; background: var(--yellow);
    border-radius: 2px;
  }

  .transport-controls {
    display: flex; align-items: center; justify-content: center; gap: 36px;
  }
  .transport-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;

  }
  .transport-btn svg { display: block; }
  .transport-btn.play-btn {
    width: 56px; height: 56px;
    background: rgba(255,255,255,0.1);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
  }

  /* Right-side panel */
  .panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 500px;
    background: rgba(10, 10, 12, 0.92);
    backdrop-filter: blur(40px);
    -webkit-backdrop-filter: blur(40px);

    padding: 60px 40px;

  }
  .tab.active {
    font-weight: 600; color: var(--text);
    border-bottom-color: var(--yellow);
  }

  /* Subtitle list */
  .subtitle-list {
    margin-top: 32px;
    display: flex; flex-direction: column; gap: 6px;
  }

  .subtitle-item {
    display: flex; align-items: center;
    padding: 18px 20px;
    border-radius: 14px;
    border: 2px solid transparent;
    cursor: default;
    transition: all 0.15s;
  }
  .subtitle-item.focused {

    background: rgba(253, 206, 69, 0.06);
    box-shadow: 0 0 0 3px rgba(253, 206, 69, 0.2);
  }
  .subtitle-item.selected {

  }
