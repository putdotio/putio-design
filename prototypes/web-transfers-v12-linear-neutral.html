<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#09090B">
<title>put.io — Transfers (Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #09090B;
    --sidebar-bg: #111113;
    --surface: #19191B;
    --card: #1C1C1E;
    --text: #FAFAFA;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --text-4: #52525B;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.10);
    --green: #30D158;
    --green-dim: rgba(48,209,88,0.12);
    --red: #FF453A;
    --blue: #0A84FF;
    --sep: rgba(255,255,255,0.06);
    --radius: 8px;
    --radius-btn: 6px;
    --radius-modal: 12px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    width: 1440px;
    height: 900px;
    overflow: hidden;
  }

  /* ================================================================
     SIDEBAR
     ================================================================ */
  .sidebar {
    width: 240px;
    background: var(--sidebar-bg);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    border-right: 1px solid var(--sep);
  }

  .sidebar-header {
    padding: 20px 16px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo-dot { color: var(--yellow); }

  .sidebar-nav {
    flex: 1;
    padding: 0 8px;
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .nav-group-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-4);
    padding: 20px 8px 6px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 7px 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: var(--font);
    border-radius: var(--radius-btn);
    transition: all 0.15s ease;
  }

  .nav-item:hover {
    color: var(--text-2);
    background: rgba(255,255,255,0.04);
  }

  .nav-item.active {
    color: var(--text);
    background: rgba(255,255,255,0.06);
  }

  .nav-icon {
    width: 18px;
    height: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .nav-icon svg { width: 18px; height: 18px; }

  .nav-item .nav-icon { color: var(--text-4); }
  .nav-item.active .nav-icon { color: var(--yellow); }
  .nav-item:hover .nav-icon { color: var(--text-3); }

  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 600;
    color: var(--bg);
    background: var(--yellow);
    padding: 1px 7px;
    border-radius: 10px;
  }

  .sidebar-footer {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--sep);
  }

  .storage-bar {
    width: 100%;
    height: 4px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 6px;
  }

  .storage-fill {
    height: 100%;
    width: 22%;
    background: var(--yellow);
    border-radius: 2px;
  }

  .storage-label {
    font-size: 11px;
    color: var(--text-3);
    font-weight: 400;
  }

  .storage-label strong {
    color: var(--text-2);
    font-weight: 600;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0 0;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    background: linear-gradient(135deg, var(--yellow), #F0A030);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--bg);
  }

  .user-name {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 500;
  }

  /* ================================================================
     CONTENT
     ================================================================ */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--bg);
  }

  .topbar {
    display: flex;
    align-items: center;
    padding: 20px 24px 0;
    gap: 12px;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .topbar-spacer { flex: 1; }

  .btn-muted {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    color: var(--text-3);
    font-size: 13px;
    font-weight: 500;
    padding: 7px 14px;
    border: 1px solid var(--sep);
    cursor: pointer;
    font-family: var(--font);
    border-radius: var(--radius-btn);
    transition: all 0.15s ease;
  }

  .btn-muted:hover {
    color: var(--text-2);
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.10);
  }

  /* ── Tabs ── */
  .tabs {
    display: flex;
    gap: 0;
    padding: 16px 24px 0;
    border-bottom: 1px solid var(--sep);
  }

  .tab {
    padding: 8px 16px 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    position: relative;
    transition: color 0.15s ease;
  }

  .tab:hover { color: var(--text-2); }

  .tab.active {
    color: var(--text);
    font-weight: 600;
  }

  .tab.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 16px;
    right: 16px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
  }

  .tab .tab-count {
    margin-left: 6px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-4);
    background: rgba(255,255,255,0.06);
    padding: 1px 6px;
    border-radius: 10px;
  }

  .tab.active .tab-count {
    color: var(--bg);
    background: var(--yellow);
  }

  /* ── Transfer Table ── */
  .transfer-section {
    flex: 1;
    overflow-y: auto;
    padding: 0 24px 24px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--text-4);
    padding: 16px 0 8px;
  }

  .transfer-table {
    width: 100%;
    border-collapse: collapse;
  }

  .transfer-table thead th {
    text-align: left;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-4);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    padding: 8px 12px;
    border-bottom: 1px solid var(--sep);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 1;
  }

  .transfer-table thead th:first-child { width: 28px; padding-left: 4px; }

  .transfer-table tbody tr {
    border-bottom: 1px solid var(--sep);
    transition: background 0.1s ease;
  }

  .transfer-table tbody tr:hover {
    background: rgba(255,255,255,0.02);
  }

  .transfer-table tbody tr:hover .row-actions { opacity: 1; }

  .transfer-table tbody td {
    padding: 12px 12px;
    font-size: 13px;
    vertical-align: middle;
  }

  .transfer-table tbody td:first-child { padding-left: 4px; }

  /* Status dots */
  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
    flex-shrink: 0;
  }

  .status-dot.downloading {
    background: var(--yellow);
    box-shadow: 0 0 6px rgba(253,206,69,0.4);
  }

  .status-dot.seeding {
    background: var(--green);
    box-shadow: 0 0 6px rgba(48,209,88,0.4);
  }

  .status-dot.queued {
    background: var(--text-4);
  }

  .status-dot.completed {
    background: var(--green);
  }

  .transfer-name-cell {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .transfer-name {
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 320px;
  }

  .quality-badge {
    display: inline-flex;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 3px;
    letter-spacing: 0.02em;
    width: fit-content;
  }

  /* Progress bar inline */
  .progress-cell {
    width: 140px;
  }

  .progress-bar-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .progress-track {
    flex: 1;
    height: 3px;
    background: rgba(255,255,255,0.06);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .progress-fill.seeding {
    background: var(--green);
  }

  .progress-pct {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-2);
    min-width: 32px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }

  .col-size {
    color: var(--text-3);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .col-eta {
    color: var(--text-3);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
  }

  .health-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    display: inline-block;
  }

  .health-dot.good { background: var(--green); }
  .health-dot.fair { background: var(--yellow); }
  .health-dot.poor { background: var(--red); }

  .row-actions {
    opacity: 0;
    transition: opacity 0.1s ease;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .row-actions button {
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: var(--radius-btn);
    color: var(--text-3);
    transition: all 0.15s ease;
  }

  .row-actions button:hover {
    background: rgba(255,255,255,0.06);
    color: var(--text);
  }

  /* Completed section */
  .completed-row td {
    color: var(--text-3);
  }

  .completed-row .transfer-name {
    color: var(--text-2);
  }

  .completed-icon {
    width: 16px;
    height: 16px;
    color: var(--green);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .go-to-file {
    font-size: 12px;
    font-weight: 500;
    color: var(--yellow);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    padding: 0;
    transition: opacity 0.15s ease;
  }

  .go-to-file:hover { opacity: 0.8; }
</style>
</head>
<body>

<div class="app">
  <!-- ── SIDEBAR ── -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="logo">put<span class="logo-dot">.</span>io</div>
    </div>

    <nav class="sidebar-nav">
      <button class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span>
        Files
      </button>
      <button class="nav-item active">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
        Transfers
        <span class="nav-badge">2</span>
      </button>
      <button class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a9 9 0 0 1 9 9"/><path d="M4 4a16 16 0 0 1 16 16"/><circle cx="5" cy="19" r="1"/></svg></span>
        RSS
      </button>

      <div class="nav-group-label">Manage</div>
      <button class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg></span>
        Sharing
      </button>
      <button class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12 8 12 12 14 14"/><circle cx="12" cy="12" r="10"/></svg></span>
        History
      </button>
      <button class="nav-item">
        <span class="nav-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></span>
        Trash
      </button>
    </nav>

    <div class="sidebar-footer">
      <div class="storage-bar"><div class="storage-fill"></div></div>
      <div class="storage-label"><strong>11 TB</strong> of 50 TB</div>
      <div class="user-row">
        <div class="user-avatar">A</div>
        <span class="user-name">Altay</span>
      </div>
    </div>
  </aside>

  <!-- ── CONTENT ── -->
  <main class="content">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="page-title">Transfers</div>
      <div class="topbar-spacer"></div>
      <button class="btn-muted">Clear Completed</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active">Active <span class="tab-count">3</span></button>
      <button class="tab">Completed <span class="tab-count">3</span></button>
    </div>

    <!-- Transfer List -->
    <div class="transfer-section">
      <!-- Active Transfers -->
      <table class="transfer-table">
        <thead>
          <tr>
            <th></th>
            <th>Name</th>
            <th>Progress</th>
            <th>Size</th>
            <th>ETA</th>
            <th>Health</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          <!-- Downloading -->
          <tr>
            <td><span class="status-dot downloading"></span></td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">Inception</span>
                <span class="quality-badge">4K</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill" style="width:73%"></div></div>
                <span class="progress-pct">73%</span>
              </div>
            </td>
            <td class="col-size">8.2 GB</td>
            <td class="col-eta">12 min</td>
            <td><span class="health-dot good"></span></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
          <!-- Seeding -->
          <tr>
            <td><span class="status-dot seeding"></span></td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">Dune Part Two</span>
                <span class="quality-badge">4K</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill seeding" style="width:100%"></div></div>
                <span class="progress-pct" style="color: var(--green)">Seed</span>
              </div>
            </td>
            <td class="col-size">18.4 GB</td>
            <td class="col-eta">&mdash;</td>
            <td><span class="health-dot good"></span></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
          <!-- Queued -->
          <tr>
            <td><span class="status-dot queued"></span></td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">Severance S02E10</span>
                <span class="quality-badge">1080p</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill" style="width:0%"></div></div>
                <span class="progress-pct" style="color: var(--text-4)">Queue</span>
              </div>
            </td>
            <td class="col-size">2.1 GB</td>
            <td class="col-eta">Waiting</td>
            <td><span class="health-dot fair"></span></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
        </tbody>
      </table>

      <!-- Completed -->
      <div class="section-label">Completed</div>
      <table class="transfer-table">
        <tbody>
          <tr class="completed-row">
            <td>
              <div class="completed-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">The Substance</span>
                <span class="quality-badge">1080p</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill seeding" style="width:100%"></div></div>
                <span class="progress-pct" style="color: var(--green)">Done</span>
              </div>
            </td>
            <td class="col-size">4.2 GB</td>
            <td class="col-eta">&mdash;</td>
            <td><button class="go-to-file">Go to file</button></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
          <tr class="completed-row">
            <td>
              <div class="completed-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">Nils Frahm - All Melody</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill seeding" style="width:100%"></div></div>
                <span class="progress-pct" style="color: var(--green)">Done</span>
              </div>
            </td>
            <td class="col-size">387 MB</td>
            <td class="col-eta">&mdash;</td>
            <td><button class="go-to-file">Go to file</button></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
          <tr class="completed-row">
            <td>
              <div class="completed-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
              </div>
            </td>
            <td>
              <div class="transfer-name-cell">
                <span class="transfer-name">project-notes.pdf</span>
              </div>
            </td>
            <td class="progress-cell">
              <div class="progress-bar-wrap">
                <div class="progress-track"><div class="progress-fill seeding" style="width:100%"></div></div>
                <span class="progress-pct" style="color: var(--green)">Done</span>
              </div>
            </td>
            <td class="col-size">2.1 MB</td>
            <td class="col-eta">&mdash;</td>
            <td><button class="go-to-file">Go to file</button></td>
            <td><div class="row-actions"><button><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg></button></div></td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

</body>
</html>
