<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#09090B">
<title>put.io — Login (Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #09090B;
    --surface: #19191B;
    --card: #1C1C1E;
    --text: #FAFAFA;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --text-4: #52525B;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.10);
    --green: #30D158;
    --red: #FF453A;
    --blue: #0A84FF;
    --sep: rgba(255,255,255,0.06);
    --radius: 8px;
    --radius-btn: 6px;
    --font: 'Inter', -apple-system, system-ui, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 13px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 1440px;
    height: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* ================================================================
     FORM CONTAINER
     ================================================================ */
  .login-container {
    width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
    z-index: 1;
  }

  /* ================================================================
     LOGO SVG
     ================================================================ */
  .logo-mark {
    margin-bottom: 40px;
  }

  .logo-mark svg {
    width: 56px;
    height: 56px;
  }

  .welcome-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 8px;
    text-align: center;
  }

  .welcome-subtitle {
    font-size: 14px;
    color: var(--text-3);
    margin-bottom: 36px;
    text-align: center;
  }

  /* ================================================================
     FORM
     ================================================================ */
  .form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 16px;
    margin-bottom: 24px;
  }

  .form-input {
    width: 100%;
    height: 48px;
    background: var(--card);
    border: 1px solid var(--sep);
    border-radius: var(--radius);
    padding: 0 16px;
    font-size: 14px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .form-input::placeholder {
    color: var(--text-4);
  }

  .form-input:focus {
    border-color: var(--yellow);
    box-shadow: 0 0 0 3px var(--yellow-dim);
  }

  /* ================================================================
     BUTTONS
     ================================================================ */
  .btn-primary {
    width: 100%;
    height: 48px;
    background: var(--yellow);
    color: var(--bg);
    font-size: 14px;
    font-weight: 600;
    font-family: var(--font);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: background 0.15s ease;
  }

  .btn-primary:hover {
    background: #F5C430;
  }

  .forgot-link {
    display: block;
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-3);
    text-decoration: none;
    margin-bottom: 28px;
    cursor: pointer;
  }

  .forgot-link:hover {
    color: var(--text-2);
  }

  /* ================================================================
     DIVIDER
     ================================================================ */
  .or-divider {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 28px;
  }

  .or-line {
    flex: 1;
    height: 1px;
    background: var(--sep);
  }

  .or-text {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-4);
    text-transform: lowercase;
  }

  .btn-outline {
    width: 100%;
    height: 48px;
    background: transparent;
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    font-family: var(--font);
    border: 1px solid var(--sep);
    border-radius: var(--radius);
    cursor: pointer;
    letter-spacing: -0.01em;
    transition: all 0.15s ease;
    margin-bottom: 48px;
  }

  .btn-outline:hover {
    border-color: rgba(255,255,255,0.12);
    color: var(--text);
    background: rgba(255,255,255,0.03);
  }

  /* ================================================================
     FOOTER
     ================================================================ */
  .login-footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
  }

  .footer-text {
    font-size: 12px;
    color: var(--text-4);
    font-weight: 400;
  }

  .footer-kaomoji {
    font-size: 13px;
    color: var(--text-4);
  }
</style>
</head>
<body>
<div class="page">

  <div class="login-container">

    <!-- Logo -->
    <div class="logo-mark">
      <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Stylized put.io logo -->
        <rect width="56" height="56" rx="14" fill="#1C1C1E"/>
        <text x="28" y="34" text-anchor="middle" font-family="Inter, sans-serif" font-weight="700" font-size="18" fill="#FAFAFA">put<tspan fill="#FDCE45">.</tspan>io</text>
      </svg>
    </div>

    <div class="welcome-title">Welcome back</div>
    <div class="welcome-subtitle">Sign in to your account</div>

    <!-- Form -->
    <div class="form">
      <input type="email" class="form-input" placeholder="Email" autocomplete="email">
      <input type="password" class="form-input" placeholder="Password" autocomplete="current-password">
      <button class="btn-primary">Sign in</button>
    </div>

    <a class="forgot-link">Forgot password?</a>

    <div class="or-divider">
      <div class="or-line"></div>
      <span class="or-text">or</span>
      <div class="or-line"></div>
    </div>

    <button class="btn-outline">Create account</button>

    <!-- Footer -->
    <div class="login-footer">
      <span class="footer-text">put.io &mdash; Istanbul, since 2011</span>
      <span class="footer-kaomoji">ᕦ(ò_óˇ)ᕤ</span>
    </div>

  </div>

</div>
</body>
</html>
