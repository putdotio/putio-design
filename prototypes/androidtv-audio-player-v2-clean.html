<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#0A0A0C">
<title>put.io — Android TV Audio Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #141416; --bg-3: #1E1E22; --bg-4: #28282E;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.15);
  }
  body {
    font-family: 'Inter', 'Roboto', sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .tv-frame {
    width: 1920px; height: 1080px; overflow: hidden;
    display: flex;
  }

  /* Side rail */
  .side-rail {
    width: 400px; flex-shrink: 0;
    background: var(--bg-2);
    border-right: 1px solid rgba(255,255,255,0.06);
    display: flex; flex-direction: column;
    padding: 48px 0;
  }

  /* Logo */
  .rail-header {
    padding: 0 40px;
    margin-bottom: 32px;
  }
  .atv-logo {
    font-size: 36px; font-weight: 700; letter-spacing: -0.02em;
  }
  .atv-logo span { color: var(--yellow); }

  /* Nav items */
  .nav-items {
    flex: 1;
    display: flex; flex-direction: column;
    gap: 4px;
    padding: 0 16px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 18px;
    padding: 18px 24px;
    border-radius: 14px;
    font-size: 22px; font-weight: 500;
    color: var(--text-2);
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.12s;
  }
  .nav-item:hover { background: var(--bg-3); }
  .nav-item.active {
    color: var(--text);
    background: var(--bg-3);
  }
  .nav-item svg { width: 28px; height: 28px; fill: currentColor; flex-shrink: 0; }

  /* Rail footer */
  .rail-footer {
    padding: 0 16px;
    margin-top: auto;
  }
  .storage-info {
    padding: 16px 24px;
    display: flex; align-items: center; gap: 14px;
  }
  .storage-bar {
    width: 100px; height: 4px;
    background: var(--bg-4);
    border-radius: 2px; overflow: hidden;
  }
  .storage-bar-fill {
    width: 78%; height: 100%;
    background: var(--yellow); border-radius: 2px;
  }
  .storage-label {
    font-size: 16px; color: var(--solid);
    font-variant-numeric: tabular-nums;
  }

  /* User row */
  .user-row {
    padding: 16px 24px;
    display: flex; align-items: center; gap: 14px;
    border-top: 1px solid rgba(255,255,255,0.06);
    margin-top: 8px;
  }
  .user-avatar {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--bg-4);
    display: flex; align-items: center; justify-content: center;
  }
  .user-avatar svg { width: 28px; height: 28px; }

  /* Main content area */
  .main-content {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 80px;
  }

  /* Album Art */
  .album-art {
    width: 360px; height: 360px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1a2a1e, #0a1a28);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 64px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .album-art svg {
    width: 80px; height: 80px;
    fill: rgba(255,255,255,0.15);
  }

  /* Track Info */
  .track-info {
    margin-top: 40px;
    text-align: center;
  }
  .track-title {
    font-size: 30px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .track-artist {
    font-size: 22px;
    color: var(--text-2);
    margin-top: 10px;
  }
  .track-badges {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }
  .badge {
    font-size: 15px; font-weight: 600;
    text-transform: uppercase;
    background: rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.7);
    padding: 5px 14px; border-radius: 8px;
    white-space: nowrap;
  }
  .track-size {
    font-size: 15px;
    color: var(--text-2);
  }

  /* Progress Bar */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin-top: 40px;
    width: 620px;
  }
  .time-current {
    font-size: 20px;
    font-weight: 500;
    color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 52px;
    text-align: right;
  }
  .time-remaining {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-2);
    font-variant-numeric: tabular-nums;
    min-width: 52px;
  }
  .progress-track {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.2);
    border-radius: 3px;
    position: relative;
  }
  .progress-fill {
    height: 100%;
    width: 35%;
    background: var(--yellow);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(253,206,69,0.3);
  }
  .progress-dot {
    width: 18px; height: 18px;
    background: var(--yellow);
    border-radius: 50%;
    position: absolute;
    top: 50%;
    left: 35%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 16px rgba(253,206,69,0.5), 0 0 4px rgba(253,206,69,0.8);
  }

  /* Transport Controls */
  .transport-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 44px;
    margin-top: 36px;
  }

  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.7);
    transition: all 0.15s;
    position: relative;
  }
  .ctrl-btn:hover { color: #fff; }
  .ctrl-btn svg { display: block; }

  .skip-btn {
    width: 52px; height: 52px;
    background: rgba(255,255,255,0.08);
    border-radius: 50%;
    position: relative;
  }
  .skip-btn svg {
    width: 22px; height: 22px;
  }
  .skip-label {
    position: absolute;
    font-size: 10px;
    font-weight: 700;
    color: rgba(255,255,255,0.7);
    bottom: 9px;
    left: 50%;
    transform: translateX(-50%);
  }

  .nav-btn {
    width: 36px; height: 36px;
  }
  .nav-btn svg {
    width: 36px; height: 36px;
  }

  .play-btn {
    width: 80px; height: 80px;
    background: rgba(253,206,69,0.12);
    border: 2px solid var(--yellow);
    border-radius: 50%;
    color: #fff;
    box-shadow: 0 0 0 4px rgba(253,206,69,0.2), 0 4px 24px rgba(253,206,69,0.15);
  }
  .play-btn svg {
    width: 32px; height: 32px;
  }

  /* Speed Selector */
  .speed-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
    margin-top: 28px;
  }
  .speed-option {
    font-size: 17px;
    font-weight: 500;
    color: var(--solid);
    padding: 7px 18px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.12s;
  }
  .speed-option.active {
    color: var(--yellow);
    font-weight: 600;
    background: var(--yellow-subtle);
  }

  /* D-pad hint */
  .dpad-hint {
    position: fixed; bottom: 36px; right: 60px;
    display: flex; align-items: center; gap: 12px;
    font-size: 16px; color: var(--solid);
  }
  .dpad-key {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 14px; font-weight: 600; color: var(--text-2);
  }
  .dpad-key svg { width: 18px; height: 18px; fill: currentColor; }
</style>
</head>
<body>
<div class="tv-frame">

  <!-- Side Rail -->
  <div class="side-rail">
    <div class="rail-header">
      <div class="atv-logo">put<span>.</span>io</div>
    </div>

    <div class="nav-items">
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        Home
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
        Browse
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
        Transfers
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        Search
      </div>
      <div class="nav-item">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
        Settings
      </div>
    </div>

    <div class="rail-footer">
      <div class="storage-info">
        <div class="storage-bar"><div class="storage-bar-fill"></div></div>
        <span class="storage-label">39.2 / 50 TB</span>
      </div>
      <div class="user-row">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" fill="none">
            <rect x="4" y="4" width="2" height="2" fill="#FDCE45"/>
            <rect x="18" y="4" width="2" height="2" fill="#FDCE45"/>
            <rect x="6" y="6" width="2" height="2" fill="#FDCE45"/>
            <rect x="16" y="6" width="2" height="2" fill="#FDCE45"/>
            <rect x="4" y="8" width="16" height="2" fill="#FDCE45"/>
            <rect x="4" y="10" width="2" height="2" fill="#FDCE45"/>
            <rect x="8" y="10" width="8" height="2" fill="#FDCE45"/>
            <rect x="18" y="10" width="2" height="2" fill="#FDCE45"/>
            <rect x="4" y="12" width="16" height="2" fill="#FDCE45"/>
            <rect x="6" y="14" width="4" height="2" fill="#FDCE45"/>
            <rect x="14" y="14" width="4" height="2" fill="#FDCE45"/>
          </svg>
        </div>
        <span style="font-size:18px; color:var(--text-2);">putiouser</span>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">

    <!-- Album Art -->
    <div class="album-art">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <div class="track-title">Cosmos.Laundromat.2015.4K.Blender.Open.Movie.FLAC</div>
      <div class="track-artist">Blender Foundation &middot; Soundtrack</div>
      <div class="track-badges">
        <span class="badge">FLAC</span>
        <span class="track-size">48.2 MB</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-row">
      <span class="time-current">2:34</span>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-dot"></div>
      </div>
      <span class="time-remaining">-4:48</span>
    </div>

    <!-- Transport Controls -->
    <div class="transport-controls">
      <!-- Skip Back 10s -->
      <button class="ctrl-btn skip-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-4px"><path d="M12.5 8L8 12l4.5 4"/><path d="M20 12a8 8 0 1 1-4.4-7.2"/></svg>
        <span class="skip-label">10</span>
      </button>

      <!-- Previous Track -->
      <button class="ctrl-btn nav-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- Play/Pause (Focused) -->
      <button class="ctrl-btn play-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Next Track -->
      <button class="ctrl-btn nav-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <!-- Skip Forward 10s -->
      <button class="ctrl-btn skip-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-4px"><path d="M11.5 8L16 12l-4.5 4"/><path d="M4 12a8 8 0 1 0 4.4-7.2"/></svg>
        <span class="skip-label">10</span>
      </button>
    </div>

    <!-- Speed Selector -->
    <div class="speed-selector">
      <span class="speed-option">0.5x</span>
      <span class="speed-option">0.75x</span>
      <span class="speed-option active">1x</span>
      <span class="speed-option">1.25x</span>
      <span class="speed-option">1.5x</span>
      <span class="speed-option">2x</span>
    </div>

  </div>

  <!-- D-pad Navigation Hints -->
  <div class="dpad-hint">
    <div class="dpad-key">
      <svg viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
    </div>
    <div class="dpad-key">
      <svg viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </div>
    Navigate
    <div class="dpad-key" style="width:auto; padding:0 12px;">OK</div>
    Play/Pause
    <div class="dpad-key">
      <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
    </div>
    Back
  </div>

</div>
</body>
</html>
