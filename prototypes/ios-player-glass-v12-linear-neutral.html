<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io — iOS Player Glass (v12 Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000000;
    --text: #F5F5F5;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --text-4: #3F3F46;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --yellow-glow: rgba(253,206,69,0.30);
    --red: #FF453A;
    --green: #30D158;
    --blue: #0A84FF;

    /* Glass Material System */
    --glass-thick: rgba(28,28,30,0.82);
    --glass-regular: rgba(28,28,30,0.72);
    --glass-thin: rgba(28,28,30,0.55);
    --glass-ultra-thin: rgba(28,28,30,0.35);
    --glass-border: rgba(255,255,255,0.08);
    --glass-separator: rgba(255,255,255,0.06);

    --blur-thick: blur(60px) saturate(180%);
    --blur-regular: blur(40px) saturate(160%);
    --blur-thin: blur(20px) saturate(140%);
    --blur-ultra-thin: blur(10px);

    --radius: 14px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .phone {
    width: 390px; height: 844px; overflow: hidden;
    position: relative;
    background: #000;
  }

  /* Video placeholder — full screen */
  .video-bg {
    position: absolute; inset: 0; z-index: 0;
    background:
      radial-gradient(ellipse 160% 80% at 50% 35%, rgba(50,42,18,0.6) 0%, transparent 60%),
      radial-gradient(ellipse 100% 50% at 30% 25%, rgba(60,48,20,0.35) 0%, transparent 50%),
      radial-gradient(ellipse 70% 40% at 70% 45%, rgba(40,30,10,0.25) 0%, transparent 50%),
      linear-gradient(180deg, #0C0A06 0%, #080706 40%, #0A0908 100%);
  }
  .video-label {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 11px; color: rgba(255,255,255,0.08);
    letter-spacing: 4px; text-transform: uppercase;
    font-weight: 500; z-index: 1;
  }

  /* Top glass bar — thin material */
  .top-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center;
    padding: 54px 16px 12px;
    background: var(--glass-thin);
    -webkit-backdrop-filter: var(--blur-thin);
    backdrop-filter: var(--blur-thin);
    border-bottom: 0.5px solid var(--glass-border);
    gap: 12px;
  }
  .top-back {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    flex-shrink: 0;
  }
  .top-title-area { flex: 1; min-width: 0; }
  .top-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .top-subtitle {
    font-size: 12px; color: var(--text-3); margin-top: 1px;
    font-weight: 400;
  }
  .top-actions {
    display: flex; gap: 8px; flex-shrink: 0;
  }
  .top-action-btn {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
  }

  /* Center controls */
  .center-controls {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex; align-items: center; gap: 32px;
  }
  .skip-btn {
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: var(--glass-ultra-thin);
    -webkit-backdrop-filter: var(--blur-ultra-thin);
    backdrop-filter: var(--blur-ultra-thin);
    border: 0.5px solid var(--glass-border);
    cursor: pointer;
    color: var(--text);
    transition: background 0.15s;
  }
  .skip-btn:active { background: rgba(255,255,255,0.1); }
  .play-btn {
    width: 72px; height: 72px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 999px;
    background: var(--glass-regular);
    -webkit-backdrop-filter: var(--blur-regular);
    backdrop-filter: var(--blur-regular);
    border: 0.5px solid var(--glass-border);
    cursor: pointer;
    color: var(--text);
    transition: transform 0.1s;
  }
  .play-btn:active { transform: scale(0.95); }

  /* Bottom glass bar — regular material */
  .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 10;
    background: var(--glass-regular);
    -webkit-backdrop-filter: var(--blur-regular);
    backdrop-filter: var(--blur-regular);
    border-top: 0.5px solid var(--glass-border);
    padding: 16px 20px 20px;
  }

  /* Progress scrubber */
  .scrubber {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 14px;
  }
  .scrubber-time {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    width: 40px;
  }
  .scrubber-time.end { text-align: right; }
  .scrubber-track {
    flex: 1; height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 999px;
    position: relative;
    cursor: pointer;
  }
  .scrubber-fill {
    height: 100%; width: 38%;
    background: var(--yellow);
    border-radius: 999px;
    position: relative;
  }
  .scrubber-fill::after {
    content: '';
    position: absolute; right: -6px; top: -4px;
    width: 12px; height: 12px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 12px 3px var(--yellow-glow);
  }
  .scrubber-buffer {
    position: absolute; top: 0; left: 0;
    height: 100%; width: 52%;
    background: rgba(255,255,255,0.08);
    border-radius: 999px;
  }

  /* Action pills */
  .action-pills {
    display: flex; gap: 8px; justify-content: center;
    flex-wrap: wrap;
  }
  .action-pill {
    padding: 8px 16px;
    border-radius: 999px;
    font-size: 13px; font-weight: 500;
    color: var(--text-2);
    background: var(--glass-ultra-thin);
    -webkit-backdrop-filter: var(--blur-ultra-thin);
    backdrop-filter: var(--blur-ultra-thin);
    border: 0.5px solid var(--glass-border);
    cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    transition: background 0.15s;
  }
  .action-pill:active { background: rgba(255,255,255,0.08); }
  .action-pill.active-pill {
    color: var(--yellow);
    border-color: rgba(253,206,69,0.2);
  }

  /* Up Next sheet — thick glass peeking */
  .up-next-sheet {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 15;
    background: var(--glass-thick);
    -webkit-backdrop-filter: var(--blur-thick);
    backdrop-filter: var(--blur-thick);
    border-top: 0.5px solid var(--glass-border);
    border-radius: 16px 16px 0 0;
    padding: 0 20px 34px;
    transform: translateY(calc(100% - 72px));
  }
  .sheet-handle {
    width: 36px; height: 4px;
    background: rgba(255,255,255,0.2);
    border-radius: 999px;
    margin: 8px auto 12px;
  }
  .sheet-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .sheet-title {
    font-size: 15px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }
  .sheet-see-all {
    font-size: 13px; font-weight: 500; color: var(--yellow);
    cursor: pointer;
  }

  /* Up Next items */
  .up-next-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 0;
    position: relative;
  }
  .up-next-item + .up-next-item::before {
    content: '';
    position: absolute; top: 0; left: 56px; right: 0;
    height: 0.5px;
    background: var(--glass-separator);
  }
  .up-next-thumb {
    width: 56px; height: 32px;
    border-radius: 5px;
    background: linear-gradient(135deg, rgba(40,35,20,0.8), rgba(20,18,10,0.9));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border: 0.5px solid rgba(255,255,255,0.06);
    position: relative;
    overflow: hidden;
  }
  .up-next-thumb::after {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(135deg, rgba(253,206,69,0.05), transparent);
  }
  .up-next-info { flex: 1; min-width: 0; }
  .up-next-name {
    font-size: 14px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .up-next-meta {
    font-size: 12px; color: var(--text-3); margin-top: 1px;
  }
  .up-next-duration {
    font-size: 12px; color: var(--text-3);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
</style>
</head>
<body>
