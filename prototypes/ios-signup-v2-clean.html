<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io -- iOS Sign Up (Clean)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000; --bg-2: #1C1C1E; --bg-3: #2C2C2E; --bg-4: #3A3A3C;
    --line: #38383A; --solid: #8E8E93; --text-2: #AEAEB2; --text: #FFFFFF;
    --yellow: #FDCE45; --yellow-subtle: rgba(253,206,69,0.15);
    --green: #30D158; --red: #FF453A;
  }
  body { font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .phone { width: 390px; height: 844px; overflow: hidden; display: flex; flex-direction: column; position: relative; }

  /* Status Bar */
  .status-bar {
    display: flex; align-items: center; padding: 12px 24px 0;
    font-size: 15px; font-weight: 600; height: 54px; flex-shrink: 0;
  }
  .status-bar .time { flex: 1; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* Nav */
  .nav-bar { display: flex; align-items: center; padding: 8px 24px 8px; flex-shrink: 0; }
  .nav-back { font-size: 17px; color: var(--yellow); display: flex; align-items: center; gap: 4px; }
  .nav-back svg { width: 20px; height: 20px; fill: var(--yellow); }
  .nav-spacer { flex: 1; }

  .content { flex: 1; overflow-y: auto; padding: 0 24px; }

  .page-title { font-size: 34px; font-weight: 700; margin-bottom: 4px; padding-top: 8px; }
  .page-subtitle { font-size: 15px; color: var(--solid); margin-bottom: 24px; }

  /* Space Invader */
  .invader-row { display: flex; justify-content: center; margin-bottom: 20px; }
  .invader-badge {
    width: 56px; height: 56px; background: var(--yellow-subtle); border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
  }

  /* Form */
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 13px; font-weight: 500; color: var(--text-2); margin-bottom: 6px; display: block; }
  .form-input {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; font-size: 17px; color: var(--text); font-family: inherit; outline: none;
  }
  .form-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 3px var(--yellow-subtle); }
  .form-input::placeholder { color: var(--solid); }

  /* Password strength */
  .pw-strength { display: flex; gap: 4px; margin-top: 8px; }
  .pw-bar { flex: 1; height: 3px; border-radius: 2px; background: var(--bg-4); }
  .pw-bar.on { background: var(--yellow); }
  .pw-bar.green { background: var(--green); }
  .pw-hint { font-size: 11px; color: var(--solid); margin-top: 4px; }

  /* Plan Preview */
  .plan-preview { margin: 20px 0; }
  .plan-label { font-size: 13px; font-weight: 600; color: var(--text-2); margin-bottom: 10px; }
  .plan-cards { display: flex; gap: 8px; }
  .plan-card {
    flex: 1; padding: 14px 10px; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 14px; text-align: center;
  }
  .plan-card.selected { border-color: var(--yellow); background: var(--yellow-subtle); }
  .plan-name { font-size: 12px; font-weight: 600; margin-bottom: 2px; }
  .plan-price { font-size: 18px; font-weight: 700; color: var(--yellow); }
  .plan-size { font-size: 11px; color: var(--solid); margin-top: 2px; }

  .terms-text { font-size: 12px; color: var(--solid); line-height: 1.5; margin-bottom: 16px; }
  .terms-text a { color: var(--yellow); text-decoration: none; }

  .btn-create {
    width: 100%; padding: 17px; border-radius: 14px; border: none;
    background: var(--yellow); color: #111113; font-size: 17px; font-weight: 600;
    cursor: pointer; font-family: inherit; margin-bottom: 16px;
  }

  .signin-row { text-align: center; font-size: 15px; color: var(--solid); margin-bottom: 20px; }
  .signin-link { color: var(--yellow); text-decoration: none; font-weight: 500; }

  .home-indicator {
    width: 134px; height: 5px; background: var(--text); border-radius: 3px;
    margin: 12px auto 8px; opacity: 0.3;
  }
</style>
</head>
<body>
<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <div class="time">9:41</div>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="3" width="3" height="9" rx="0.5" opacity="0.3"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" opacity="0.5"/><rect x="9" y="1" width="3" height="11" rx="0.5" opacity="0.7"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="15" height="12" viewBox="0 0 15 12" fill="white"><path d="M7.5 3.6c1.8 0 3.4.7 4.6 1.9l1.4-1.4C11.8 2.4 9.8 1.6 7.5 1.6S3.2 2.4 1.5 4.1l1.4 1.4C4.1 4.3 5.7 3.6 7.5 3.6z" opacity="0.5"/><path d="M7.5 6.6c1.1 0 2.1.4 2.8 1.1l1.4-1.4c-1.1-1.1-2.6-1.7-4.2-1.7s-3.1.6-4.2 1.7l1.4 1.4C5.4 7 6.4 6.6 7.5 6.6z" opacity="0.7"/><circle cx="7.5" cy="10.5" r="1.5"/></svg>
      <svg width="25" height="12" viewBox="0 0 25 12" fill="white"><rect x="0" y="1" width="22" height="10" rx="2" stroke="white" stroke-width="1" fill="none"/><rect x="23" y="4" width="2" height="4" rx="0.5"/><rect x="1.5" y="2.5" width="17" height="7" rx="1" fill="white"/></svg>
    </div>
  </div>

  <!-- Nav -->
  <div class="nav-bar">
    <div class="nav-back">
      <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
      Back
    </div>
    <div class="nav-spacer"></div>
  </div>

  <div class="content">
    <!-- Space Invader -->
    <div class="invader-row">
      <div class="invader-badge">
        <svg width="28" height="28" viewBox="0 0 48 48" fill="none">
          <rect x="8" y="4" width="4" height="4" fill="#FDCE45"/>
          <rect x="36" y="4" width="4" height="4" fill="#FDCE45"/>
          <rect x="12" y="8" width="4" height="4" fill="#FDCE45"/>
          <rect x="32" y="8" width="4" height="4" fill="#FDCE45"/>
          <rect x="8" y="12" width="32" height="4" fill="#FDCE45"/>
          <rect x="4" y="16" width="8" height="4" fill="#FDCE45"/>
          <rect x="16" y="16" width="16" height="4" fill="#FDCE45"/>
          <rect x="36" y="16" width="8" height="4" fill="#FDCE45"/>
          <rect x="4" y="20" width="40" height="4" fill="#FDCE45"/>
          <rect x="8" y="24" width="4" height="4" fill="#FDCE45"/>
          <rect x="16" y="24" width="4" height="4" fill="#FDCE45"/>
          <rect x="28" y="24" width="4" height="4" fill="#FDCE45"/>
          <rect x="36" y="24" width="4" height="4" fill="#FDCE45"/>
        </svg>
      </div>
    </div>

    <h1 class="page-title">Create Account</h1>
    <p class="page-subtitle">Join the put.io family (*^_^*)</p>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" placeholder="you@example.com" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="Choose a strong password" />
      <div class="pw-strength">
        <div class="pw-bar on"></div>
        <div class="pw-bar on"></div>
        <div class="pw-bar on"></div>
        <div class="pw-bar"></div>
      </div>
      <div class="pw-hint">12+ chars, mixed case, numbers, symbols</div>
    </div>

    <!-- Plan Preview -->
    <div class="plan-preview">
      <div class="plan-label">Choose your plan</div>
      <div class="plan-cards">
        <div class="plan-card">
          <div class="plan-name">Starter</div>
          <div class="plan-price">$9.99</div>
          <div class="plan-size">100 GB</div>
        </div>
        <div class="plan-card selected">
          <div class="plan-name">Plus</div>
          <div class="plan-price">$19.99</div>
          <div class="plan-size">1 TB</div>
        </div>
        <div class="plan-card">
          <div class="plan-name">Pro</div>
          <div class="plan-price">$49.99</div>
          <div class="plan-size">10 TB</div>
        </div>
      </div>
    </div>

    <div class="terms-text">
      By creating an account, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
    </div>

    <button class="btn-create">Create Account</button>

    <div class="signin-row">
      Already have an account? <a class="signin-link">Sign in</a>
    </div>
  </div>

  <div class="home-indicator"></div>
</div>
</body>
</html>
