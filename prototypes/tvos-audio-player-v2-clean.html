<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#0A0A0C">
<title>put.io — tvOS Audio Player</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #141416; --bg-3: #1E1E22; --bg-4: #28282E;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.15);
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .tv-frame {
    width: 1920px; height: 1080px; padding: 60px 80px; display: flex;
  }

  /* Side Rail */
  .side-rail {
    width: 300px; flex-shrink: 0; padding-right: 48px;
    display: flex; flex-direction: column;
  }
  .tv-logo {
    font-size: 38px; font-weight: 700; margin-bottom: 48px;
    letter-spacing: -0.02em;
  }
  .tv-logo span { color: var(--yellow); }
  .rail-item {
    display: flex; align-items: center; gap: 16px;
    padding: 16px 0; font-size: 24px; color: var(--text-2);
    cursor: pointer;
  }
  .rail-item:hover { color: var(--text); }
  .rail-item.active {
    color: var(--text); font-weight: 600;
    padding: 16px 24px; margin: 0 -24px;
    background: var(--bg-3); border-radius: 16px;
  }
  .rail-item .r-icon { width: 36px; display: flex; align-items: center; justify-content: center; }
  .rail-item .r-icon svg { width: 28px; height: 28px; fill: currentColor; }
  .rail-spacer { flex: 1; }
  .rail-storage {
    font-size: 18px; color: var(--solid);
    padding-top: 24px; border-top: 1px solid var(--line);
  }
  .rail-storage-bar { width: 100%; height: 6px; background: var(--bg-4); border-radius: 3px; margin-top: 12px; overflow: hidden; }
  .rail-storage-fill { height: 100%; background: var(--yellow); border-radius: 3px; }
  .rail-user { display: flex; align-items: center; gap: 12px; margin-top: 24px; }
  .rail-avatar {
    width: 48px; height: 48px; background: var(--bg-4); border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
  }
  .rail-username { font-size: 20px; color: var(--text-2); }

  /* Content Area */
  .tv-content {
    flex: 1; overflow: hidden;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* Album Art */
  .album-art {
    width: 340px; height: 340px;
    border-radius: 20px;
    background: linear-gradient(135deg, #1a2a1e, #0a1a28);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .album-art svg {
    width: 80px; height: 80px;
    fill: rgba(255,255,255,0.15);
  }

  /* Track Info */
  .track-info {
    margin-top: 36px;
    text-align: center;
  }
  .track-title {
    font-size: 28px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }
  .track-artist {
    font-size: 20px; color: var(--text-2);
    margin-top: 8px;
  }
  .track-badges {
    display: flex; align-items: center; justify-content: center;
    gap: 10px; margin-top: 14px;
  }
  .badge {
    font-size: 16px; font-weight: 600;
    text-transform: uppercase;
    background: rgba(255,255,255,0.08);
    color: var(--text-2);
    padding: 6px 16px; border-radius: 8px;
    white-space: nowrap; line-height: 1.4;
  }
  .track-size {
    font-size: 16px; color: var(--text-2);
  }

  /* Progress Bar */
  .progress-row {
    display: flex; align-items: center; gap: 16px;
    margin-top: 36px; width: 600px;
  }
  .time-current {
    font-size: 18px; font-weight: 500; color: var(--text);
    font-variant-numeric: tabular-nums;
    min-width: 48px; text-align: right;
  }
  .time-remaining {
    font-size: 18px; font-weight: 500; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    min-width: 48px;
  }
  .progress-track {
    flex: 1; height: 6px;
    background: var(--bg-4);
    border-radius: 3px; position: relative;
  }
  .progress-fill {
    height: 100%; width: 35%;
    background: var(--yellow);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(253, 206, 69, 0.3);
  }
  .progress-dot {
    width: 16px; height: 16px;
    background: #fff;
    border-radius: 50%;
    position: absolute; top: 50%; left: 35%;
    transform: translate(-50%, -50%);
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }

  /* Transport Controls */
  .transport-controls {
    display: flex; align-items: center; justify-content: center;
    gap: 40px; margin-top: 32px;
  }

  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.8);
    position: relative;
    transition: all 0.15s;
  }
  .ctrl-btn:hover { color: #fff; }
  .ctrl-btn svg { display: block; }

  .skip-btn {
    width: 48px; height: 48px;
    background: rgba(255,255,255,0.06);
    border-radius: 50%;
    position: relative;
  }
  .skip-label {
    position: absolute;
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.8);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    margin-top: 2px;
  }

  .nav-btn {
    width: 32px; height: 32px;
  }
  .nav-btn svg {
    width: 32px; height: 32px;
  }

  .play-btn {
    width: 72px; height: 72px;
    background: rgba(253, 206, 69, 0.1);
    border: 2px solid var(--yellow);
    border-radius: 50%;
    color: #fff;
    box-shadow: 0 0 0 4px rgba(253,206,69,0.15);
  }
  .play-btn svg {
    width: 28px; height: 28px;
  }

  /* Speed Selector */
  .speed-selector {
    display: flex; align-items: center; justify-content: center;
    gap: 0; margin-top: 28px;
  }
  .speed-option {
    font-size: 16px; font-weight: 500; color: var(--solid);
    padding: 6px 16px; border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .speed-option.active {
    color: var(--yellow); font-weight: 600;
    background: var(--yellow-subtle);
  }
</style>
</head>
<body>
<div class="tv-frame">
  <!-- Side Rail Navigation -->
  <div class="side-rail">
    <div class="tv-logo">put<span>.</span>io</div>

    <div class="rail-item">
      <span class="r-icon">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
      </span> Home
    </div>
    <div class="rail-item active">
      <span class="r-icon">
        <svg viewBox="0 0 24 24"><path d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/></svg>
      </span> Files
    </div>
    <div class="rail-item">
      <span class="r-icon">
        <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      </span> Search
    </div>
    <div class="rail-item">
      <span class="r-icon">
        <svg viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
      </span> Transfers
    </div>
    <div class="rail-item">
      <span class="r-icon">
        <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.31.06-.63.06-.94 0-.31-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.49.49 0 00-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.44.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96a.49.49 0 00-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </span> Settings
    </div>

    <div class="rail-spacer"></div>

    <div class="rail-storage">
      11 TB of 50 TB free
      <div class="rail-storage-bar"><div class="rail-storage-fill" style="width:78%;"></div></div>
    </div>

    <div class="rail-user">
      <div class="rail-avatar">
        <svg viewBox="0 0 24 24" width="28" height="28" fill="none">
          <rect x="4" y="4" width="2" height="2" fill="#FDCE45"/>
          <rect x="18" y="4" width="2" height="2" fill="#FDCE45"/>
          <rect x="6" y="6" width="2" height="2" fill="#FDCE45"/>
          <rect x="16" y="6" width="2" height="2" fill="#FDCE45"/>
          <rect x="4" y="8" width="16" height="2" fill="#FDCE45"/>
          <rect x="4" y="10" width="2" height="2" fill="#FDCE45"/>
          <rect x="8" y="10" width="8" height="2" fill="#FDCE45"/>
          <rect x="18" y="10" width="2" height="2" fill="#FDCE45"/>
          <rect x="4" y="12" width="16" height="2" fill="#FDCE45"/>
          <rect x="6" y="14" width="4" height="2" fill="#FDCE45"/>
          <rect x="14" y="14" width="4" height="2" fill="#FDCE45"/>
        </svg>
      </div>
      <span class="rail-username">alex</span>
    </div>
  </div>

  <!-- Content -->
  <div class="tv-content">
    <!-- Album Art -->
    <div class="album-art">
      <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
    </div>

    <!-- Track Info -->
    <div class="track-info">
      <div class="track-title">Cosmos.Laundromat.2015.4K.Blender.Open.Movie.FLAC</div>
      <div class="track-artist">Blender Foundation · Soundtrack</div>
      <div class="track-badges">
        <span class="badge">FLAC</span>
        <span class="track-size">48.2 MB</span>
      </div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-row">
      <span class="time-current">2:34</span>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-dot"></div>
      </div>
      <span class="time-remaining">-4:48</span>
    </div>

    <!-- Transport Controls -->
    <div class="transport-controls">
      <!-- Skip Back 10s -->
      <button class="ctrl-btn skip-btn" style="position:relative;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1,4V10H7"/><path d="M1,10A10,10,0,1,1,3.51,17.36"/>
        </svg>
        <span class="skip-label">10</span>
      </button>

      <!-- Previous Track -->
      <button class="ctrl-btn nav-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>

      <!-- Play/Pause (Focused) -->
      <button class="ctrl-btn play-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>

      <!-- Next Track -->
      <button class="ctrl-btn nav-btn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>

      <!-- Skip Forward 10s -->
      <button class="ctrl-btn skip-btn" style="position:relative;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23,4V10H17"/><path d="M23,10A10,10,0,1,1,20.49,17.36"/>
        </svg>
        <span class="skip-label">10</span>
      </button>
    </div>

    <!-- Speed Selector -->
    <div class="speed-selector">
      <span class="speed-option">0.5x</span>
      <span class="speed-option">0.75x</span>
      <span class="speed-option active">1x</span>
      <span class="speed-option">1.25x</span>
      <span class="speed-option">1.5x</span>
      <span class="speed-option">2x</span>
    </div>
  </div>
</div>
</body>
</html>
