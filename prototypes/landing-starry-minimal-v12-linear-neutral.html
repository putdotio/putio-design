<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --yellow: #FDCE45;
    --yellow-hover: #FDD85C;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
  }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: #fff;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv11' 1, 'ss01' 1;
  }

  .page {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ===== FULL-SCREEN STARRY CANVAS ===== */
  .starry-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    z-index: 0;
  }

  /* ===== NAV: barely there ===== */
  .nav {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 40px;
    z-index: 10;
  }

  .logo {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: -0.02em;
    text-decoration: none;
    color: rgba(255, 255, 255, 0.4);
    transition: color 0.3s;
  }
  .logo:hover {
    color: rgba(255, 255, 255, 0.6);
  }
  .logo .dot {
    color: rgba(253, 206, 69, 0.4);
    transition: color 0.3s;
  }
  .logo:hover .dot {
    color: rgba(253, 206, 69, 0.6);
  }

  .sign-in {
    font-size: 14px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.3);
    text-decoration: none;
    transition: color 0.3s;
  }
  .sign-in:hover {
    color: rgba(255, 255, 255, 0.5);
  }

  /* ===== CENTER CONTENT ===== */
  .center {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    pointer-events: none;
  }

  .tagline {
    font-size: 16px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: -0.01em;
    margin-top: 240px;
    text-align: center;
    pointer-events: none;
  }

  .cta {
    display: inline-flex;
    align-items: center;
    margin-top: 24px;
    background: var(--yellow);
    color: #000000;
    font-size: 14px;
    font-weight: 600;
    padding: 10px 28px;
    border-radius: 999px;
    border: none;
    cursor: pointer;
    font-family: inherit;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
    pointer-events: auto;
  }
  .cta:hover {
    background: var(--yellow-hover);
    transform: scale(1.03);
  }

  /* ===== BOTTOM CORNERS ===== */
  .bottom-left {
    position: absolute;
    bottom: 28px;
    left: 40px;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.15);
    z-index: 10;
  }

  .bottom-right {
    position: absolute;
    bottom: 28px;
    right: 40px;
    font-size: 12px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.15);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="page">
  <!-- Full-screen starry night canvas -->
  <canvas id="starry-canvas" class="starry-canvas"></canvas>

  <!-- Nav: barely there -->
  <nav class="nav">
    <a href="#" class="logo">put<span class="dot">.</span>io</a>
    <a href="#" class="sign-in">Sign in</a>
  </nav>

  <!-- Center content -->
  <div class="center">
    <p class="tagline">The cloud storage service with a certain gravity</p>
    <a href="#" class="cta">Get Started</a>
  </div>

  <!-- Bottom corners -->
  <span class="bottom-left">Istanbul, since 2011</span>
  <span class="bottom-right">ᕦ(ò_óˇ)ᕤ</span>
</div>

<!-- ===== STARRY NIGHT ANIMATION ===== -->
<script>
// StarryNightConfig
function StarryNightConfig() {
  return {
    "pixelRatio": 0, "fps": { "throttle": true, "target": 30 },
    "logo": { "scale": 0.6681539682539683 },
    "sparkles": { "enabled": true, "frequency": 4, "age": 500, "width": 3.1746031746031744, "height": 5.291005291005291, "thickness": 0.1, "minDistance": 0.2, "maxDistance": 0.95 },
    "meteors": { "enabled": true, "frequency": 0.5, "angle": 0.44, "age": 500, "length": 0.75, "thickness": 0.7407407407407408 },
    "radialDots": { "minRadius": 0.26455026455026454, "maxRadius": 0.5291005291005291 },
    "waveDots": { "minRadius": 0.26455026455026454, "maxRadius": 0.5291005291005291 },
    "radial": { "enabled": true, "perspective": 1.5999999999999996, "speed": -0.1749095295536791, "dotCount": 100, "minDistance": 0.5890056867137687, "maxDistance": 0.95, "tapering": 0.14785455798724798 },
    "waves": [
      { "enabled": true, "speed": 1.6176183350000002, "horizPos": 0.05962433224194382, "vertPos": 0.3353437876960193, "length": 0.5779769084956057, "phase": 0.7985524728588661, "period": 0.9308978114768224, "amplitude": 0.15, "amplitudeJitter": 0.25, "spacingJitter": 0.1, "tapering": 0.2 },
      { "enabled": true, "speed": -1.6176183350000002, "horizPos": 0.5118042391866277, "vertPos": 0.6441495778045838, "length": 0.5, "phase": 0, "period": 1, "amplitude": 0.15, "amplitudeJitter": 0.25, "spacingJitter": 0.1, "tapering": 0.2 },
      { "enabled": true, "speed": 2.1837847519999998, "horizPos": 0.13, "vertPos": 0.5448905738411166, "length": 0.41254523522316044, "phase": 0.158883336205411, "period": 0.3463725659141823, "amplitude": 0.23608478373255212, "amplitudeJitter": 0.22505600551438912, "spacingJitter": 0.12, "tapering": 0.2 }
    ]
  };
}
</script>
<script>
// StarryNightModel
function StarryNightModel(config) {
  this.waveDots = []; this.radialDots = []; this.sparkles = []; this.meteors = [];
  this.getTotalObjects = function () { return this.waveDots.reduce(function (total, dots) { return total + dots.length; }, 0) + this.radialDots.length + this.sparkles.length + this.meteors.length; };
  this.createRadialDots = function () { var dots = []; for (var i = 0; i < config.radial.dotCount; i++) { dots.push({ a: Math.random(), d: Math.random(), r: Math.random() * 2 - 1 }); } this.radialDots = dots; };
  this.createWaveDots = function (idx) { var waveConfig = config.waves[idx]; var dots = []; var x = 0; while (x < waveConfig.length) { var dot = { a: Math.random() * 2 - 1, r: Math.random() * 2 - 1 }; var radius = (config.waveDots.minRadius + (1 + dot.r) * (config.waveDots.maxRadius - config.waveDots.minRadius) / 2) / 100; dot.p = (x + radius) / waveConfig.length; dots.push(dot); x += radius * 2 + Math.random() * waveConfig.spacingJitter * waveConfig.spacingJitter; } this.waveDots[idx] = dots; };
  this.createAllWaveDots = function () { for (var idx = 0; idx < config.waves.length; idx++) { if (config.waves[idx].enabled) { this.createWaveDots(idx); } else { this.waveDots[idx] = []; } } };
  this.createMeteor = function (t) { this.meteors.push({ p: Math.random(), t: t }); };
  this.createSparkle = function (t) { var a = Math.random() * Math.PI * 2; var d = config.sparkles.minDistance + Math.random() * (config.sparkles.maxDistance - config.sparkles.minDistance); this.sparkles.push({ x: Math.cos(a) * d, y: Math.sin(a) * d, t: t }); };
  this.cullMeteors = function (t) { this.meteors = this.meteors.filter(function (meteor) { return t - meteor.t <= config.meteors.age * (1 + config.meteors.length); }); };
  this.cullSparkles = function (t) { this.sparkles = this.sparkles.filter(function (sparkle) { return t - sparkle.t <= config.sparkles.age; }); };
  this.deleteRadialDots = function () { this.radialDots = []; };
  this.deleteWaveDots = function (idx) { this.waveDots[idx] = []; };
  this.deleteAllWaveDots = function () { for (var i = 0; i < this.waveDots.length; i++) { this.deleteWaveDots(i); } };
  this.deleteSparkles = function () { this.sparkles = []; };
  this.deleteMeteors = function () { this.meteors = []; };
}
</script>
<script>
// StarryNightView
function StarryNightView(model, canvas, logo, config) {
  this.resize = function () { var pixelRatio = config.pixelRatio || window.devicePixelRatio || 1; canvas.width = canvas.offsetWidth * pixelRatio; canvas.height = canvas.offsetHeight * pixelRatio; };
  this.repaint = function (t) {
    var ctx = canvas.getContext('2d'); var normH = canvas.height / canvas.width;
    ctx.fillStyle = '#fff'; ctx.globalCompositeOperation = 'source-over'; ctx.scale(canvas.width, canvas.width); ctx.clearRect(0, 0, 1, normH);
    for (var i = 0; i < model.radialDots.length; i++) { var dot = model.radialDots[i]; var a = dot.a * Math.PI * 2; var pos = t / 100 * Math.pow(config.radial.speed, 3) % 1; if (pos < 0) { pos += 1; } var dotD = (pos + dot.d) % 1; var dotD2 = 1 - dotD; var scale = dotD < config.radial.tapering ? dotD / config.radial.tapering : dotD2 < config.radial.tapering ? dotD2 / config.radial.tapering : 1; dotD = config.radial.minDistance + dotD * (config.radial.maxDistance - config.radial.minDistance); var dotR = (config.radialDots.minRadius + (1 + dot.r) * (config.radialDots.maxRadius - config.radialDots.minRadius) / 2) / 100; if (config.radial.perspective) { dotD = Math.pow(dotD, config.radial.perspective); dotR *= dotD; } var dx = Math.cos(a) * dotD; var dy = Math.sin(a) * dotD; var x = (dx + 1) / 2; var y = (dy + 1) * normH / 2; ctx.beginPath(); ctx.arc(x, y, dotR * scale, 0, Math.PI * 2); ctx.fill(); }
    for (var i = 0; i < config.waves.length; i++) { var waveConfig = config.waves[i]; var dots = model.waveDots[i] || []; var maxX = waveConfig.length; var pos = (t * Math.pow(waveConfig.speed / 100, 3)) % maxX; if (pos < 0) { pos += maxX; } for (var j = 0; j < dots.length; j++) { var dot = dots[j]; var dotX = (pos + dot.p * maxX) % maxX; var dotP = dotX / maxX; var x = waveConfig.horizPos + dotX; var y = ((Math.sin((dotP * waveConfig.period + waveConfig.phase) * Math.PI * 2)) * waveConfig.amplitude + dot.a * waveConfig.amplitudeJitter * waveConfig.amplitudeJitter + waveConfig.vertPos) * normH; var dotP2 = 1 - dotP; var scale = dotP < waveConfig.tapering ? dotP / waveConfig.tapering : dotP2 < waveConfig.tapering ? dotP2 / waveConfig.tapering : 1; var radius = (config.waveDots.minRadius + (1 + dot.r) * (config.waveDots.maxRadius - config.waveDots.minRadius) / 2) / 100; ctx.beginPath(); ctx.arc(x, y, radius * scale, 0, Math.PI * 2); ctx.fill(); } }
    var logoAspectRatio = logo.width / logo.height; var logoW = config.logo.scale; var logoH = logoW / logoAspectRatio;
    ctx.globalCompositeOperation = 'xor'; ctx.drawImage(logo, 0, 0, logo.width, logo.height, (1 - logoW) / 2, (normH - logoH) / 2, logoW, logoH); ctx.globalCompositeOperation = 'source-over';
    var halfW = config.sparkles.width / 100 / 2; var halfH = config.sparkles.height / 100 / 2; var aspectRatio = config.sparkles.width / config.sparkles.height; var foldW = halfW * config.sparkles.thickness; var foldH = halfH * config.sparkles.thickness * aspectRatio;
    for (var i = model.sparkles.length; i--;) { var sparkle = model.sparkles[i]; var age = t - sparkle.t; if (age > config.sparkles.age) { continue; } var scale = age / config.sparkles.age; scale = 1 - Math.abs(0.5 - scale) * 2; var x = (sparkle.x + 1) / 2; var y = (sparkle.y + 1) * normH / 2; ctx.beginPath(); ctx.moveTo(x, y - halfH * scale); ctx.lineTo(x + foldW * scale, y - foldH * scale); ctx.lineTo(x + halfW * scale, y); ctx.lineTo(x + foldW * scale, y + foldH * scale); ctx.lineTo(x, y + halfH * scale); ctx.lineTo(x - foldW * scale, y + foldH * scale); ctx.lineTo(x - halfW * scale, y); ctx.lineTo(x - foldW * scale, y - foldH * scale); ctx.fill(); }
    var r = Math.sqrt(1 + normH * normH) / 2; ctx.translate(1 / 2, normH / 2); ctx.rotate(config.meteors.angle * Math.PI * 2);
    for (var i = model.meteors.length; i--;) { var meteor = model.meteors[i]; var age = t - meteor.t; if (age > config.meteors.age * (1 + config.meteors.length)) { continue; } var x = (age / config.meteors.age - 0.5) * r * 2; var y = (meteor.p - 0.5) * normH; ctx.beginPath(); ctx.arc(x, y, config.meteors.thickness / 100 / 2, Math.PI / 2, -Math.PI / 2, true); ctx.lineTo(x - config.meteors.length * 2 * r, y); ctx.fill(); }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  };
}
</script>
<script>
// StarryNightController
function StarryNightController(model, view, config) {
  var listeners = this; view.resize(); model.createRadialDots(); model.createAllWaveDots();
  function repaint(t) { listeners.onBeginRender && listeners.onBeginRender(); if (config.fps.throttle) { setTimeout(function () { requestAnimationFrame(repaint); }, 1000 / config.fps.target); } else { requestAnimationFrame(repaint); } view.repaint(t); if (config.meteors.enabled) { model.cullMeteors(t); if (Math.random() < config.meteors.frequency / 100) { model.createMeteor(t); } } if (config.sparkles.enabled) { model.cullSparkles(t); if (Math.random() < config.sparkles.frequency / 100) { model.createSparkle(t); } } listeners.onEndRender && listeners.onEndRender(); }
  requestAnimationFrame(repaint);
}
</script>
<script>
// Initialize Starry Night
(function () {
  var canvas = document.getElementById('starry-canvas');
  var logo = new Image();
  logo.crossOrigin = 'anonymous';
  logo.src = 'https://raw.githubusercontent.com/atesgoral/put.io.starry.night/master/logo.png';
  logo.onload = function () {
    var config = StarryNightConfig();
    var model = new StarryNightModel(config);
    var view = new StarryNightView(model, canvas, logo, config);
    var controller = new StarryNightController(model, view, config);
    window.addEventListener('resize', function () { view.resize(); });
  };
})();
</script>

</body>
