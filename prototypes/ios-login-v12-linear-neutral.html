<title>put.io — iOS Login (v12 Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000000;
    --surface: #111113;
    --surface-2: #1C1C1E;
    --elevated: #2C2C2E;
    --text: #FFFFFF;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --line: rgba(255,255,255,0.06);
    --radius: 12px;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg);
  }

  /* Status Bar */
  .status-bar {
    display: flex; align-items: center; padding: 14px 28px 0;
    font-size: 15px; font-weight: 600; height: 54px; flex-shrink: 0;
  }
  .status-bar .time { flex: 1; letter-spacing: -0.3px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* Login form container */
  .login-container {
    flex: 1;
    display: flex; flex-direction: column;
    padding: 0 32px;
  }

  .logo-area {
    display: flex; flex-direction: column; align-items: center;
    padding-top: 72px;
    margin-bottom: 48px;
  }
  .logo {
    font-size: 28px; font-weight: 700; letter-spacing: -0.04em;
    color: var(--text);
    margin-bottom: 4px;
  }
  .logo span {
    color: var(--text-3);
  }

  .heading {
    font-size: 24px; font-weight: 700; letter-spacing: -0.02em;
    text-align: center;
    margin-bottom: 32px;
  }

  /* Inputs */
  .input-group {
    display: flex; flex-direction: column; gap: 12px;
    margin-bottom: 20px;
  }
  .input-wrap {
    display: flex; align-items: center;
    background: var(--surface-2);
    border-radius: var(--radius);
    padding: 0 16px;
    height: 52px;
    border: 1px solid transparent;
    transition: border-color 0.15s;
  }
  .input-wrap:focus-within {
    border-color: rgba(255,255,255,0.12);
  }
  .input-wrap input {
    flex: 1;
    background: none; border: none; outline: none;
    font-family: inherit;
    font-size: 16px; font-weight: 400;
    color: var(--text);
    height: 100%;
  }
  .input-wrap input::placeholder {
    color: var(--text-3);
  }
  .eye-toggle {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    padding: 4px;
    flex-shrink: 0;
  }

  /* Sign in button */
  .btn-primary {
    width: 100%;
    height: 52px;
    background: var(--yellow);
    color: #000;
    border: none;
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 16px; font-weight: 700;
    cursor: pointer;
    transition: opacity 0.15s;
    letter-spacing: -0.01em;
  }
  .btn-primary:hover { opacity: 0.9; }
  .btn-primary:active { opacity: 0.8; }

  /* Forgot password */
  .forgot-link {
    text-align: center;
    margin-top: 16px;
    font-size: 14px; font-weight: 500;
    color: var(--text-3);
    cursor: pointer;
    transition: color 0.15s;
  }
  .forgot-link:hover { color: var(--text-2); }

  /* Divider */
  .divider {
    display: flex; align-items: center; gap: 16px;
    margin: 28px 0;
  }
  .divider-line {
    flex: 1; height: 1px;
    background: var(--line);
  }
  .divider-text {
    font-size: 13px; font-weight: 500; color: var(--text-3);
  }

  /* Create account */
  .btn-outline {
    width: 100%;
    height: 52px;
    background: transparent;
    color: var(--text);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 16px; font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    letter-spacing: -0.01em;
  }
  .btn-outline:hover {
    background: rgba(255,255,255,0.04);
    border-color: rgba(255,255,255,0.18);
  }

  /* Spacer + footer */
  .flex-spacer { flex: 1; }

  .footer {
    text-align: center;
    padding-bottom: 40px;
    font-size: 14px;
    color: rgba(255,255,255,0.10);
    letter-spacing: 0.02em;
    user-select: none;
  }
</style>
