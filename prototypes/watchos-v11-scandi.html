<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=820">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io -- watchOS Scandi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #1A1614;
    --surface: #262018;
    --surface-2: #332B20;
    --surface-3: #443A2C;
    --text: #F5EDE4;
    --text-2: #D4C8B8;
    --text-3: #8C7E6E;
    --yellow: #FDCE45;
    --yellow-warm: #E8B93A;
    --yellow-dim: rgba(253, 206, 69, 0.12);
    --green: #7DB87A;
    --green-dim: rgba(125, 184, 122, 0.15);
    --terracotta: #C4796B;
    --blue: #7BA5C9;
  }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #201C18;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 820px; height: 500px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  .page-title {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.12em;
    margin-bottom: 20px;
  }

  .watch-row {
    display: flex; gap: 18px; align-items: center;
  }

  .watch-face {
    width: 198px; height: 242px;
    background: var(--bg);
    border-radius: 52px;
    overflow: hidden; position: relative; flex-shrink: 0;
    box-shadow:
      0 0 0 1px rgba(245,237,228,0.04),
      0 6px 32px rgba(0,0,0,0.4);
  }

  /* ========== FACE 1: Storage Ring ========== */
  .face-storage {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px;
  }
  .storage-ring {
    position: relative;
    width: 118px; height: 118px;
    display: flex; align-items: center; justify-content: center;
  }
  .storage-ring svg { position: absolute; width: 118px; height: 118px; }
  .ring-text { position: relative; z-index: 1; text-align: center; }
  .ring-main {
    font-size: 32px; font-weight: 700; color: var(--text);
    line-height: 1; letter-spacing: -0.03em;
  }
  .ring-unit { font-size: 13px; font-weight: 500; color: var(--text-3); }
  .ring-sub { font-size: 10px; color: var(--text-3); margin-top: 4px; }

  .app-badge {
    display: flex; align-items: center; gap: 5px; margin-top: 14px;
  }
  .app-icon {
    width: 14px; height: 14px; border-radius: 5px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .app-icon svg { width: 8px; height: 8px; }
  .app-name {
    font-size: 9px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ========== FACE 2: Notification ========== */
  .face-notification {
    display: flex; flex-direction: column;
    height: 100%; padding: 22px 16px 16px;
  }
  .notif-header {
    display: flex; align-items: center; gap: 6px; margin-bottom: 14px;
  }
  .notif-icon {
    width: 20px; height: 20px; border-radius: 7px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .notif-icon svg { width: 11px; height: 11px; }
  .notif-label {
    font-size: 11px; color: var(--text-3); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .notif-body {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 6px;
  }
  .notif-check {
    width: 40px; height: 40px; border-radius: 999px;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 20px rgba(125,184,122,0.2);
  }
  .notif-check svg { width: 20px; height: 20px; }
  .notif-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    line-height: 1.2;
  }
  .notif-file {
    font-size: 12px; font-weight: 500; color: var(--text-2);
  }
  .notif-meta {
    font-size: 10px; color: var(--text-3);
  }
  .notif-action {
    width: 100%; background: var(--surface-2);
    border: none; border-radius: 16px;
    padding: 10px 0; font-size: 13px; font-weight: 600;
    color: var(--blue); cursor: pointer;
    font-family: inherit; margin-top: 8px;
  }

  /* ========== FACE 3: Active Transfers ========== */
  .face-transfers {
    display: flex; flex-direction: column;
    height: 100%; padding: 22px 14px 16px;
  }
  .tf-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .tf-title {
    font-size: 11px; font-weight: 700; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tf-count {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    background: var(--surface-2);
    padding: 2px 8px; border-radius: 8px;
  }
  .tf-list {
    flex: 1; display: flex; flex-direction: column;
    gap: 8px; justify-content: center;
  }
  .tf-item { display: flex; align-items: center; gap: 8px; }
  .tf-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }
  .tf-dot.active { background: var(--yellow-warm); }
  .tf-dot.done { background: var(--green); }
  .tf-name {
    flex: 1; font-size: 12px; font-weight: 500; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tf-pct {
    font-size: 11px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums; flex-shrink: 0;
  }
  .tf-pct.done { color: var(--green); }
  .tf-bar {
    margin: 3px 0 0 15px; height: 3px;
    background: var(--surface-3); border-radius: 2px;
  }
  .tf-bar-fill {
    height: 100%; border-radius: 2px;
    background: var(--yellow-warm);
  }
  .tf-bar-fill.done { background: var(--green); }

  /* ========== FACE 4: Now Playing ========== */
  .face-nowplaying {
    display: flex; flex-direction: column;
    height: 100%; position: relative;
  }
  .np-arc {
    position: absolute; inset: 0; pointer-events: none;
  }
  .np-arc svg { width: 100%; height: 100%; }
  .np-content {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px 16px;
    position: relative; z-index: 1;
  }
  .np-header {
    display: flex; align-items: center; gap: 5px;
    margin-bottom: 10px; align-self: flex-start;
  }
  .np-icon {
    width: 16px; height: 16px; border-radius: 6px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .np-icon svg { width: 9px; height: 9px; }
  .np-lbl { font-size: 10px; color: var(--text-3); font-weight: 600; }
  .np-artwork {
    width: 58px; height: 58px;
    background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface) 100%);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 8px;
    border: 1px solid rgba(245,237,228,0.04);
  }
  .np-artwork svg { width: 22px; height: 22px; }
  .np-track {
    font-size: 13px; font-weight: 600; color: var(--text);
    text-align: center;
  }
  .np-artist {
    font-size: 11px; color: var(--text-3); margin-top: 2px;
  }
  .np-controls {
    display: flex; align-items: center; gap: 18px; margin-top: 10px;
  }
  .np-btn {
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
  }
  .np-btn.skip svg { width: 14px; height: 14px; fill: var(--text-3); }
  .np-btn.play {
    width: 34px; height: 34px;
    background: var(--yellow); border-radius: 999px;
  }
  .np-btn.play svg { width: 14px; height: 14px; fill: #1A1614; }
  .np-time {
    font-size: 11px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums; margin-top: 6px;
  }
</style>
</head>
<body>
<div class="page-title">watchOS -- Scandi</div>
<div class="watch-row">

  <!-- FACE 1: Storage -->
  <div class="watch-face">
    <div class="face-storage">
      <div class="storage-ring">

          <!-- Warm yellow fill (78%) -->
          <circle cx="59" cy="59" r="50" fill="none" stroke="#E8B93A" stroke-width="8"

  </div>

  <!-- FACE 2: Notification -->
  <div class="watch-face">
    <div class="face-notification">
      <div class="notif-header">
        <div class="notif-icon">
          <svg viewBox="0 0 16 16" fill="#1A1614">
            <rect x="3" y="3" width="3" height="10"/>
            <rect x="6" y="3" width="4" height="3"/>
            <rect x="10" y="3" width="3" height="6"/>

          </svg>
        </div>
        <span class="notif-label">put.io</span>

      <div class="notif-body">

  <!-- FACE 3: Transfers -->
  <div class="watch-face">

      </div>
      <div class="tf-list">
        <div>
          <div class="tf-item">
            <div class="tf-dot active"></div>

            <span class="tf-pct">63%</span>

          <div class="tf-bar"><div class="tf-bar-fill" style="width:63%"></div></div>
        </div>
        <div>
          <div class="tf-item">

            <span class="tf-pct">65%</span>
          </div>

        <div>

      </div>
      <div class="app-badge" style="justify-content:center; margin-top:10px;">
        <div class="app-icon" style="width:12px;height:12px;border-radius:4px;">
          <svg viewBox="0 0 16 16" fill="#1A1614" style="width:7px;height:7px;">
            <rect x="3" y="3" width="3" height="10"/>

        </div>
        <span class="app-name">put.io</span>
      </div>
    </div>
  </div>

  <!-- FACE 4: Now Playing -->
  <div class="watch-face">
    <div class="np-arc">
      <svg viewBox="0 0 198 242" fill="none">
        <rect x="3" y="3" width="192" height="236" rx="49" ry="49"

        <rect x="3" y="3" width="192" height="236" rx="49" ry="49"

    <div class="face-nowplaying">
      <div class="np-content">
