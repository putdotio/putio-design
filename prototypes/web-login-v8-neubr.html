<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io -- Login (Neubrutalism)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #F5F0E8;
    --bg-card: #FFFFFF;
    --border: #1A1A1A;
    --border-w: 3px;
    --shadow: 6px 6px 0 #1A1A1A;
    --shadow-sm: 3px 3px 0 #1A1A1A;
    --shadow-lg: 8px 8px 0 #1A1A1A;
    --text: #1A1A1A;
    --text-2: #555555;
    --text-3: #888888;
    --yellow: #FDCE45;
    --yellow-bg: rgba(253,206,69,0.25);
    --green: #4ADE80;
    --green-bg: #D1FAE5;
    --red: #EF4444;
    --blue: #60A5FA;
    --pink: #F472B6;
    --radius: 12px;
  }
  body {
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .page {
    width: 1440px; height: 900px; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
    position: relative;
  }

  /* Background decorations */
  .deco-1 {
    position: absolute; width: 280px; height: 280px;
    background: var(--yellow); border: var(--border-w) solid var(--border);
    border-radius: 50%; top: -60px; right: 180px; opacity: 0.15;
    transform: rotate(12deg);
  }
  .deco-2 {
    position: absolute; width: 200px; height: 200px;
    background: var(--pink); border: var(--border-w) solid var(--border);
    border-radius: var(--radius); bottom: -40px; left: 120px; opacity: 0.1;
    transform: rotate(-8deg);
  }
  .deco-3 {
    position: absolute; width: 120px; height: 120px;
    background: var(--blue); border: var(--border-w) solid var(--border);
    border-radius: 50%; top: 200px; left: 240px; opacity: 0.1;
  }

  /* Offset shadow card behind */
  .login-shadow {
    position: absolute; width: 440px; height: 580px;
    background: var(--yellow); border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    transform: rotate(-3deg) translate(8px, 8px);
    z-index: 0;
  }

  .login-container {
    width: 440px; background: var(--bg-card);
    border: var(--border-w) solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 48px 40px;
    position: relative; z-index: 1;
  }

  /* Logo row */
  .logo-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; }
  .logo { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; }
  .logo .dot { color: var(--yellow); }
  .kaomoji { font-size: 16px; color: var(--text-2); font-weight: 500; }

  /* Welcome */
  .welcome-title { font-size: 36px; font-weight: 800; letter-spacing: -0.04em; margin-bottom: 8px; line-height: 1.1; }
  .welcome-sub { font-size: 15px; color: var(--text-2); margin-bottom: 32px; line-height: 1.5; }

  /* Form */
  .form-group { margin-bottom: 18px; }
  .form-label {
    display: block; font-size: 13px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.03em;
    margin-bottom: 8px;
  }
  .form-input {
    width: 100%; background: var(--bg);
    border: var(--border-w) solid var(--border); border-radius: 8px;
    padding: 14px 16px; font-size: 15px; font-family: inherit;
    box-shadow: var(--shadow-sm); outline: none;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .form-input:focus {
    border-color: var(--yellow);
    box-shadow: 4px 4px 0 var(--yellow);
  }
  .form-input::placeholder { color: var(--text-3); }

  /* Options row */
  .form-options { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .remember { display: flex; align-items: center; gap: 10px; }
  .checkbox {
    width: 22px; height: 22px; border: var(--border-w) solid var(--border);
    border-radius: 6px; background: var(--yellow); box-shadow: var(--shadow-sm);
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .remember-label { font-size: 13px; color: var(--text-2); font-weight: 500; }
  .forgot-link { font-size: 13px; color: var(--text-2); font-weight: 600; text-decoration: underline; cursor: pointer; }

  /* Button */
  .btn-login {
    width: 100%; padding: 16px; border-radius: 8px;
    border: var(--border-w) solid var(--border);
    background: var(--yellow); color: var(--text);
    font-size: 16px; font-weight: 800; cursor: pointer;
    font-family: inherit; box-shadow: var(--shadow);
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin-bottom: 20px;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn-login:hover { transform: translate(-2px, -2px); box-shadow: 8px 8px 0 #1A1A1A; }
  .btn-login:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #1A1A1A; }

  /* Divider */
  .divider { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .divider-line { flex: 1; height: 2px; background: var(--border); }
  .divider-text { font-size: 12px; font-weight: 700; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; }

  /* Signup */
  .signup-row { text-align: center; font-size: 14px; color: var(--text-2); margin-bottom: 24px; }
  .signup-link { color: var(--text); font-weight: 700; text-decoration: underline; cursor: pointer; }

  /* Trust row */
  .trust-row {
    display: flex; align-items: center; justify-content: center; gap: 16px;
    padding-top: 20px; border-top: 2px solid var(--border);
  }
  .trust-item {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 4px 10px;
    border: 2px solid var(--border); border-radius: 20px;
    background: var(--bg);
  }
  .trust-item svg { width: 14px; height: 14px; }

  /* Sticker */
  .sticker {
    position: absolute; top: -14px; right: 24px;
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 800; padding: 6px 14px;
    border-radius: 20px; border: 2px solid var(--border);
    background: var(--yellow); color: var(--text);
    transform: rotate(4deg); box-shadow: var(--shadow-sm);
    z-index: 2;
  }
</style>
</head>
<body>
<div class="page">
  <div class="deco-1"></div>
  <div class="deco-2"></div>
  <div class="deco-3"></div>
  <div class="login-shadow"></div>

  <div class="login-container">
    <div class="sticker">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2z"/></svg>
      WELCOME!
    </div>

    <div class="logo-row">
      <div class="logo">put<span class="dot">.</span>io</div>
      <div class="kaomoji">(*^-^*)</div>
    </div>

    <h1 class="welcome-title">Hey there,<br>come on in!</h1>
    <p class="welcome-sub">Your files missed you. Let's get you back to your stuff.</p>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" placeholder="you@example.com" value="altay@put.io" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="Your secret password" />
    </div>

    <div class="form-options">
      <div class="remember">
        <div class="checkbox">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <span class="remember-label">Remember me</span>
      </div>
      <span class="forgot-link">Forgot password?</span>
    </div>

    <button class="btn-login">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      Sign In
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <div class="signup-row">
      First time? <span class="signup-link">Create an account</span>
    </div>

    <div class="trust-row">
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="#30A46C"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Encrypted
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="#30A46C"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        Private
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24" fill="#30A46C"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        No tracking
      </div>
    </div>
  </div>
</div>
</body>
</html>
