<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#111113">
<title>put.io — Android TV Conversion (Glass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #111113; --bg-2: #19191B; --bg-3: #222225; --bg-4: #2C2C30;
    --glass: rgba(255,255,255,0.05); --glass-hover: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.08); --glass-border-strong: rgba(255,255,255,0.12);
    --glass-inset: inset 0 1px 1px rgba(255,255,255,0.04);
    --text: #EEEEF0; --text-2: #ABABB2; --text-3: #77777F; --text-4: #55555E;
    --yellow: #FDCE45; --yellow-dim: rgba(253,206,69,0.12); --yellow-glow: rgba(253,206,69,0.20);
    --green: #30A46C; --red: #E5484D;
    --blur-heavy: blur(40px); --blur-medium: blur(24px); --blur-light: blur(16px);
    --radius: 16px; --radius-sm: 10px;
  }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: var(--bg); -webkit-font-smoothing: antialiased; }
  .tv-frame {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .tv-frame::before { content: ''; position: absolute; top: -200px; right: 300px; width: 800px; height: 800px; background: radial-gradient(circle, rgba(253,206,69,0.06) 0%, rgba(253,206,69,0.015) 40%, transparent 70%); pointer-events: none; }
  .tv-frame::after { content: ''; position: absolute; bottom: -200px; left: 300px; width: 700px; height: 700px; background: radial-gradient(circle, rgba(253,206,69,0.04) 0%, transparent 60%); pointer-events: none; }

  .content { display: flex; flex-direction: column; align-items: center; max-width: 580px; width: 100%; z-index: 1; }

  .poster {
    width: 300px; height: 170px; border-radius: var(--radius);
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 1px solid var(--glass-border-strong);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.4), var(--glass-inset);
  }

  .file-info { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .file-title { font-size: 30px; font-weight: 600; color: var(--text); }
  .file-badges { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    background: var(--glass-hover); border: 1px solid var(--glass-border);
    color: var(--text-2); padding: 3px 10px; border-radius: 6px; line-height: 1.4;
  }

  .progress-section { margin-top: 32px; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .progress-percentage {
    font-size: 52px; font-weight: 700; color: var(--yellow); line-height: 1.1;
    text-shadow: 0 0 24px var(--yellow-glow);
  }
  .progress-bar-track {
    width: 460px; height: 6px;
    background: rgba(255,255,255,0.06); border-radius: 3px;
    margin-top: 20px; overflow: hidden;
  }
  .progress-bar-fill {
    width: 63%; height: 100%;
    background: var(--yellow); border-radius: 3px;
    box-shadow: 0 0 12px var(--yellow-glow);
  }
  .progress-label { font-size: 18px; color: var(--text-2); margin-top: 14px; text-align: center; }

  .spinner-row { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 18px; height: 18px;
    border: 2px solid rgba(255,255,255,0.06);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .spinner-text { font-size: 14px; color: var(--text-4); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cancel-btn {
    margin-top: 36px; font-size: 18px; font-weight: 600;
    color: var(--text-2);
    background: var(--glass); backdrop-filter: var(--blur-light); -webkit-backdrop-filter: var(--blur-light);
    border: 1px solid var(--glass-border-strong);
    border-radius: var(--radius-sm); padding: 12px 44px;
    cursor: pointer; font-family: inherit;
    box-shadow: var(--glass-inset);
  }
  .cancel-btn:focus {
    outline: none; border-color: var(--yellow);
    box-shadow: 0 0 16px var(--yellow-glow), var(--glass-inset);
  }
</style>
</head>
<body>
<div class="tv-frame">
  <div class="content">
    <div class="poster">
      <svg width="44" height="44" viewBox="0 0 48 48" fill="none"><path d="M18 12L38 24L18 36V12Z" fill="rgba(255,255,255,0.15)"/></svg>
    </div>
    <div class="file-info">
      <div class="file-title">The Wire</div>
      <div class="file-badges">
        <span class="badge">S03 &middot; E04</span>
        <span class="badge">1080p</span>
      </div>
    </div>
    <div class="progress-section">
      <div class="progress-percentage">63%</div>
      <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
      <div class="progress-label">Converting your file...</div>
    </div>
    <div class="spinner-row">
      <div class="spinner"></div>
      <span class="spinner-text">This may take a few minutes</span>
    </div>
    <button class="cancel-btn">Cancel</button>
  </div>
</div>
</body>
</html>
