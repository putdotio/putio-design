<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=412">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io — Android Downloads (Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --border: rgba(255,255,255,0.08);
    --border-subtle: rgba(255,255,255,0.05);
    --text: #FFFFFF;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.15);
    --green: #30D158;
    --red: #FF453A;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 412px;
    height: 915px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
    background: var(--bg);
  }

  /* ── Status Bar ── */
  .status-bar {
    display: flex;
    align-items: center;
    padding: 10px 20px;
    height: 44px;
    flex-shrink: 0;
  }
  .status-bar .clock {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .status-bar .icons {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .status-bar .icons svg {
    width: 16px;
    height: 16px;
    fill: var(--text);
  }

  /* ── Top App Bar ── */
  .top-app-bar {
    padding: 8px 20px 0;
    flex-shrink: 0;
  }
  .top-title {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    line-height: 1.15;
  }

  /* ── Storage Usage ── */
  .storage-usage {
    padding: 12px 20px 0;
    flex-shrink: 0;
  }
  .storage-text {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-2);
    margin-bottom: 8px;
  }
  .storage-text strong {
    font-weight: 600;
    color: var(--text);
  }
  .storage-bar-track {
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 1.5px;
    overflow: hidden;
  }
  .storage-bar-fill {
    height: 100%;
    width: 3.75%;
    background: var(--yellow);
    border-radius: 1.5px;
  }

  /* ── File List ── */
  .file-list {
    flex: 1;
    overflow-y: auto;
    padding-bottom: 88px;
  }
  .file-list::-webkit-scrollbar { display: none; }

  .list-item {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 20px;
    min-height: 68px;
    cursor: pointer;
    position: relative;
  }
  .list-item + .list-item {
    border-top: 1px solid var(--border-subtle);
  }

  /* Leading icon */
  .l-icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    background: var(--surface);
    position: relative;
    overflow: hidden;
  }
  .l-icon .thumb-bg {
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, #2C2C2E 0%, #1C1C1E 100%);
  }
  .l-icon svg {
    width: 18px;
    height: 18px;
    fill: var(--text-2);
    position: relative;
    z-index: 1;
  }

  /* Text */
  .l-info {
    flex: 1;
    min-width: 0;
  }
  .l-name {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    line-height: 1.3;
  }
  .l-meta {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-2);
    margin-top: 2px;
    line-height: 1.3;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* Quality badge */
  .quality-badge {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-3);
    background: rgba(255,255,255,0.06);
    padding: 2px 6px;
    border-radius: 4px;
    letter-spacing: 0.04em;
    flex-shrink: 0;
  }

  /* Trailing */
  .l-trailing {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .l-overflow {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: none;
    border: none;
    cursor: pointer;
    border-radius: 50%;
  }
  .l-overflow svg {
    width: 18px;
    height: 18px;
    fill: var(--text-3);
  }

  /* ── Download Progress ── */
  .dl-progress {
    margin-top: 8px;
    height: 3px;
    background: rgba(255,255,255,0.08);
    border-radius: 1.5px;
    overflow: visible;
    position: relative;
  }
  .dl-progress-fill {
    height: 100%;
    border-radius: 1.5px;
    background: var(--yellow);
    position: relative;
  }
  .dl-progress-fill::after {
    content: '';
    position: absolute;
    right: -1px;
    top: 50%;
    transform: translateY(-50%);
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: var(--yellow);
    box-shadow: 0 0 6px 2px rgba(253,206,69,0.35);
  }

  .dl-status {
    font-size: 12px;
    font-weight: 500;
    color: var(--yellow);
    margin-top: 4px;
  }

  /* ── Bottom Navigation ── */
  .bottom-nav {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 64px;
    background: var(--bg);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 0 8px;
    z-index: 20;
    flex-shrink: 0;
  }
  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    flex: 1;
    padding: 8px 0;
    background: none;
    border: none;
  }
  .nav-item svg {
    width: 22px;
    height: 22px;
    fill: var(--text-3);
    color: var(--text-3);
  }
  .nav-item .nav-label {
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 11px;
    font-weight: 500;
    color: var(--text-3);
  }
  .nav-item.active svg {
    fill: var(--yellow);
    color: var(--yellow);
  }
  .nav-item.active .nav-label {
    color: var(--yellow);
  }

  /* ── Gesture Bar ── */
  .gesture-bar {
    width: 134px;
    height: 5px;
    border-radius: 2.5px;
    background: var(--text-3);
    margin: 0 auto;
    position: absolute;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
  }
</style>
</head>
<body>
<div class="phone">

  <!-- Status Bar -->
  <div class="status-bar">

    <div class="icons">
      <svg viewBox="0 0 16 16"><path d="M1 12h2v3H1zm4-3h2v6H5zm4-3h2v9H9zm4-4h2v13h-2z"/></svg>

      <svg viewBox="0 0 16 16"><rect x="1" y="4" width="12" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.2"/><rect x="2.5" y="5.5" width="7.5" height="5" rx="0.5"/><path d="M14 6.5h1v3h-1z"/></svg>

      </div>

          <span>2.1 GB</span>

        <button class="l-overflow">

    <!-- Item 3: Currently downloading -->
    <div class="list-item">

          <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>

    </div>

    <!-- Item 4: Downloaded video -->
    <div class="list-item">
      <div class="l-icon">
        <div class="thumb-bg"></div>

      </div>

          <span>1.4 GB</span>

      </div>
      <div class="l-trailing">

  <!-- Bottom Navigation -->
