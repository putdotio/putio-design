<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io -- tvOS Player Glass (v12 Linear Neutral)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --text: #FAFAFA;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.10);
    --yellow-glow: rgba(253,206,69,0.20);
    --green: #30D158;

    /* Glass materials */
    --glass-thin: rgba(255,255,255,0.04);
    --glass-regular: rgba(255,255,255,0.06);
    --glass-thick: rgba(255,255,255,0.10);
    --glass-border: rgba(255,255,255,0.10);
    --glass-border-focus: rgba(253,206,69,0.35);
    --glass-inset: inset 0 1px 0 rgba(255,255,255,0.06);
    --blur-thin: blur(20px);
    --blur-regular: blur(32px);
    --blur-thick: blur(48px);
  }

  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }

  .player-frame {
    width: 1920px;
    height: 1080px;
    position: relative;
    overflow: hidden;
  }

  /* ── Video Placeholder ── */
  .video-bg {
    position: absolute;
    inset: 0;
    background: #0A0A0C;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-bg-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-3);
    opacity: 0.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* ── Top Glass Bar (thin material, fades from top gradient) ── */
  .top-gradient {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 280px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.80) 0%, rgba(0,0,0,0.35) 55%, transparent 100%);
    z-index: 2;
    pointer-events: none;
  }
  .top-bar {
    position: absolute;
    top: 40px;
    left: 64px;
    right: 64px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 24px;
    background: var(--glass-thin);
    backdrop-filter: var(--blur-thin);
    -webkit-backdrop-filter: var(--blur-thin);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px;
    padding: 20px 32px;
    box-shadow: var(--glass-inset), 0 4px 32px rgba(0,0,0,0.4);
  }
  .back-btn {
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    border-radius: 10px;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  .back-btn:hover {
    background: rgba(255,255,255,0.06);
  }
  .top-title {
    font-size: 32px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
  }
  .top-subtitle {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-2);
    margin-left: auto;
  }
  .top-subtitle .dot {
    margin: 0 10px;
    color: var(--text-3);
  }

  /* ── Center Controls ── */
  .center-controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 56px;
  }

  .ctrl-circle {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.25s ease;
  }

  /* Skip buttons — smaller glass circles (regular material) */
  .ctrl-skip {
    width: 64px;
    height: 64px;
    background: var(--glass-regular);
    backdrop-filter: var(--blur-regular);
    -webkit-backdrop-filter: var(--blur-regular);
    border: 1px solid rgba(255,255,255,0.08);
    box-shadow: var(--glass-inset), 0 4px 16px rgba(0,0,0,0.3);
  }
  .ctrl-skip:hover {
    background: rgba(255,255,255,0.10);
  }

  /* Play button — large glass circle (regular material) */
  .ctrl-play {
    width: 96px;
    height: 96px;
    background: var(--glass-regular);
    backdrop-filter: var(--blur-regular);
    -webkit-backdrop-filter: var(--blur-regular);
    border: 1px solid rgba(255,255,255,0.12);
    box-shadow: var(--glass-inset), 0 8px 32px rgba(0,0,0,0.4);
  }
  .ctrl-play:hover {
    background: rgba(255,255,255,0.12);
  }
  .ctrl-play.focused {
    background: rgba(253,206,69,0.12);
    border-color: var(--glass-border-focus);
    transform: scale(1.08);
    box-shadow:
      var(--glass-inset),
      0 0 0 1px var(--glass-border-focus),
      0 0 48px rgba(253,206,69,0.12),
      0 12px 48px rgba(0,0,0,0.5);
  }

  /* ── Bottom Glass Panel (thick material) ── */
  .bottom-gradient {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 360px;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.40) 55%, transparent 100%);
    z-index: 2;
    pointer-events: none;
  }
  .bottom-panel {
    position: absolute;
    bottom: 32px;
    left: 64px;
    right: 64px;
    z-index: 3;
    background: var(--glass-thick);
    backdrop-filter: var(--blur-thick);
    -webkit-backdrop-filter: var(--blur-thick);
    border: 1px solid var(--glass-border);
    border-radius: 20px;
    padding: 28px 36px 24px;
    box-shadow: var(--glass-inset), 0 -4px 48px rgba(0,0,0,0.4);
    background-image: linear-gradient(to bottom, rgba(255,255,255,0.04) 0%, transparent 30%);
  }

  /* ── Scrubber ── */
  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
  }
  .time {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-2);
    min-width: 60px;
    font-variant-numeric: tabular-nums;
  }
  .time.end { text-align: right; }
  .scrubber {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.08);
    border-radius: 3px;
    position: relative;
    cursor: pointer;
  }
  .scrubber-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 3px;
    position: relative;
    box-shadow: 0 0 10px rgba(253,206,69,0.15);
  }
  .scrubber-dot {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(253,206,69,0.5);
  }

  /* ── Action Row (glass pills) ── */
  .action-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .action-pill {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 24px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.25s ease;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .action-pill:hover {
    background: rgba(255,255,255,0.08);
  }
  .action-pill.focused {
    background: var(--yellow-dim);
    border-color: rgba(253,206,69,0.20);
    transform: scale(1.05);
    box-shadow: 0 0 24px rgba(253,206,69,0.08);
  }
  .action-pill.focused .action-label { color: var(--yellow); }
  .action-pill.focused .action-icon svg { fill: var(--yellow); stroke: var(--yellow); }
  .action-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-label {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-2);
    transition: color 0.2s;
  }
  .action-spacer { flex: 1; }

  /* ── Up Next Card (glass, bottom-right) ── */
  .up-next {
    position: absolute;
    bottom: 220px;
    right: 64px;
    z-index: 3;
    background: var(--glass-regular);
    backdrop-filter: var(--blur-regular);
    -webkit-backdrop-filter: var(--blur-regular);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    padding: 18px 24px;
    box-shadow: var(--glass-inset), 0 8px 32px rgba(0,0,0,0.4);
    background-image: linear-gradient(to bottom, rgba(255,255,255,0.03) 0%, transparent 40%);
    min-width: 280px;
  }
  .up-next-label {
    font-size: 12px;
    font-weight: 600;
    color: var(--text-3);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .up-next-name {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.02em;
    margin-bottom: 4px;
  }
  .up-next-meta {
    font-size: 14px;
    font-weight: 400;
    color: var(--text-3);
  }
</style>
</head>
<body>
<div class="player-frame">

  <!-- Video BG -->
  <div class="video-bg">
    <div class="video-bg-text">Video</div>
  </div>

  <!-- Top Gradient -->
  <div class="top-gradient"></div>

  <!-- Top Glass Bar -->
  <div class="top-bar">
    <div class="back-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M15 18l-6-6 6-6" stroke="#FAFAFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="top-title">Inception</div>
    <div class="top-subtitle">2010<span class="dot">&middot;</span>2h 28m<span class="dot">&middot;</span>4K</div>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back -->
    <div class="ctrl-circle ctrl-skip">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M12.5 3a9 9 0 110 18 9 9 0 010-18" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M12.5 3L9 6.5l3.5 3" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="12.5" y="14.5" text-anchor="middle" fill="#FAFAFA" font-family="Inter" font-size="7" font-weight="600">10</text>
      </svg>
    </div>

    <!-- Play -->
    <div class="ctrl-circle ctrl-play focused">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <path d="M8 5v14l11-7L8 5z" fill="#FAFAFA"/>
      </svg>
    </div>

    <!-- Skip Forward -->
    <div class="ctrl-circle ctrl-skip">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none">
        <path d="M11.5 3a9 9 0 100 18 9 9 0 000-18" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M11.5 3L15 6.5 11.5 9.5" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="11.5" y="14.5" text-anchor="middle" fill="#FAFAFA" font-family="Inter" font-size="7" font-weight="600">10</text>
      </svg>
    </div>
  </div>

  <!-- Bottom Gradient -->
  <div class="bottom-gradient"></div>

  <!-- Up Next Card -->
  <div class="up-next">
    <div class="up-next-label">Up Next</div>
    <div class="up-next-name">The Bear S03E08</div>
    <div class="up-next-meta">52m &middot; 1080p</div>
  </div>

  <!-- Bottom Glass Panel -->
  <div class="bottom-panel">

    <!-- Scrubber -->
    <div class="scrubber-row">
      <div class="time">1:04:38</div>
      <div class="scrubber">
        <div class="scrubber-fill" style="width: 44%">
          <div class="scrubber-dot"></div>
        </div>
      </div>
      <div class="time end">2:28:00</div>
    </div>

    <!-- Action Row -->
    <div class="action-row">
      <div class="action-pill focused">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <div class="action-label">Subtitles</div>
      </div>

      <div class="action-pill">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <div class="action-label">Audio</div>
      </div>

      <div class="action-pill">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="action-label">Speed</div>
      </div>

      <div class="action-pill">
        <div class="action-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </div>
        <div class="action-label">Info</div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
