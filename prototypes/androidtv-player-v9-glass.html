<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#111113">
<title>put.io — Android TV Player (Glass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #111113; --bg-2: #19191B; --bg-3: #222225; --bg-4: #2C2C30;
    --glass: rgba(255,255,255,0.05); --glass-hover: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.08); --glass-border-strong: rgba(255,255,255,0.12);
    --glass-inset: inset 0 1px 1px rgba(255,255,255,0.04);
    --text: #EEEEF0; --text-2: #ABABB2; --text-3: #77777F; --text-4: #55555E;
    --yellow: #FDCE45; --yellow-dim: rgba(253,206,69,0.12); --yellow-glow: rgba(253,206,69,0.20);
    --green: #30A46C; --red: #E5484D;
    --blur-heavy: blur(40px); --blur-medium: blur(24px); --blur-light: blur(16px);
    --radius: 16px; --radius-sm: 10px;
  }
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; color: var(--text); background: #000; -webkit-font-smoothing: antialiased; }
  .tv-frame { width: 1920px; height: 1080px; position: relative; overflow: hidden; }

  .video-bg { position: absolute; inset: 0; background: linear-gradient(135deg, #0a0a1a 0%, #141428 40%, #0a0a1a 100%); }

  /* Title bar */
  .title-bar {
    position: absolute; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.5); backdrop-filter: var(--blur-medium); -webkit-backdrop-filter: var(--blur-medium);
    border-bottom: 1px solid var(--glass-border);
    padding: 20px 72px; display: flex; align-items: center; gap: 16px; z-index: 10;
    box-shadow: var(--glass-inset);
  }
  .title-bar-name { font-size: 22px; font-weight: 600; color: #fff; }
  .title-bar-badges { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 12px; font-weight: 600; text-transform: uppercase;
    background: var(--glass-hover); border: 1px solid var(--glass-border);
    color: var(--text-2); padding: 3px 10px; border-radius: 6px; line-height: 1.4;
  }
  .title-bar-spacer { flex: 1; }
  .title-bar-meta { font-size: 16px; color: var(--text-2); }

  /* Subtitle */
  .subtitle-container { position: absolute; bottom: 240px; left: 50%; transform: translateX(-50%); z-index: 10; }
  .subtitle-text {
    color: #fff; font-size: 32px; font-weight: 500; text-align: center; line-height: 1.4;
    text-shadow: 0 3px 12px rgba(0,0,0,0.8);
  }

  /* Info panel */
  .info-panel {
    position: absolute; top: 0; right: 0; bottom: 0; width: 480px;
    background: rgba(0,0,0,0.6); backdrop-filter: var(--blur-heavy); -webkit-backdrop-filter: var(--blur-heavy);
    border-left: 1px solid var(--glass-border);
    padding: 72px 36px; z-index: 15;
    box-shadow: var(--glass-inset);
  }
  .info-panel-title { font-size: 24px; font-weight: 600; color: #fff; margin-bottom: 12px; }
  .info-panel-badges { display: flex; align-items: center; gap: 8px; margin-bottom: 32px; }
  .info-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 14px 0; border-bottom: 1px solid var(--glass-border);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label { font-size: 16px; font-weight: 500; color: var(--text-2); }
  .info-value { font-size: 18px; font-weight: 500; color: #fff; text-align: right; }

  /* Transport bar */
  .transport-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.6); backdrop-filter: var(--blur-heavy); -webkit-backdrop-filter: var(--blur-heavy);
    border-top: 1px solid var(--glass-border);
    padding: 28px 72px 33px; z-index: 20;
    box-shadow: var(--glass-inset);
  }
  .scrubber-row { display: flex; align-items: center; gap: 18px; margin-bottom: 24px; }
  .time-label { font-size: 18px; font-weight: 500; color: #fff; font-variant-numeric: tabular-nums; min-width: 56px; }
  .time-label-right { font-size: 18px; font-weight: 500; color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  .progress-track { flex: 1; height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; position: relative; }
  .progress-fill { height: 100%; width: 42%; background: var(--yellow); border-radius: 2px; box-shadow: 0 0 10px var(--yellow-glow); }
  .progress-dot {
    width: 14px; height: 14px; background: #fff; border-radius: 50%;
    position: absolute; top: 50%; left: 42%; transform: translate(-50%, -50%);
    box-shadow: 0 0 12px rgba(253,206,69,0.3);
  }

  .controls-row { display: flex; align-items: center; justify-content: center; gap: 44px; }
  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.7); width: 40px; height: 40px; position: relative;
  }
  .ctrl-btn svg { display: block; }
  .ctrl-btn.focused { color: var(--yellow); }
  .ctrl-btn.play-btn {
    width: 56px; height: 56px;
    background: var(--glass); backdrop-filter: var(--blur-light); -webkit-backdrop-filter: var(--blur-light);
    border: 2px solid var(--yellow); border-radius: 50%;
    color: #fff; box-shadow: 0 0 20px var(--yellow-glow), var(--glass-inset);
  }
  .ctrl-btn.play-btn.focused { background: var(--yellow); color: #000; }
  .ctrl-btn-text {
    background: none; border: none; cursor: pointer;
    color: rgba(255,255,255,0.7); font-family: inherit; font-size: 18px; font-weight: 600; height: 40px;
    display: flex; align-items: center; justify-content: center;
  }
  .controls-gap { width: 60px; }
</style>
</head>
<body>
<div class="tv-frame">
  <div class="video-bg"></div>

  <div class="title-bar">
    <span class="title-bar-name">The Wire</span>
    <div class="title-bar-badges">
      <span class="badge">S3 &middot; E2</span>
      <span class="badge">1080p</span>
    </div>
    <div class="title-bar-spacer"></div>
    <span class="title-bar-meta">1.9 GB &middot; MKV</span>
  </div>

  <div class="subtitle-container">
    <div class="subtitle-text">You come at the king, you best not miss.</div>
  </div>

  <div class="info-panel">
    <div class="info-panel-title">The Wire</div>
    <div class="info-panel-badges">
      <span class="badge">S3 &middot; E2</span>
      <span class="badge">1080p</span>
      <span class="badge">MKV</span>
    </div>
    <div class="info-row"><span class="info-label">Duration</span><span class="info-value">55:00</span></div>
    <div class="info-row"><span class="info-label">Resolution</span><span class="info-value">1920&times;1080</span></div>
    <div class="info-row"><span class="info-label">Size</span><span class="info-value">1.9 GB</span></div>
    <div class="info-row"><span class="info-label">Format</span><span class="info-value">MKV / H.264</span></div>
    <div class="info-row"><span class="info-label">Audio</span><span class="info-value">English 5.1, English 2.0</span></div>
    <div class="info-row"><span class="info-label">Subtitles</span><span class="info-value">English, Turkish, Spanish</span></div>
  </div>

  <div class="transport-bar">
    <div class="scrubber-row">
      <span class="time-label">23:14</span>
      <div class="progress-track"><div class="progress-fill"></div><div class="progress-dot"></div></div>
      <span class="time-label-right">-31:46</span>
    </div>
    <div class="controls-row">
      <button class="ctrl-btn" title="Skip back 10s">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 4v6h6"/><path d="M1 10a10 10 0 1 1 2.51 7.36"/></svg>
        <span style="position:absolute;font-size:12px;font-weight:700;color:currentColor;">10</span>
      </button>
      <button class="ctrl-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="5" width="3" height="14" rx="1"/><path d="M20 5.5v13a1 1 0 0 1-1.54.84l-9-6.5a1 1 0 0 1 0-1.68l9-6.5A1 1 0 0 1 20 5.5z"/></svg></button>
      <button class="ctrl-btn play-btn focused"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4l15 8-15 8V4z"/></svg></button>
      <button class="ctrl-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor"><rect x="18" y="5" width="3" height="14" rx="1"/><path d="M4 18.5v-13a1 1 0 0 1 1.54-.84l9 6.5a1 1 0 0 1 0 1.68l-9 6.5A1 1 0 0 1 4 18.5z"/></svg></button>
      <button class="ctrl-btn" title="Skip forward 10s">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"/><path d="M23 10A10 10 0 1 0 20.49 17.36"/></svg>
        <span style="position:absolute;font-size:12px;font-weight:700;color:currentColor;">10</span>
      </button>
      <div class="controls-gap"></div>
      <button class="ctrl-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="5" y1="12" x2="11" y2="12"/><line x1="13" y1="12" x2="19" y2="12"/><line x1="5" y1="16" x2="15" y2="16"/></svg></button>
      <button class="ctrl-btn"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/><path d="M15.54 8.46a5 5 0 0 1 0 7.07"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14"/></svg></button>
      <button class="ctrl-btn-text">&middot;&middot;&middot;</button>
    </div>
  </div>
</div>
</body>
</html>
