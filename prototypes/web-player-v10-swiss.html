<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io — Player (Swiss/International)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0A0A0A;
    --surface: #111111;
    --border: #1E1E1E;
    --text: #E8E8E8;
    --text-2: #999999;
    --text-3: #666666;
    --yellow: #FDCE45;
    --font: -apple-system, 'Helvetica Neue', Arial, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: flex;
    width: 1440px;
    height: 900px;
    overflow: hidden;
  }

  /* SIDEBAR — minimal for player */
  .sidebar {
    width: 240px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  .sidebar-brand { padding: 32px 24px 40px; }

  .logo {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .logo-dot { color: var(--yellow); }

  .sidebar-nav { flex: 1; }

  .nav-group-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-3);
    padding: 0 24px 8px;
  }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 400;
    color: var(--text-2);
    cursor: pointer;
    border: none;
    background: none;
    width: 100%;
    text-align: left;
    font-family: var(--font);
    transition: color 0.12s ease;
  }

  .nav-item:hover { color: var(--text); }

  .nav-item.active {
    color: var(--text);
    font-weight: 700;
    border-left: 3px solid var(--yellow);
    padding-left: 21px;
  }

  .nav-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-3);
    flex-shrink: 0;
  }

  .nav-item.active .nav-icon { color: var(--yellow); }

  .nav-badge {
    margin-left: auto;
    font-size: 11px;
    font-weight: 700;
    color: var(--bg);
    background: var(--yellow);
    padding: 1px 7px;
  }

  .nav-divider {
    height: 1px;
    background: var(--border);
    margin: 16px 24px;
  }

  .sidebar-footer {
    padding: 20px 24px;
    border-top: 1px solid var(--border);
  }

  .storage-bar {
    width: 100%;
    height: 3px;
    background: var(--border);
    margin-bottom: 8px;
  }

  .storage-fill {
    height: 100%;
    width: 78%;
    background: var(--yellow);
  }

  .storage-label {
    font-size: 11px;
    color: var(--text-3);
  }

  .storage-label strong {
    color: var(--text-2);
    font-weight: 700;
  }

  .user-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 16px 24px;
  }

  .user-avatar {
    width: 28px;
    height: 28px;
    background: var(--yellow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--bg);
  }

  .user-name {
    font-size: 13px;
    color: var(--text-2);
  }

  /* CONTENT — player */
  .content {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
  }

  /* Video area */
  .video-area {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, #050508 0%, #0e1018 30%, #141822 50%, #0e1018 70%, #050508 100%);
  }

  /* Letterbox bars */
  .video-area::before,
  .video-area::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 12%;
    background: #000;
    z-index: 1;
  }

  .video-area::before { top: 0; }
  .video-area::after { bottom: 0; }

  .video-silhouette {
    position: absolute;
    bottom: 12%;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(0deg, #080a10 0%, transparent 100%);
  }

  /* Progress bar */
  .progress-strip {
    height: 3px;
    background: var(--border);
    flex-shrink: 0;
    position: relative;
  }

  .progress-strip-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 56.4%;
    background: var(--yellow);
  }

  /* Player controls — flush left, strict */
  .player-controls {
    background: var(--surface);
    padding: 20px 48px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .player-top {
    display: flex;
    align-items: baseline;
    gap: 24px;
  }

  .player-title {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: var(--text);
  }

  .player-meta {
    font-size: 13px;
    color: var(--text-3);
  }

  .player-time {
    margin-left: auto;
    font-size: 14px;
    color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  .player-time .current {
    color: var(--text);
    font-weight: 700;
  }

  .controls-row {
    display: flex;
    align-items: center;
    gap: 32px;
  }

  .ctrl-btn {
    background: none;
    border: none;
    color: var(--text-2);
    font-size: 13px;
    font-weight: 400;
    cursor: pointer;
    font-family: var(--font);
    padding: 4px 0;
    transition: color 0.12s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ctrl-btn:hover { color: var(--yellow); }

  .ctrl-btn.active-ctrl {
    color: var(--text);
    font-weight: 700;
  }

  .ctrl-spacer { flex: 1; }

  .actions-row {
    display: flex;
    gap: 24px;
  }

  .action-link {
    font-size: 12px;
    color: var(--text-3);
    text-decoration: none;
    font-weight: 400;
    transition: color 0.12s ease;
  }

  .action-link:hover {
    color: var(--yellow);
  }
</style>
</head>
<body>
<div class="app">

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">put<span class="logo-dot">.</span>io</div>
    </div>

    <div class="sidebar-nav">
      <div class="nav-group-label">Library</div>

      <button class="nav-item active">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="2" y="5" width="16" height="12"/>
            <polyline points="2,5 2,3 8,3 10,5"/>
          </svg>
        </span>
        Files
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="10,3 10,14"/>
            <polyline points="6,10 10,14 14,10"/>
            <line x1="4" y1="17" x2="16" y2="17"/>
          </svg>
        </span>
        Transfers
        <span class="nav-badge">3</span>
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M3 14a4 4 0 0 1 4-4"/>
            <path d="M3 10a8 8 0 0 1 8-8"/>
            <circle cx="4" cy="16" r="2" fill="currentColor" stroke="none"/>
          </svg>
        </span>
        RSS Feeds
      </button>

      <div class="nav-divider"></div>
      <div class="nav-group-label">Manage</div>

      <button class="nav-item">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M8 11a4 4 0 0 0 6 .4l2-2a4 4 0 0 0-5.6-5.6L9 5.2"/>
            <path d="M12 9a4 4 0 0 0-6-.4l-2 2a4 4 0 0 0 5.6 5.6l1.4-1.4"/>
          </svg>
        </span>
        Shared
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="10" cy="10" r="8"/>
            <polyline points="10,5 10,10 13,12"/>
          </svg>
        </span>
        History
      </button>

      <button class="nav-item">
        <span class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
            <line x1="3" y1="5" x2="17" y2="5"/>
            <path d="M7 5V3h6v2"/>
            <path d="M5 5l1 12h8l1-12"/>
          </svg>
        </span>
        Trash
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="storage-bar">
        <div class="storage-fill"></div>
      </div>
      <div class="storage-label"><strong>39 TB</strong> / 50 TB</div>
    </div>

    <div class="user-row">
      <div class="user-avatar">A</div>
      <span class="user-name">altay</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content">

    <!-- Video -->
    <div class="video-area">
      <div class="video-silhouette"></div>
    </div>

    <!-- Progress -->
    <div class="progress-strip">
      <div class="progress-strip-fill"></div>
    </div>

    <!-- Controls -->
    <div class="player-controls">
      <div class="player-top">
        <span class="player-title">Inception</span>
        <span class="player-meta">2010 &mdash; 2160p UHD &mdash; x265 &mdash; 6.7 GB</span>
        <span class="player-time"><span class="current">1:23:10</span> / 2:28:00</span>
      </div>

      <div class="controls-row">
        <button class="ctrl-btn active-ctrl">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
            <rect x="3" y="3" width="4" height="10"/>
            <rect x="9" y="3" width="4" height="10"/>
          </svg>
          Pause
        </button>
        <button class="ctrl-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="12,8 4,3 4,13 12,8"/>
            <line x1="2" y1="3" x2="2" y2="13"/>
          </svg>
          Previous
        </button>
        <button class="ctrl-btn">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <polyline points="4,8 12,3 12,13 4,8"/>
            <line x1="14" y1="3" x2="14" y2="13"/>
          </svg>
          Next
        </button>
        <span class="ctrl-spacer"></span>
        <button class="ctrl-btn">Subtitles</button>
        <button class="ctrl-btn">Cast</button>
        <button class="ctrl-btn">Fullscreen</button>
      </div>

      <div class="actions-row">
        <a class="action-link" href="#">Download</a>
        <a class="action-link" href="#">Share</a>
        <a class="action-link" href="#">Move</a>
        <a class="action-link" href="#">Rename</a>
        <a class="action-link" href="#">Delete</a>
      </div>
    </div>

  </div>
</div>
</body>
</html>
