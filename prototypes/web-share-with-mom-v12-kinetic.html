<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>put.io — Share with Mom (Kinetic)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #111113;
    --bg-2: #19191B;
    --bg-3: #222225;
    --bg-4: #2C2C30;
    --border: #4B4B52;
    --text: #EEEEF0;
    --text-2: #ABABB2;
    --text-3: #6E6E76;
    --yellow: #FDCE45;
    --yellow-glow: rgba(253, 206, 69, 0.15);
    --yellow-soft: rgba(253, 206, 69, 0.06);
    --green: #30A46C;
    --red: #E5484D;
    --font: 'Inter', -apple-system, sans-serif;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 1440px;
    height: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Animated gradient background */
  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 30% 20%, rgba(253,206,69,0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(48,164,108,0.03) 0%, transparent 50%);
    animation: bgShift 12s ease-in-out infinite alternate;
    pointer-events: none;
  }

  @keyframes bgShift {
    0% { opacity: 1; }
    50% { opacity: 0.5; }
    100% { opacity: 1; }
  }

  /* Top brand bar */
  .brand-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 48px;
    z-index: 1;
  }

  .logo {
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  .logo-dot {
    color: var(--yellow);
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }

  .brand-link {
    font-size: 13px;
    color: var(--text-2);
    text-decoration: none;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .brand-link:hover {
    color: var(--yellow);
    text-shadow: 0 0 12px var(--yellow-glow);
  }

  /* Main card */
  .share-card {
    width: 700px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: 16px;
    position: relative;
    z-index: 1;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  /* Animated border effect */
  .share-card::before {
    content: '';
    position: absolute;
    inset: -1px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--yellow), transparent, var(--yellow));
    background-size: 300% 300%;
    animation: borderAnim 6s ease-in-out infinite;
    opacity: 0.15;
    z-index: -1;
  }

  @keyframes borderAnim {
    0%, 100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  .share-header {
    padding: 36px 40px 0;
  }

  .share-from {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-3);
    margin-bottom: 8px;
  }

  .share-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .share-meta {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 500;
    margin-bottom: 24px;
  }

  /* Video preview */
  .video-preview {
    margin: 0 40px;
    background: var(--bg-3);
    border-radius: 12px;
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Shimmer on video */
  .video-preview::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 50%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(253,206,69,0.03), transparent);
    animation: shimmer 4s ease-in-out infinite;
  }

  @keyframes shimmer {
    0% { left: -100%; }
    100% { left: 200%; }
  }

  .play-btn {
    width: 68px;
    height: 68px;
    background: var(--yellow);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 0 24px var(--yellow-glow);
    transition: all 0.3s ease;
    animation: playPulse 2.5s ease-in-out infinite;
    z-index: 1;
  }

  @keyframes playPulse {
    0%, 100% { box-shadow: 0 0 20px var(--yellow-glow); transform: scale(1); }
    50% { box-shadow: 0 0 40px rgba(253, 206, 69, 0.3); transform: scale(1.05); }
  }

  .play-btn:hover {
    box-shadow: 0 0 48px rgba(253, 206, 69, 0.4);
    transform: scale(1.1);
  }

  .play-btn svg { color: var(--bg); }

  .video-duration {
    position: absolute;
    bottom: 16px;
    right: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,0.6);
    padding: 4px 10px;
    border-radius: 6px;
    z-index: 1;
  }

  /* File info row */
  .file-info-row {
    display: flex;
    align-items: center;
    margin: 20px 40px 0;
    padding: 14px 18px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 10px;
    gap: 14px;
    transition: all 0.3s ease;
  }

  .file-info-row:hover {
    border-color: rgba(253, 206, 69, 0.2);
    background: var(--bg-4);
  }

  .file-icon {
    width: 40px;
    height: 40px;
    background: var(--yellow-soft);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon svg { color: var(--yellow); }

  .file-details { flex: 1; }

  .file-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .file-size {
    font-size: 12px;
    color: var(--text-2);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* Expiry */
  .expiry-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 14px 40px 0;
    padding: 12px 18px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 13px;
    color: var(--text-2);
    font-weight: 500;
  }

  .expiry-row svg { color: var(--text-3); flex-shrink: 0; }

  .expiry-time {
    font-weight: 700;
    color: var(--yellow);
    text-shadow: 0 0 8px var(--yellow-glow);
    animation: pulse 3s ease-in-out infinite;
  }

  /* Actions */
  .share-actions {
    padding: 24px 40px;
    display: flex;
    gap: 10px;
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yellow);
    color: var(--bg);
    font-size: 14px;
    font-weight: 700;
    padding: 14px 32px;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    border-radius: 10px;
    flex: 1;
    justify-content: center;
    box-shadow: 0 0 20px var(--yellow-glow);
    transition: all 0.3s ease;
    position: relative;
    overflow: hidden;
  }

  .btn-download::after {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
    animation: shimmer 3s ease-in-out infinite;
  }

  .btn-download:hover {
    box-shadow: 0 0 36px rgba(253, 206, 69, 0.4);
    transform: translateY(-2px);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--bg-3);
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 24px;
    border: 1px solid var(--border);
    cursor: pointer;
    font-family: var(--font);
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  .btn-secondary:hover {
    border-color: var(--yellow);
    color: var(--text);
    box-shadow: 0 0 12px var(--yellow-glow);
    transform: translateX(4px);
  }

  /* Sign-up teaser */
  .signup-teaser {
    margin: 0 40px 32px;
    padding: 20px 24px;
    background: var(--bg-3);
    border: 1px solid var(--border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 16px;
    transition: all 0.3s ease;
  }

  .signup-teaser:hover {
    border-color: rgba(253, 206, 69, 0.2);
  }

  .teaser-text { flex: 1; }

  .teaser-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .teaser-sub {
    font-size: 13px;
    color: var(--text-2);
    font-weight: 400;
  }

  .btn-signup {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 700;
    padding: 10px 18px;
    border: 1px solid var(--yellow);
    border-radius: 8px;
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: all 0.3s ease;
    box-shadow: 0 0 12px var(--yellow-glow);
  }

  .btn-signup:hover {
    background: var(--yellow);
    color: var(--bg);
    box-shadow: 0 0 24px rgba(253, 206, 69, 0.3);
    transform: translateY(-1px);
  }

  /* Footer */
  .page-footer {
    position: absolute;
    bottom: 24px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: var(--text-3);
    z-index: 1;
  }

  /* Floating particles */
  .particle {
    position: absolute;
    width: 4px;
    height: 4px;
    background: var(--yellow);
    border-radius: 50%;
    opacity: 0;
    animation: float 8s ease-in-out infinite;
  }

  .particle:nth-child(1) { left: 10%; top: 20%; animation-delay: 0s; }
  .particle:nth-child(2) { left: 80%; top: 30%; animation-delay: 2s; }
  .particle:nth-child(3) { left: 25%; top: 70%; animation-delay: 4s; }
  .particle:nth-child(4) { left: 90%; top: 60%; animation-delay: 6s; }
  .particle:nth-child(5) { left: 50%; top: 85%; animation-delay: 1s; }

  @keyframes float {
    0%, 100% { opacity: 0; transform: translateY(0) scale(0.5); }
    20% { opacity: 0.6; }
    50% { opacity: 0.3; transform: translateY(-40px) scale(1); }
    80% { opacity: 0.6; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>

  <div class="brand-bar">
    <div class="logo">put<span class="logo-dot">.</span>io</div>
    <a class="brand-link" href="#">What is put.io?</a>

  <div class="share-card">

    <div class="share-header">
      <div class="share-from">Shared by Hasan</div>

    <div class="video-preview">

          <polygon points="9,5 20,12 9,19"/>

      <div class="video-duration">12:14</div>
    </div>

    <div class="file-info-row">
      <div class="file-icon">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="8,5 16,10 8,15"/>
        </svg>
      </div>
      <div class="file-details">
        <div class="file-name">Cosmos Laundromat.mp4</div>
        <div class="file-size">209.89 MB</div>
      </div>
    </div>

    <div class="expiry-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <polyline points="8,4 8,8 11,10"/>
      </svg>
      Expires in <span class="expiry-time">6 days, 23 hours</span>

    <div class="share-actions">
      <button class="btn-download">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8,2 8,11"/>
          <polyline points="4,8 8,11 12,8"/>
          <line x1="3" y1="14" x2="13" y2="14"/>

        Download
      </button>
      <button class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="5" height="5" rx="1"/>
          <rect x="9" y="9" width="5" height="5" rx="1"/>

          <path d="M7 11H5V9"/>

        Save to my put.io
      </button>
    </div>

    <div class="signup-teaser">
      <div class="teaser-text">
        <div class="teaser-title">Don't have put.io yet? (^_~)</div>
        <div class="teaser-sub">Fetch, store, and stream anything. Your cloud, your rules.</div>
      </div>
      <button class="btn-signup">
        Sign Up Free
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="6" x2="10" y2="6"/>
          <polyline points="7,3 10,6 7,9"/>
        </svg>
      </button>
    </div>

  </div>

  <div class="page-footer">put.io -- your files, anywhere (^_^)</div>
</div>
</body>
</html>
