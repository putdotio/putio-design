<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io — Player (Minimal Ink)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0E0E0E;
    --text: #E8E8E8;
    --muted: #666666;
    --yellow: #FDCE45;
    --mono: 'IBM Plex Mono', 'iA Writer Quattro', 'Menlo', 'Consolas', monospace;
  }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 24px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .frame {
    width: 1440px;
    height: 900px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ================================================================
     TOP NAVIGATION — minimal, pushed to edges
     ================================================================ */
  .nav {
    width: 100%;
    padding: 24px 80px 0;
    display: flex;
    align-items: center;
    flex-shrink: 0;
  }

  .nav-brand {
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-decoration: none;
    margin-right: auto;
  }

  .nav-back {
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    transition: color 0.15s ease;
  }

  .nav-back:hover {
    color: var(--yellow);
  }

  /* ================================================================
     VIDEO AREA — the experience
     ================================================================ */
  .video-container {
    width: 100%;
    flex-shrink: 0;
    padding: 32px 80px 0;
  }

  .video-surface {
    width: 100%;
    aspect-ratio: 16 / 9;
    max-height: 540px;
    background: #000000;
    position: relative;
    overflow: hidden;
  }

  /* Simulated video frame — a still from a cinematic scene */
  .video-frame {
    width: 100%;
    height: 100%;
    background: linear-gradient(
      180deg,
      #0a0c12 0%,
      #111520 30%,
      #1a1e2e 50%,
      #141824 70%,
      #0a0c12 100%
    );
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Cinematic letterbox bars */
  .video-frame::before,
  .video-frame::after {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    height: 14%;
    background: #000000;
  }
  .video-frame::before { top: 0; }
  .video-frame::after { bottom: 0; }

  /* Subtle city silhouette in the frame */
  .video-silhouette {
    position: absolute;
    bottom: 14%;
    left: 0;
    right: 0;
    height: 30%;
    background: linear-gradient(
      0deg,
      #0d0f18 0%,
      transparent 100%
    );
  }

  /* ================================================================
     PROGRESS LINE — thin yellow line
     ================================================================ */
  .progress-container {
    width: 100%;
    padding: 0 80px;
    flex-shrink: 0;
  }

  .progress-track {
    width: 100%;
    height: 2px;
    background: #1a1a1a;
    position: relative;
    cursor: pointer;
  }

  .progress-fill {
    position: absolute;
    left: 0;
    top: 0;
    height: 100%;
    width: 56.4%;
    background: var(--yellow);
  }

  /* ================================================================
     PLAYER INFO — below video, 640px column
     ================================================================ */
  .player-info {
    width: 100%;
    padding: 24px 80px 0;
    display: flex;
    flex-direction: column;
    flex: 1;
  }

  .player-top-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 4px;
  }

  .player-title {
    font-size: 16px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .player-time {
    color: var(--muted);
    font-size: 13px;
    flex-shrink: 0;
    margin-left: 32px;
  }

  .player-time .current {
    color: var(--text);
  }

  .player-meta {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 32px;
  }

  /* ================================================================
     CONTROLS — text only
     ================================================================ */
  .controls {
    display: flex;
    align-items: center;
    gap: 32px;
    margin-bottom: 32px;
  }

  .control-link {
    color: var(--muted);
    font-size: 13px;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
    background: none;
    border: none;
    font-family: var(--mono);
    padding: 0;
  }

  .control-link:hover {
    color: var(--yellow);
  }

  .control-link.active-control {
    color: var(--text);
  }

  .controls-sep {
    flex: 1;
  }

  /* ================================================================
     FILE ACTIONS — text below controls
     ================================================================ */
  .file-actions {
    display: flex;
    gap: 24px;
  }

  .action-link {
    color: #444444;
    font-size: 12px;
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s ease;
    letter-spacing: 0.02em;
  }

  .action-link:hover {
    color: var(--yellow);
  }

  /* ================================================================
     FOOTER
     ================================================================ */
  .footer {
    width: 100%;
    padding: 0 80px 24px;
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    flex-shrink: 0;
  }

  .footer-brand {
    color: #333333;
    font-size: 12px;
    letter-spacing: 0.02em;
  }

  .kaomoji {
    color: #2a2a2a;
    font-size: 11px;
    margin-left: 16px;
    letter-spacing: 0;
  }
</style>
</head>
<body>

<div class="frame">

  <!-- Navigation — minimal for player -->
  <nav class="nav">
    <a class="nav-brand" href="#">put.io</a>
    <a class="nav-back" href="#">back to files</a>
  </nav>

  <!-- Video -->
  <div class="video-container">
    <div class="video-surface">
      <div class="video-frame">
        <div class="video-silhouette"></div>
      </div>
    </div>
  </div>

  <!-- Progress line -->
  <div class="progress-container">
    <div class="progress-track">
      <div class="progress-fill"></div>
    </div>
  </div>

  <!-- Player info -->
  <div class="player-info">
    <div class="player-top-row">
      <span class="player-title">Inception.2010.2160p.WEB-DL.DDP5.1.Atmos.x265-FLUX</span>
      <span class="player-time"><span class="current">1:23:10</span> / 2:28:00</span>
    </div>

    <div class="player-meta">
      2010 &mdash; 2160p UHD &mdash; x265 &mdash; 6.7 GB &mdash; .mkv
    </div>

    <!-- Text controls -->
    <div class="controls">
      <button class="control-link active-control">pause</button>
      <button class="control-link">previous</button>
      <button class="control-link">next</button>
      <span class="controls-sep"></span>
      <button class="control-link">subtitles</button>
      <button class="control-link">cast</button>
      <button class="control-link">fullscreen</button>
    </div>

    <!-- File actions -->
    <div class="file-actions">
      <a class="action-link" href="#">download</a>
      <a class="action-link" href="#">share</a>
      <a class="action-link" href="#">move</a>
      <a class="action-link" href="#">rename</a>
      <a class="action-link" href="#">delete</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer">
    <span class="footer-brand">put.io<span class="kaomoji">&nbsp;&nbsp;&nbsp;&#x1566;(&#xF2;_&#xF3;&#x2C7;)&#x1564;</span></span>
  </footer>

</div>

</body>
</html>
