        </div>
        <div class="track-row">
          <div class="track-check"></div>
          <span class="track-label">English Stereo</span>
        </div>
        <div class="track-row">
          <div class="track-check"></div>
          <span class="track-label">Commentary</span>
        </div>
      </div>
    </div>

  </div>

  <!-- Floating Tab Bar - iOS 26 Liquid Glass -->
  <div class="floating-tab-bar">
    <!-- Files -->

      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <circle cx="7.5" cy="7.5" r="5.5" stroke="var(--label-tertiary)" stroke-width="2"/>

    <!-- RSS -->
    <div class="ftab">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="var(--label-tertiary)">
        <circle cx="3.5" cy="14.5" r="2"/>

      </svg>
      <span class="ftab-label">RSS</span>
    </div>
    <!-- Settings -->
    <div class="ftab">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="var(--label-tertiary)">
        <path d="M9 11.5a2.5 2.5 0 100-5 2.5 2.5 0 000 5z"/>

      </svg>

    </div>
  </div>

</div>
