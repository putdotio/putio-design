<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#0A0A0C">
<title>put.io — tvOS Resume Playback</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #141416; --bg-3: #1E1E22; --bg-4: #28282E;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.15);
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .tv-frame {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
  }

  /* Cinematic video background */
  .video-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 40%, rgba(22, 33, 62, 0.8) 0%, transparent 60%),
      radial-gradient(ellipse at 70% 60%, rgba(26, 26, 46, 0.9) 0%, transparent 50%),
      radial-gradient(ellipse at 50% 80%, rgba(15, 52, 96, 0.5) 0%, transparent 40%),
      linear-gradient(180deg, #0d0d12 0%, #111128 30%, #0a1628 60%, #080810 100%);
  }

  /* Dark overlay */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.55);
  }

  /* Centered prompt */
  .prompt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }

  .prompt-content {
    width: 550px;
    text-align: center;
  }

  /* Title */
  .title {
    font-size: 42px; font-weight: 700; color: #fff;
    line-height: 1.2; letter-spacing: -0.02em;
  }

  /* Badges */
  .badges {
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    margin-top: 14px;
  }

  .badge {
    font-size: 16px; font-weight: 600;
    text-transform: uppercase;
    background: rgba(255,255,255,0.08);
    color: var(--text-2);
    padding: 6px 16px; border-radius: 8px;
    line-height: 1.4;
  }

  /* File info */
  .file-info {
    font-size: 20px; color: var(--text-2);
    margin-top: 10px;
  }

  /* Progress bar */
  .progress-section {
    margin-top: 36px;
  }

  .progress-track {
    width: 100%; height: 6px;
    background: rgba(255,255,255,0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    width: 82%; height: 100%;
    background: var(--yellow);
    border-radius: 3px;
    box-shadow: 0 0 12px rgba(253, 206, 69, 0.3);
  }

  .progress-times {
    display: flex; justify-content: space-between;
    margin-top: 10px;
  }

  .time-current {
    font-size: 18px; font-weight: 500; color: var(--yellow);
    font-variant-numeric: tabular-nums;
  }

  .time-total {
    font-size: 18px; font-weight: 500; color: var(--text-2);
    font-variant-numeric: tabular-nums;
  }

  /* Buttons */
  .buttons {
    margin-top: 40px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .btn {
    width: 100%; padding: 22px;
    border-radius: 14px;
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    transition: all 0.15s;
  }

  .btn-continue {
    font-weight: 600; color: #fff;
    background: rgba(253, 206, 69, 0.1);
    border: 2px solid var(--yellow);
    box-shadow: 0 0 0 3px rgba(253, 206, 69, 0.25), 0 4px 24px rgba(253, 206, 69, 0.15);
  }

  .btn-continue .play-icon {
    width: 18px; height: 18px;
    flex-shrink: 0;
  }

  .btn-start-over {
    font-weight: 500; color: var(--text-2);
    background: transparent;
    border: 2px solid rgba(255,255,255,0.1);
  }

  /* put.io watermark */
  .watermark {
    position: absolute; top: 40px; left: 60px; z-index: 5;
    font-size: 22px; font-weight: 700;
    color: rgba(255,255,255,0.25);
    letter-spacing: -0.02em;
  }
  .watermark span { color: rgba(253,206,69,0.4); }
</style>
</head>
<body>
<div class="tv-frame">
  <!-- Cinematic background -->
  <div class="video-bg"></div>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- put.io watermark -->
  <div class="watermark">put<span>.</span>io</div>

  <!-- Resume prompt -->
  <div class="prompt">
    <div class="prompt-content">

      <!-- Title + badges -->
      <h1 class="title">The Wire</h1>
      <div class="badges">
        <span class="badge">S3 · E4</span>
        <span class="badge">1080p</span>
        <span class="badge">MKV</span>
      </div>
      <div class="file-info">1.8 GB · 51 min</div>

      <!-- Progress bar -->
      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span class="time-current">42:17</span>
          <span class="time-total">51:00</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="buttons">
        <button class="btn btn-continue">
          <svg class="play-icon" viewBox="0 0 18 18" fill="none">
            <path d="M4 2.5v13l11.5-6.5L4 2.5z" fill="currentColor"/>
          </svg>
          Continue from 42:17
        </button>
        <button class="btn btn-start-over">Start from beginning</button>
      </div>

    </div>
  </div>
</div>
</body>
</html>
