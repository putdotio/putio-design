<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>put.io -- Login (Scandinavian)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #FAF7F2; --bg-card: #FFFFFF; --bg-warm: #F3EDE4; --bg-cream: #FFF8ED;
    --text: #2C2417; --text-2: #8C7E6A; --text-3: #B8A98E; --line: #E8DFD1;
    --yellow: #FDCE45; --yellow-soft: #FFF4D6; --yellow-hover: #F5C030;
    --orange: #E8945A; --green: #7DB87D; --terracotta: #C47A5A;
    --shadow: 0 4px 24px rgba(44,36,23,0.06);
    --shadow-lg: 0 12px 48px rgba(44,36,23,0.10);
  }
  body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .page { width: 1440px; height: 900px; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }

  /* Warm background shapes */
  .bg-shape-1 {
    position: absolute; width: 600px; height: 600px; border-radius: 50%;
    background: radial-gradient(circle, rgba(253,206,69,0.08) 0%, transparent 70%);
    top: -150px; right: -100px; pointer-events: none;
  }
  .bg-shape-2 {
    position: absolute; width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(232,148,90,0.06) 0%, transparent 70%);
    bottom: -80px; left: -60px; pointer-events: none;
  }

  .login-container {
    width: 480px; background: var(--bg-card); border-radius: 28px;
    padding: 56px 48px; box-shadow: var(--shadow-lg); position: relative; z-index: 1;
  }

  .logo-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 40px; }
  .logo { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--text); }
  .logo span { color: var(--yellow); }
  .kaomoji { font-size: 14px; color: var(--text-3); }

  .welcome-title { font-size: 32px; font-weight: 800; letter-spacing: -0.03em; margin-bottom: 8px; color: var(--text); }
  .welcome-subtitle { font-size: 15px; color: var(--text-2); margin-bottom: 36px; line-height: 1.5; }

  .form-group { margin-bottom: 20px; }
  .form-label { display: block; font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 8px; }
  .form-input {
    width: 100%; background: var(--bg); border: 1.5px solid var(--line); border-radius: 14px;
    padding: 14px 18px; font-size: 15px; color: var(--text); font-family: inherit; outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .form-input:focus { border-color: var(--yellow); box-shadow: 0 0 0 4px var(--yellow-soft); }
  .form-input::placeholder { color: var(--text-3); }

  .form-options { display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
  .remember { display: flex; align-items: center; gap: 10px; }
  .toggle-track {
    width: 44px; height: 24px; border-radius: 12px; background: var(--line);
    position: relative; cursor: pointer;
  }
  .toggle-track.on { background: var(--yellow); }
  .toggle-knob {
    width: 20px; height: 20px; border-radius: 50%; background: white;
    position: absolute; top: 2px; left: 2px;
    box-shadow: 0 1px 4px rgba(44,36,23,0.15);
  }
  .toggle-track.on .toggle-knob { left: 22px; }
  .remember-label { font-size: 13px; color: var(--text-2); }
  .forgot-link { font-size: 13px; color: var(--terracotta); text-decoration: none; font-weight: 500; }

  .btn-login {
    width: 100%; padding: 16px; border-radius: 14px; border: none;
    background: var(--yellow); color: var(--text); font-size: 16px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin-bottom: 20px;
    box-shadow: 0 4px 16px rgba(253,206,69,0.25);
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-login:hover { background: var(--yellow-hover); }

  .divider { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .divider-line { flex: 1; height: 1px; background: var(--line); }
  .divider-text { font-size: 12px; color: var(--text-3); }

  .signup-row { text-align: center; font-size: 14px; color: var(--text-2); }
  .signup-link { color: var(--terracotta); text-decoration: none; font-weight: 600; }

  .trust-row {
    display: flex; align-items: center; justify-content: center; gap: 20px;
    margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--line);
  }
  .trust-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); }
  .trust-item svg { width: 16px; height: 16px; fill: var(--green); }

  /* Decorative card behind */
  .deco-card {
    position: absolute; width: 480px; height: 200px;
    background: var(--bg-warm); border-radius: 28px;
    top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-3deg) translateY(20px);
    z-index: 0; box-shadow: var(--shadow);
  }
</style>
</head>
<body>
<div class="page">
  <div class="bg-shape-1"></div>
  <div class="bg-shape-2"></div>
  <div class="deco-card"></div>

  <div class="login-container">
    <div class="logo-row">
      <div class="logo">put<span>.</span>io</div>
      <div class="kaomoji">( ^_^)/</div>
    </div>

    <h1 class="welcome-title">Come on in</h1>
    <p class="welcome-subtitle">Good to see you again. Your files are cozy and waiting for you.</p>

    <div class="form-group">
      <label class="form-label">Email</label>
      <input type="email" class="form-input" placeholder="you@example.com" value="altay@put.io" />
    </div>
    <div class="form-group">
      <label class="form-label">Password</label>
      <input type="password" class="form-input" placeholder="Your password" />
    </div>

    <div class="form-options">
      <div class="remember">
        <div class="toggle-track on">
          <div class="toggle-knob"></div>
        </div>
        <span class="remember-label">Remember me</span>
      </div>
      <a class="forgot-link">Forgot password?</a>
    </div>

    <button class="btn-login">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#2C2417"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
      Sign in
    </button>

    <div class="divider">
      <div class="divider-line"></div>
      <span class="divider-text">or</span>
      <div class="divider-line"></div>
    </div>

    <div class="signup-row">
      First time here? <a class="signup-link">Create your account</a>
    </div>

    <div class="trust-row">
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
        Encrypted
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4z"/></svg>
        Private
      </div>
      <div class="trust-item">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/></svg>
        No tracking
      </div>
    </div>
  </div>
</div>
</body>
</html>
