<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io — iOS Now Playing (v12 Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000000;
    --surface: #111113;
    --surface-2: #1C1C1E;
    --elevated: #2C2C2E;
    --text: #FFFFFF;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --yellow-glow: rgba(253,206,69,0.35);
    --green: #30D158;
    --red: #FF453A;
    --blue: #0A84FF;
    --line: rgba(255,255,255,0.06);
    --radius: 12px;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: #111;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .phone {
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg);
  }

  /* Status Bar */
  .status-bar {
    display: flex; align-items: center; padding: 14px 28px 0;
    font-size: 15px; font-weight: 600; height: 54px; flex-shrink: 0;
  }
  .status-bar .time { flex: 1; letter-spacing: -0.3px; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* Top nav */
  .top-nav {
    display: flex; align-items: center; padding: 4px 20px 0;
    flex-shrink: 0;
  }
  .nav-btn {
    width: 36px; height: 36px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top-nav .spacer { flex: 1; }
  .top-nav .source-label {
    font-size: 11px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
  }

  /* Album Art */
  .art-container {
    padding: 24px 40px 0;
    flex-shrink: 0;
  }
  .album-art {
    width: 100%; aspect-ratio: 1;
    background: var(--surface);
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    position: relative;
  }
  .waveform {
    display: flex; align-items: center; gap: 3px;
    height: 80px;
  }
  .waveform .bar {
    width: 3px; border-radius: 999px;
    background: var(--yellow);
    opacity: 0.25;
  }
  .waveform .bar.active {
    opacity: 0.7;
  }
  .waveform .bar.peak {
    opacity: 1;
    box-shadow: 0 0 8px rgba(253,206,69,0.3);
  }

  /* Track Info */
  .track-info {
    padding: 28px 32px 0;
    flex-shrink: 0;
  }
  .track-title {
    font-size: 21px; font-weight: 700; letter-spacing: -0.02em;
    line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .track-subtitle {
    font-size: 15px; font-weight: 500; color: var(--text-2);
    margin-top: 4px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* Progress */
  .progress-container {
    padding: 24px 32px 0;
    flex-shrink: 0;
  }
  .progress-bar {
    height: 4px; background: var(--elevated);
    border-radius: 999px; position: relative;
    cursor: pointer;
  }
  .progress-fill {
    height: 100%; width: 38%;
    background: var(--yellow);
    border-radius: 999px;
    position: relative;
  }
  .progress-dot {
    position: absolute; right: -6px; top: -4px;
    width: 12px; height: 12px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 10px 2px var(--yellow-glow);
  }
  .progress-times {
    display: flex; justify-content: space-between;
    margin-top: 8px;
    font-size: 11px; font-weight: 500; color: var(--text-3);
    font-variant-numeric: tabular-nums;
  }

  /* Transport Controls */
  .controls {
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
    padding: 28px 32px 0;
    flex-shrink: 0;
  }
  .control-btn {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    position: relative;
  }
  .control-btn.secondary {
    opacity: 0.5;
  }
  .control-btn.secondary:hover { opacity: 0.7; }
  .play-btn {
    width: 64px; height: 64px;
    background: var(--text);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .play-btn:hover { transform: scale(1.05); }
  .skip-label {
    position: absolute; bottom: -2px; left: 50%; transform: translateX(-50%);
    font-size: 9px; font-weight: 700; color: var(--text);
  }

  /* Speed pill */
  .speed-row {
    display: flex; align-items: center; justify-content: center;
    padding: 20px 32px 0;
    flex-shrink: 0;
  }
  .speed-pill {
    padding: 6px 16px;
    background: var(--surface-2);
    border-radius: 999px;
    font-size: 13px; font-weight: 600; color: var(--text);
    cursor: pointer;
    transition: background 0.15s;
    letter-spacing: 0.01em;
  }
  .speed-pill:hover { background: var(--elevated); }

  /* Volume */
  .volume-container {
    display: flex; align-items: center; gap: 12px;
    padding: 24px 32px 0;
    flex-shrink: 0;
  }
  .volume-track {
    flex: 1; height: 4px;
    background: var(--elevated);
    border-radius: 999px;
    overflow: hidden;
    cursor: pointer;
  }
  .volume-fill {
    height: 100%; width: 65%;
    background: var(--yellow);
    border-radius: 999px;
  }

  /* Bottom actions */
  .bottom-actions {
    display: flex; align-items: center; justify-content: center;
    gap: 48px;
    padding: 24px 32px 0;
    flex-shrink: 0;
  }
  .action-btn {
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .action-btn:hover { opacity: 0.8; }

  /* Spacer */
  .flex-spacer { flex: 1; }

  /* Mini Player */
  .mini-player {
    display: flex; align-items: center; gap: 12px;
    padding: 8px 16px;
    margin: 0 12px;
    background: var(--surface);
    border-radius: 14px;
    flex-shrink: 0;
    border: 1px solid var(--line);
  }
  .mini-art {
    width: 40px; height: 40px;
    background: var(--surface-2);
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mini-info {
    flex: 1; min-width: 0;
  }
  .mini-title {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-subtitle {
    font-size: 11px; font-weight: 400; color: var(--text-3);
    margin-top: 1px;
  }
  .mini-play {
    width: 32px; height: 32px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  /* Tab Bar */
  .tab-bar {
    position: absolute;
    bottom: 36px;
    left: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    justify-content: space-around;
    padding: 6px 8px;
    background: rgba(40, 40, 44, 0.75);
    backdrop-filter: blur(24px) saturate(150%);
    -webkit-backdrop-filter: blur(24px) saturate(150%);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 24px;
    z-index: 30;
    height: 52px;
  }
  .tab-item {
    display: flex; align-items: center; justify-content: center;
    width: 40px; height: 40px;
    border-radius: 12px;
    cursor: pointer;
    position: relative;
  }
  .tab-item.active {
    background: rgba(255, 255, 255, 0.1);
  }
</style>
</head>
