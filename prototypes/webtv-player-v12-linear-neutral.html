<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io — Smart TV Player (v12 Linear Neutral)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --border: rgba(255,255,255,0.06);
    --text: #FAFAFA;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --green: #30D158;
    --red: #FF453A;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }

  .player-frame {
    width: 1920px;
    height: 1080px;
    position: relative;
    background: var(--surface);
  }

  /* -- Video Placeholder -- */
  .video-bg {
    position: absolute;
    inset: 0;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-bg-text {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-3);
    opacity: 0.3;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  /* -- Gradient Overlays (linear only, no blur) -- */
  .gradient-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 260px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.4) 50%, transparent 100%);
    z-index: 2;
  }
  .gradient-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 380px;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 50%, transparent 100%);
    z-index: 2;
  }

  /* -- Top Info -- */
  .top-info {
    position: absolute;
    top: 48px;
    left: 88px;
    right: 88px;
    z-index: 3;
  }
  .title {
    font-size: 36px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
    margin-bottom: 8px;
  }
  .subtitle {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-2);
  }
  .subtitle .dot {
    margin: 0 10px;
    color: var(--text-3);
  }

  /* -- Center Controls -- */
  .center-controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 64px;
  }
  .ctrl-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
  }
  .ctrl-skip {
    width: 56px;
    height: 56px;
    opacity: 0.7;
  }
  .ctrl-play {
    width: 96px;
    height: 96px;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(255,255,255,0.15);
  }
  .ctrl-play.focused {
    background: var(--yellow-dim);
    border-color: var(--yellow);
  }

  /* -- Bottom Controls -- */
  .bottom-controls {
    position: absolute;
    bottom: 48px;
    left: 88px;
    right: 88px;
    z-index: 3;
  }

  /* Scrubber */
  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 32px;
  }
  .time {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-2);
    min-width: 60px;
    font-variant-numeric: tabular-nums;
  }
  .time.end { text-align: right; }
  .scrubber {
    flex: 1;
    height: 6px;
    background: rgba(255,255,255,0.12);
    border-radius: 3px;
    position: relative;
    cursor: pointer;
  }
  .scrubber-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 3px;
    position: relative;
  }
  .scrubber-dot {
    position: absolute;
    right: -7px;
    top: 50%;
    transform: translateY(-50%);
    width: 14px;
    height: 14px;
    background: var(--yellow);
    border-radius: 50%;
  }

  /* Action Row */
  .action-row {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .action-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 12px;
    cursor: pointer;
  }
  .action-btn.focused {
    background: var(--yellow-dim);
  }
  .action-btn.focused .action-label { color: var(--yellow); }
  .action-btn.focused .action-icon svg { fill: var(--yellow); stroke: var(--yellow); }
  .action-icon {
    width: 24px;
    height: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .action-label {
    font-size: 17px;
    font-weight: 500;
    color: var(--text-2);
  }
</style>
</head>
<body>
<div class="player-frame">

  <!-- Video BG -->
  <div class="video-bg">
    <div class="video-bg-text">Video</div>
  </div>

  <!-- Gradients -->
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>

  <!-- Top Info -->
  <div class="top-info">
    <div class="title">Severance S02E07</div>
    <div class="subtitle">2025<span class="dot">&middot;</span>48 min<span class="dot">&middot;</span>1080p</div>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back -->
    <div class="ctrl-btn ctrl-skip">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M24 8C15.16 8 8 15.16 8 24s7.16 16 16 16 16-7.16 16-16" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round"/>
        <text x="24" y="28" text-anchor="middle" fill="#FAFAFA" font-family="Inter" font-size="11" font-weight="600">10</text>
        <path d="M38 8v8h-8" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(-1,1) translate(-48,0)"/>
      </svg>
    </div>

    <!-- Play -->
    <div class="ctrl-btn ctrl-play focused">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none">
        <path d="M8 5v14l11-7L8 5z" fill="#FAFAFA"/>
      </svg>
    </div>

    <!-- Skip Forward -->
    <div class="ctrl-btn ctrl-skip">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M24 8c8.84 0 16 7.16 16 16s-7.16 16-16 16S8 32.84 8 24" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round"/>
        <text x="24" y="28" text-anchor="middle" fill="#FAFAFA" font-family="Inter" font-size="11" font-weight="600">10</text>
        <path d="M10 8v8h8" stroke="#FAFAFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">

    <!-- Scrubber -->
    <div class="scrubber-row">
      <div class="time">32:14</div>
      <div class="scrubber">
        <div class="scrubber-fill" style="width: 67%">
          <div class="scrubber-dot"></div>
        </div>
      </div>
      <div class="time end">48:00</div>
    </div>

    <!-- Action Row -->
    <div class="action-row">
      <div class="action-btn focused">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
          </svg>
        </div>
        <div class="action-label">Subtitles</div>
      </div>

      <div class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 1a3 3 0 00-3 3v8a3 3 0 006 0V4a3 3 0 00-3-3z"/>
            <path d="M19 10v2a7 7 0 01-14 0v-2"/>
            <line x1="12" y1="19" x2="12" y2="23"/>
            <line x1="8" y1="23" x2="16" y2="23"/>
          </svg>
        </div>
        <div class="action-label">Audio</div>
      </div>

      <div class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="action-label">Speed</div>
      </div>

      <div class="action-btn">
        <div class="action-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <line x1="12" y1="16" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
        </div>
        <div class="action-label">Info</div>
      </div>
    </div>

  </div>

</div>
</body>
</html>
