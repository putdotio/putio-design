<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#111113">
<title>put.io — Android TV Auth (Glass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #111113; --bg-2: #19191B; --bg-3: #222225; --bg-4: #2C2C30;
    --glass: rgba(255,255,255,0.05); --glass-hover: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.08); --glass-border-strong: rgba(255,255,255,0.12);
    --glass-inset: inset 0 1px 1px rgba(255,255,255,0.04);
    --text: #EEEEF0; --text-2: #ABABB2; --text-3: #77777F;
    --yellow: #FDCE45; --yellow-dim: rgba(253,206,69,0.12); --yellow-glow: rgba(253,206,69,0.20);
    --green: #30A46C; --red: #E5484D;
    --blur-heavy: blur(40px); --blur-medium: blur(24px); --blur-light: blur(16px);
    --radius: 16px; --radius-sm: 10px;
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .tv-frame {
    width: 1920px; height: 1080px; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    position: relative; background: var(--bg);
  }
  /* Warm ambient glow orbs */
  .tv-frame::before {
    content: ''; position: absolute; top: -200px; right: 300px;
    width: 800px; height: 800px;
    background: radial-gradient(circle, rgba(253,206,69,0.06) 0%, rgba(253,206,69,0.015) 40%, transparent 70%);
    pointer-events: none;
  }
  .tv-frame::after {
    content: ''; position: absolute; bottom: -200px; left: 300px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(253,206,69,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .auth-block {
    display: flex; flex-direction: column; align-items: center; gap: 40px;
    z-index: 1;
  }
  .logo { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; }
  .logo .dot { color: var(--yellow); text-shadow: 0 0 20px var(--yellow-glow); }

  .instruction {
    font-size: 24px; color: var(--text-2); font-weight: 400; margin-top: -12px;
  }
  .instruction strong { color: var(--text); font-weight: 600; }

  .code-row { display: flex; gap: 16px; }
  .code-cell {
    width: 88px; height: 110px;
    background: var(--glass); backdrop-filter: var(--blur-medium);
    -webkit-backdrop-filter: var(--blur-medium);
    border: 1px solid var(--glass-border-strong);
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 52px; font-weight: 700; color: var(--text);
    box-shadow: var(--glass-inset), 0 8px 32px rgba(0,0,0,0.3);
  }

  .qr-section {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .qr-box {
    width: 180px; height: 180px;
    background: #fff; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), 0 0 30px rgba(253,206,69,0.08);
  }
  .qr-pattern {
    width: 140px; height: 140px;
    display: grid; grid-template-columns: repeat(11, 1fr); grid-template-rows: repeat(11, 1fr); gap: 2px;
  }
  .qr-pattern .cell { border-radius: 1px; }
  .qr-pattern .cell.dark { background: #1a1a1e; }
  .qr-pattern .cell.light { background: #fff; }

  .qr-label { font-size: 18px; color: var(--text-2); }

  .waiting {
    display: flex; align-items: center; gap: 14px;
    background: var(--glass); backdrop-filter: var(--blur-light);
    -webkit-backdrop-filter: var(--blur-light);
    border: 1px solid var(--glass-border);
    border-radius: 999px; padding: 14px 28px;
    box-shadow: var(--glass-inset);
  }
  .spinner {
    width: 22px; height: 22px;
    border: 2.5px solid var(--yellow);
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .waiting-text { font-size: 18px; color: var(--text-2); }
</style>
</head>

<div class="tv-frame">

        </div>
      </div>
      <div class="qr-label">Scan with your phone</div>
    </div>
    <div class="waiting">
      <div class="spinner"></div>
      <div class="waiting-text">Waiting for authentication...</div>
    </div>
  </div>
</div>
</body>
</html>
