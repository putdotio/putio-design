<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=920">
<title>put.io — watchOS Complications + Glances</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-2: #2C2C2E;
    --surface-3: #3A3A3C;
    --text: #FFFFFF;
    --text-2: #EBEBF5;
    --text-3: #8E8E93;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253, 206, 69, 0.7);
    --yellow-subtle: rgba(253, 206, 69, 0.15);
    --green: #30D158;
    --green-subtle: rgba(48, 209, 88, 0.15);
    --red: #FF453A;
    --blue: #0A84FF;
  }
  body {
    font-family: 'Inter', -apple-system, 'SF Pro Rounded', sans-serif;
    background: #1C1C1E;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 900px; height: 500px;
    display: flex; align-items: center; justify-content: center;
  }

  .watch-row {
    display: flex;
    gap: 20px;
    align-items: center;
  }

  /* Watch face container — 45mm Apple Watch proportions */
  .watch-face {
    width: 198px;
    height: 242px;
    background: var(--bg);
    border-radius: 48px;
    overflow: hidden;
    position: relative;
    flex-shrink: 0;
    /* Subtle bezel effect */
    box-shadow:
      0 0 0 1px rgba(255, 255, 255, 0.06),
      0 4px 24px rgba(0, 0, 0, 0.5);
  }

  /* ==========================================
     FACE 1: Storage Complication (Circular)
     ========================================== */
  .face-storage {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    padding: 20px;
  }

  .storage-ring {
    position: relative;
    width: 130px; height: 130px;
    display: flex; align-items: center; justify-content: center;
  }
  .storage-ring svg {
    position: absolute; width: 130px; height: 130px;
  }
  .ring-text {
    position: relative; z-index: 1; text-align: center;
  }
  .ring-main {
    font-size: 36px; font-weight: 700; color: var(--text);
    line-height: 1; letter-spacing: -0.02em;
  }
  .ring-unit {
    font-size: 14px; font-weight: 500; color: var(--text-3);
    letter-spacing: 0.01em;
  }
  .ring-sub {
    font-size: 11px; color: var(--text-3); margin-top: 4px;
    font-weight: 400;
  }

  .storage-app-label {
    display: flex; align-items: center; gap: 4px;
    margin-top: 14px;
  }
  .storage-app-icon {
    width: 14px; height: 14px; border-radius: 4px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .storage-app-icon svg { width: 8px; height: 8px; }
  .storage-app-name {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ==========================================
     FACE 2: Transfer Notification
     ========================================== */
  .face-notification {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 20px 16px 16px;
  }
  .notif-header {
    display: flex; align-items: center; gap: 6px;
    margin-bottom: 16px;
  }
  .notif-app-icon {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .notif-app-icon svg { width: 11px; height: 11px; }
  .notif-app-name {
    font-size: 11px; color: var(--text-3); font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.04em;
  }

  .notif-body {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 8px;
  }
  .notif-check {
    width: 40px; height: 40px; border-radius: 999px;
    background: var(--green);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 16px rgba(48, 209, 88, 0.25);
  }
  .notif-check svg { width: 22px; height: 22px; }
  .notif-title {
    font-size: 15px; font-weight: 700; color: var(--text);
    line-height: 1.2;
  }
  .notif-filename {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    line-height: 1.3;
  }
  .notif-meta {
    font-size: 10px; color: var(--text-3); font-weight: 400;
  }
  .notif-action {
    width: 100%;
    background: var(--surface-2);
    border: none; border-radius: 14px;
    padding: 10px 0;
    font-size: 13px; font-weight: 600;
    color: var(--blue);
    cursor: pointer; font-family: inherit;
    margin-top: 8px;
  }

  /* ==========================================
     FACE 3: Active Transfers Widget
     ========================================== */
  .face-transfers {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 20px 14px 16px;
  }
  .transfers-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .transfers-title {
    font-size: 11px; font-weight: 700; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .transfers-count {
    font-size: 10px; font-weight: 600; color: var(--text-3);
    background: var(--surface-2);
    padding: 2px 7px; border-radius: 6px;
  }

  .transfer-list {
    flex: 1; display: flex; flex-direction: column; gap: 8px;
    justify-content: center;
  }
  .transfer-item {
    display: flex; align-items: center; gap: 8px;
  }
  .transfer-dot {
    width: 6px; height: 6px; border-radius: 50%;
    flex-shrink: 0;
  }
  .transfer-dot.active { background: var(--yellow); }
  .transfer-dot.done { background: var(--green); }
  .transfer-name {
    flex: 1; font-size: 12px; font-weight: 500; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    line-height: 1.3;
  }
  .transfer-pct {
    font-size: 11px; font-weight: 700; color: var(--text);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .transfer-pct.done {
    color: var(--green);
  }

  /* Progress bar per transfer */
  .transfer-progress {
    margin-top: 3px;
  }
  .transfer-progress-track {
    width: 100%; height: 2px;
    background: var(--surface-3); border-radius: 1px;
  }
  .transfer-progress-fill {
    height: 100%; border-radius: 1px;
    background: var(--yellow);
  }
  .transfer-progress-fill.done {
    background: var(--green);
  }

  /* App label at bottom */
  .transfers-app-label {
    display: flex; align-items: center; gap: 4px;
    margin-top: 12px; justify-content: center;
  }
  .transfers-app-icon {
    width: 12px; height: 12px; border-radius: 3px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .transfers-app-icon svg { width: 7px; height: 7px; }
  .transfers-app-name {
    font-size: 9px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
  }

  /* ==========================================
     FACE 4: Now Playing (Audio)
     ========================================== */
  .face-nowplaying {
    display: flex;
    flex-direction: column;
    height: 100%;
    position: relative;
  }

  /* Edge progress arc */
  .np-edge-arc {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  .np-edge-arc svg {
    width: 100%; height: 100%;
  }

  .np-content {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; padding: 20px 16px;
    position: relative; z-index: 1;
  }

  .np-header {
    display: flex; align-items: center; gap: 5px;
    margin-bottom: 12px; align-self: flex-start;
  }
  .np-app-icon {
    width: 16px; height: 16px; border-radius: 5px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .np-app-icon svg { width: 9px; height: 9px; }
  .np-app-name {
    font-size: 10px; color: var(--text-3); font-weight: 600;
  }

  .np-artwork {
    width: 64px; height: 64px;
    background: linear-gradient(135deg, #2C2C2E 0%, #1C1C1E 100%);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 10px;
    border: 1px solid rgba(255, 255, 255, 0.06);
  }
  .np-artwork svg { width: 24px; height: 24px; }

  .np-track {
    font-size: 13px; font-weight: 600; color: var(--text);
    text-align: center; line-height: 1.2;
    max-width: 160px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .np-source {
    font-size: 11px; color: var(--text-3); font-weight: 400;
    text-align: center; margin-top: 2px;
  }

  .np-controls {
    display: flex; align-items: center; gap: 20px;
    margin-top: 10px;
  }
  .np-btn {
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer;
  }
  .np-btn svg { fill: var(--text-2); }
  .np-btn.skip svg { width: 14px; height: 14px; fill: var(--text-3); }
  .np-btn.play {
    width: 36px; height: 36px;
    background: var(--yellow);
    border-radius: 999px;
  }
  .np-btn.play svg { width: 16px; height: 16px; fill: #000; }

  .np-time {
    font-size: 12px; font-weight: 600; color: var(--text);
    font-variant-numeric: tabular-nums;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="watch-row">

  <!-- ==========================================
       FACE 1: Storage Complication (Circular)
       ========================================== -->
  <div class="watch-face">
    <div class="face-storage">
      <div class="storage-ring">
        <svg viewBox="0 0 130 130">
          <!-- Background ring -->
          <circle cx="65" cy="65" r="56" fill="none" stroke="#1C1C1E" stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="352" stroke-dashoffset="0"
            transform="rotate(-225 65 65)"/>
          <!-- Used portion (78% of ~270deg arc = ~210deg) -->
          <!-- Total arc dasharray = 2*PI*56 * 0.75 = ~263.9 -->
          <circle cx="65" cy="65" r="56" fill="none" stroke="#2C2C2E" stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="264 352"
            transform="rotate(135 65 65)"/>
          <!-- Yellow fill: 78% of 264 = ~206 -->
          <circle cx="65" cy="65" r="56" fill="none" stroke="#FDCE45" stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="206 352"
            transform="rotate(135 65 65)"/>
        </svg>
        <div class="ring-text">
          <div class="ring-main">39<span class="ring-unit">TB</span></div>
          <div class="ring-sub">of 50 TB</div>
        </div>
      </div>

      <div class="storage-app-label">
        <div class="storage-app-icon">
          <!-- put.io pixel "p" -->
          <svg viewBox="0 0 16 16" fill="#000">
            <rect x="3" y="3" width="3" height="10"/>
            <rect x="6" y="3" width="4" height="3"/>
            <rect x="10" y="3" width="3" height="6"/>
            <rect x="6" y="6" width="4" height="3"/>
          </svg>
        </div>
        <span class="storage-app-name">put.io</span>
      </div>
    </div>
  </div>

  <!-- ==========================================
       FACE 2: Transfer Notification
       ========================================== -->
  <div class="watch-face">
    <div class="face-notification">
      <div class="notif-header">
        <div class="notif-app-icon">
          <svg viewBox="0 0 16 16" fill="#000">
            <rect x="3" y="3" width="3" height="10"/>
            <rect x="6" y="3" width="4" height="3"/>
            <rect x="10" y="3" width="3" height="6"/>
            <rect x="6" y="6" width="4" height="3"/>
          </svg>
        </div>
        <span class="notif-app-name">put.io</span>
      </div>

      <div class="notif-body">
        <div class="notif-check">
          <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20,6 9,17 4,12"/>
          </svg>
        </div>
        <div class="notif-title">Transfer Complete</div>
        <div class="notif-filename">Pose &middot; 720p WEBRip</div>
        <div class="notif-meta">763 MB &middot; 3 minutes</div>
      </div>

      <button class="notif-action">Open on iPhone</button>
    </div>
  </div>

  <!-- ==========================================
       FACE 3: Active Transfers Widget
       ========================================== -->
  <div class="watch-face">
    <div class="face-transfers">
      <div class="transfers-header">
        <span class="transfers-title">Transfers</span>
        <span class="transfers-count">3</span>
      </div>

      <div class="transfer-list">
        <!-- Transfer 1 -->
        <div>
          <div class="transfer-item">
            <div class="transfer-dot active"></div>
            <span class="transfer-name">Inception</span>
            <span class="transfer-pct">63%</span>
          </div>
          <div class="transfer-progress" style="margin-left:14px;">
            <div class="transfer-progress-track">
              <div class="transfer-progress-fill" style="width:63%;"></div>
            </div>
          </div>
        </div>

        <!-- Transfer 2 -->
        <div>
          <div class="transfer-item">
            <div class="transfer-dot active"></div>
            <span class="transfer-name">Wolf of Wall St.</span>
            <span class="transfer-pct">65%</span>
          </div>
          <div class="transfer-progress" style="margin-left:14px;">
            <div class="transfer-progress-track">
              <div class="transfer-progress-fill" style="width:65%;"></div>
            </div>
          </div>
        </div>

        <!-- Transfer 3 (done) -->
        <div>
          <div class="transfer-item">
            <div class="transfer-dot done"></div>
            <span class="transfer-name">Pose</span>
            <span class="transfer-pct done">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20,6 9,17 4,12"/></svg>
            </span>
          </div>
          <div class="transfer-progress" style="margin-left:14px;">
            <div class="transfer-progress-track">
              <div class="transfer-progress-fill done" style="width:100%;"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="transfers-app-label">
        <div class="transfers-app-icon">
          <svg viewBox="0 0 16 16" fill="#000">
            <rect x="3" y="3" width="3" height="10"/>
            <rect x="6" y="3" width="4" height="3"/>
            <rect x="10" y="3" width="3" height="6"/>
            <rect x="6" y="6" width="4" height="3"/>
          </svg>
        </div>
        <span class="transfers-app-name">put.io</span>
      </div>
    </div>
  </div>

  <!-- ==========================================
       FACE 4: Now Playing (Audio)
       ========================================== -->
  <div class="watch-face">
    <!-- Edge progress arc -->
    <div class="np-edge-arc">
      <svg viewBox="0 0 198 242" fill="none">
        <!-- Background arc (follows the rounded rect bezel) -->
        <!-- Using a simplified approach: arc along the top and sides -->
        <rect x="3" y="3" width="192" height="236" rx="45" ry="45"
          fill="none" stroke="#1C1C1E" stroke-width="3"/>
        <!-- Progress fill: ~65% of the perimeter -->
        <rect x="3" y="3" width="192" height="236" rx="45" ry="45"
          fill="none" stroke="#FDCE45" stroke-width="3"
          stroke-dasharray="556 856"
          stroke-dashoffset="-214"
          stroke-linecap="round"/>
      </svg>
    </div>

    <div class="np-content">
      <div class="np-header">
        <div class="np-app-icon">
          <svg viewBox="0 0 16 16" fill="#000">
            <rect x="3" y="3" width="3" height="10"/>
            <rect x="6" y="3" width="4" height="3"/>
            <rect x="10" y="3" width="3" height="6"/>
            <rect x="6" y="6" width="4" height="3"/>
          </svg>
        </div>
        <span class="np-app-name">put.io</span>
      </div>

      <div class="np-artwork">
        <!-- Podcast / audio icon -->
        <svg viewBox="0 0 24 24" fill="none" stroke="var(--yellow)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.5">
          <path d="M3,18V12a9,9,0,0,1,18,0v6"/>
          <path d="M21,19a2,2,0,0,1-2,2H18a2,2,0,0,1-2-2V16a2,2,0,0,1,2-2h3Z"/>
          <path d="M3,19a2,2,0,0,0,2,2H6a2,2,0,0,0,2-2V16a2,2,0,0,0-2-2H3Z"/>
        </svg>
      </div>

      <div class="np-track">Episode 127</div>
      <div class="np-source">Tech's Message</div>

      <div class="np-controls">
        <!-- Skip back -->
        <div class="np-btn skip">
          <svg viewBox="0 0 24 24"><path d="M11 18V6l-8.5 6 8.5 6zm.5-6l8.5 6V6l-8.5 6z"/></svg>
        </div>
        <!-- Play/Pause -->
        <div class="np-btn play">
          <svg viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </div>
        <!-- Skip forward -->
        <div class="np-btn skip">
          <svg viewBox="0 0 24 24"><path d="M4 18l8.5-6L4 6v12zm9-12v12l8.5-6L13 6z"/></svg>
        </div>
      </div>

      <div class="np-time">42:18</div>
    </div>
  </div>

</div>
</body>
</html>
