<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#323232">
<title>put.io design exploration</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #09090B; --bg-2: #111113; --bg-3: #19191B; --bg-4: #222225;
    --line: #27272A; --border: #3F3F46; --solid: #71717A;
    --text-2: #A1A1AA; --text: #FAFAFA;
    --yellow: #FDCE45;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.5; }

  .container { max-width: 960px; margin: 0 auto; padding: 64px 24px; }

  /* Hero */
  .hero { margin-bottom: 48px; }
  .hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
  .hero h1 span { color: var(--yellow); }
  .hero p { font-size: 15px; color: var(--text-2); max-width: 520px; line-height: 1.6; margin-bottom: 20px; }
  .stats { display: flex; gap: 24px; }
  .stat { font-family: 'JetBrains Mono', monospace; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--yellow); }
  .stat-label { font-size: 11px; color: var(--solid); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Filters */
  .filters {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: 12px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 16px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .filter-row { display: flex; gap: 6px; align-items: center; }
  .filter-group { display: flex; gap: 2px; align-items: center; }
  .filter-label { font-size: 10px; color: var(--solid); text-transform: uppercase; letter-spacing: 0.06em; margin-right: 6px; font-weight: 600; flex-shrink: 0; width: 60px; }
  .nav-btn {
    background: none; border: none; border-radius: 4px;
    padding: 3px 8px; font-size: 11px; color: var(--solid);
    cursor: pointer; font-family: inherit; transition: all 0.1s;
    white-space: nowrap; flex-shrink: 0;
  }
  .nav-btn:hover { color: var(--text-2); background: var(--bg-3); }
  .nav-btn.active { color: var(--bg); background: var(--yellow); font-weight: 600; }

  /* Results count */
  .results-count { font-size: 11px; color: var(--solid); margin-bottom: 12px; font-family: 'JetBrains Mono', monospace; }

  /* List layout */
  .list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .list:empty { display: none; }

  .list-group-header {
    padding: 6px 14px; font-size: 10px; font-weight: 600; color: var(--solid);
    text-transform: uppercase; letter-spacing: 0.06em; background: var(--bg-3);
  }

  .item {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 14px; background: var(--bg-2);
    text-decoration: none; color: inherit; transition: background 0.1s;
  }
  .item:hover { background: var(--bg-3); }

  .item-icon {
    width: 24px; height: 24px; border-radius: 5px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600;
  }
  .item-icon.web { background: rgba(59,130,246,0.12); color: #60A5FA; }
  .item-icon.ios { background: rgba(52,211,153,0.12); color: #34D399; }
  .item-icon.android { background: rgba(163,230,53,0.12); color: #A3E635; }
  .item-icon.tv, .item-icon.tvos, .item-icon.androidtv, .item-icon.webtv, .item-icon.roku { background: rgba(244,114,182,0.12); color: #F472B6; }
  .item-icon.watch { background: rgba(253,206,69,0.12); color: var(--yellow); }
  .item-icon.extension { background: rgba(251,146,60,0.12); color: #FB923C; }
  .item-icon.spatial { background: rgba(147,130,220,0.12); color: #9382DC; }
  .item-icon.cli { background: rgba(163,163,163,0.12); color: #A3A3A3; }
  .item-icon.desktop { background: rgba(96,165,250,0.12); color: #60A5FA; }
  .item-icon.marketing { background: rgba(139,92,246,0.12); color: #A78BFA; }

  .item-info { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }
  .item-name { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 10px; color: var(--solid); display: flex; gap: 4px; align-items: center; flex-shrink: 0; }

  .tag {
    font-size: 9px; padding: 1px 5px; border-radius: 3px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
  }
  .tag.clean { background: rgba(59,130,246,0.1); color: #60A5FA; }
  .tag.mono { background: rgba(139,92,246,0.1); color: #A78BFA; }
  .tag.editorial { background: rgba(244,114,182,0.1); color: #F472B6; }
  .tag.v3 { background: rgba(251,146,60,0.1); color: #FB923C; }
  .tag.light { background: rgba(250,250,250,0.08); color: #D4D4D8; }
  .tag.geometric { background: rgba(56,189,248,0.1); color: #38BDF8; }
  .tag.retro { background: rgba(253,186,116,0.1); color: #FDBA74; }
  .tag.ink { background: rgba(163,163,163,0.1); color: #A3A3A3; }
  .tag.neubr { background: rgba(255,107,157,0.1); color: #FF6B9D; }
  .tag.glass { background: rgba(147,130,220,0.1); color: #9382DC; }
  .tag.swiss { background: rgba(239,68,68,0.1); color: #EF4444; }
  .tag.scandi { background: rgba(217,199,175,0.1); color: #D9C7AF; }
  .tag.kinetic { background: rgba(34,211,238,0.1); color: #22D3EE; }
  .tag.duotone { background: rgba(253,206,69,0.1); color: var(--yellow); }
  .tag.wire { background: rgba(200,200,200,0.08); color: #C8C8C8; }
  .tag.mesh { background: rgba(244,114,182,0.1); color: #F472B6; }
  .tag.dense { background: rgba(34,197,94,0.1); color: #22C55E; }
  .tag.claude { background: rgba(245, 158, 11, 0.14); color: #FCD34D; }
  .tag.codex { background: rgba(16, 185, 129, 0.14); color: #6EE7B7; }
  .tag.uidotsh { background: rgba(99, 102, 241, 0.14); color: #A5B4FC; }
  .tag.linear { background: rgba(253, 206, 69, 0.1); color: var(--yellow); }

  .item-arrow { color: var(--border); font-size: 12px; flex-shrink: 0; transition: color 0.1s; }
  .item:hover .item-arrow { color: var(--yellow); }

  .footer { text-align: center; padding: 48px 0; font-size: 12px; color: var(--solid); margin-top: 48px; }
  .footer a { color: var(--yellow); text-decoration: none; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
    z-index: 100; align-items: center; justify-content: center; padding: 32px;
    backdrop-filter: blur(12px); flex-direction: column; gap: 16px;
  }
  .modal-overlay.open { display: flex; }

  .modal-header {
    display: flex; align-items: center; gap: 12px;
    flex-shrink: 0; width: 100%; max-width: 1480px;
  }
  .modal-title { font-size: 13px; font-weight: 500; flex: 1; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modal-btn {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); border-radius: 5px;
    padding: 4px 10px; font-size: 11px; color: var(--text-2); cursor: pointer;
    font-family: inherit; transition: all 0.15s; text-decoration: none;
  }
  .modal-btn:hover { background: rgba(255,255,255,0.15); color: var(--text); }
  .modal-close {
    background: none; border: none; color: var(--solid); font-size: 20px;
    cursor: pointer; padding: 4px 8px; border-radius: 4px; line-height: 1;
  }
  .modal-close:hover { color: var(--text); }

  /* Frame: sized to fit viewport, iframe scaled inside */
  .modal-frame {
    position: relative;
    overflow: hidden;
    background: #000;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .modal-frame.ready { opacity: 1; }
  .modal-frame iframe {
    border: none; display: block; background: #09090B;
    scrollbar-width: none;
  }
  .modal-frame iframe::-webkit-scrollbar { display: none; }

  /* Web */
  .modal-frame.frame-web {
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-web iframe { width: 1440px; height: 900px; }

  /* iOS */
  .modal-frame.frame-mobile {
    border-radius: 44px; border: 6px solid #2A2A2E;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .modal-frame.frame-mobile iframe { width: 390px; height: 844px; }

  /* Android */
  .modal-frame.frame-android {
    border-radius: 28px; border: 5px solid #2A2A2E;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
  }
  .modal-frame.frame-android iframe { width: 412px; height: 915px; }

  /* TV */
  .modal-frame.frame-tv {
    border-radius: 4px; border: 10px solid #1A1A1A;
    box-shadow: 0 32px 100px rgba(0,0,0,0.6);
  }
  .modal-frame.frame-tv iframe { width: 1920px; height: 1080px; }

  /* Watch */
  .modal-frame.frame-watch {
    border-radius: 16px; border: 4px solid #2A2A2E;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-watch iframe { width: 900px; height: 500px; }

  /* Browser Extension popup */
  .modal-frame.frame-extension {
    border-radius: 12px; border: 1px solid rgba(255,255,255,0.12);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-extension iframe { width: 400px; height: 600px; }

  /* Wear OS round watch */
  .modal-frame.frame-wearos {
    border-radius: 16px; border: 4px solid #2A2A2E;
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-wearos iframe { width: 920px; height: 280px; }

  /* Desktop */
  .modal-frame.frame-desktop {
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-desktop iframe { width: 1280px; height: 800px; }

  /* Other (visionOS) */
  .modal-frame.frame-other {
    border-radius: 10px; border: 1px solid rgba(255,255,255,0.08);
    box-shadow: 0 24px 80px rgba(0,0,0,0.5);
  }
  .modal-frame.frame-other iframe { width: 1200px; height: 800px; }
</style>
</head>

<div class="container">
  <div class="hero">
    <h1>put<span>.</span>io design exploration</h1>
    <p>Every screen is self-contained HTML. Click to preview in device frame.</p>
    <div class="stats">

      <div class="stat"><div class="stat-value">15</div><div class="stat-label">Platforms</div></div>
      <div class="stat"><div class="stat-value">16</div><div class="stat-label">Variants</div></div>
    </div>
  </div>

  <div class="filters">
    <div class="filter-row">
      <span class="filter-label">Platform</span>
      <div class="filter-group">
        <button class="nav-btn active" data-group="platform" data-filter="all">All</button>
        <button class="nav-btn" data-group="platform" data-filter="web">Web</button>
        <button class="nav-btn" data-group="platform" data-filter="ios">iOS</button>

        <button class="nav-btn" data-group="platform" data-filter="roku">Roku</button>
        <button class="nav-btn" data-group="platform" data-filter="desktop">Desktop</button>
        <button class="nav-btn" data-group="platform" data-filter="watch">Watch</button>
        <button class="nav-btn" data-group="platform" data-filter="extension">Extension</button>
        <button class="nav-btn" data-group="platform" data-filter="marketing">Facade</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Style</span>
      <div class="filter-group">
        <button class="nav-btn active" data-group="variant" data-filter="all">All</button>
        <button class="nav-btn" data-group="variant" data-filter="clean">Clean</button>
        <button class="nav-btn" data-group="variant" data-filter="mono">Mono</button>
        <button class="nav-btn" data-group="variant" data-filter="retro">Retro</button>
        <button class="nav-btn" data-group="variant" data-filter="ink">Ink</button>
        <button class="nav-btn" data-group="variant" data-filter="glass">Glass</button>
        <button class="nav-btn" data-group="variant" data-filter="swiss">Swiss</button>
        <button class="nav-btn" data-group="variant" data-filter="scandi">Scandi</button>
        <button class="nav-btn" data-group="variant" data-filter="linear">Linear</button>
      </div>
    </div>
    <div class="filter-row">
      <span class="filter-label">Generator</span>
      <div class="filter-group">
        <button class="nav-btn active" data-group="author" data-filter="all">All</button>
        <button class="nav-btn" data-group="author" data-filter="claude/opus-4.6">claude/opus-4.6</button>
        <button class="nav-btn" data-group="author" data-filter="cursor/opus-4.6/ui-sh">cursor/opus-4.6/ui-sh</button>
      </div>
    </div>
  </div>

  <div class="results-count" id="results-count"></div>
  <div class="list" id="list"></div>

  <div class="modal-overlay" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modal-title"></span>
      <a class="modal-btn" id="modal-newtab" href="#" target="_blank">Open in new tab</a>
      <button class="modal-close" id="modal-close">&times;</button>
    </div>
    <div class="modal-frame" id="modal-frame">
      <iframe id="modal-iframe"></iframe>
    </div>
  </div>

  <div class="footer">
    put.io · istanbul · since 2011 · <a href="https://github.com/putdotio/putio-design">source</a> · ᕦ(ò_óˇ)ᕤ
  </div>
</div>

  'web-storage-v14-linear-neutral.html': 'cursor/opus-4.6/ui-sh',
  'web-transfers-v14-linear-neutral-cards.html': 'cursor/opus-4.6/ui-sh',
  'web-transfers-v14-linear-neutral-compact.html': 'cursor/opus-4.6/ui-sh',
  'web-transfers-v14-linear-neutral-table.html': 'cursor/opus-4.6/ui-sh',
  'web-transfers-v14-swiss.html': 'cursor/opus-4.6/ui-sh',
};

function getCategory(n) {
  if (n.startsWith('watchos-') || n.startsWith('wearos-')) return 'watch';
  if (n.startsWith('desktop-')) return 'desktop';
  if (n.startsWith('visionos-')) return 'spatial';
  if (n.startsWith('cli-') || n === 'cli-app.html') return 'cli';
  if (n.includes('browser-extension') || n.includes('extension')) return 'extension';
  if (n.startsWith('landing-') || n.startsWith('about-') || n.startsWith('legal-')) return 'marketing';
  if (n.startsWith('ios-')) return 'ios';
  if (n.startsWith('android-') && !n.startsWith('androidtv-')) return 'android';
  if (n.startsWith('tvos-')) return 'tvos';
  if (n.startsWith('androidtv-')) return 'androidtv';
  if (n.startsWith('webtv-')) return 'webtv';
  if (n.startsWith('roku-')) return 'roku';
  if (n.startsWith('web-') || n === 'tokens.html' || n === 'components-web.html') return 'web';
  return 'web';
}

function getVariant(n) {
  if (n.includes('v12-linear-neutral') || n.includes('-linear-neutral')) return 'linear';
  if (n.includes('v16-dense') || n.includes('-dense')) return 'dense';
  if (n.includes('v15-mesh') || n.includes('-mesh')) return 'mesh';
  if (n.includes('v14-wire') || n.includes('-wire')) return 'wire';
  if (n.includes('v13-duotone') || n.includes('-duotone')) return 'duotone';
  if (n.includes('v12-kinetic') || n.includes('-kinetic')) return 'kinetic';
  if (n.includes('v11-scandi') || n.includes('-scandi')) return 'scandi';
  if (n.includes('v10-swiss') || n.includes('-swiss')) return 'swiss';
  if (n.includes('v9-glass') || n.includes('-glass')) return 'glass';
  if (n.includes('v8-neubr') || n.includes('-neubr')) return 'neubr';
  if (n.includes('v5-geometric') || n.includes('-geometric')) return 'geometric';
  if (n.includes('v6-retro') || n.includes('-retro')) return 'retro';
  if (n.includes('v7-ink') || n.includes('-ink')) return 'ink';
  if (n.includes('-editorial')) return 'editorial';
  if (n.includes('-mono')) return 'mono';
  if (n.includes('-clean') || n.includes('v2-clean')) return 'clean';
  // Platform-native styles → clean (native is not a separate design style)
  if (n.includes('native') || n.includes('m3-v3') || n.includes('tvos26') || n.includes('googletv') || n.includes('-ios26') || n.includes('-m3.') || n.includes('sequoia') || n.includes('windows11') || n.includes('watchos11') || n.includes('persona')) return 'clean';
  if (n.startsWith('webtv-') || n.startsWith('landing-starry')) return 'clean';
  return '';
}

function getScreen(n) {
  const s = n.replace('.html','');
  // Match screen names across all platforms (order matters — specific before general)
  if (s.includes('audio-player') || s.includes('now-playing')) return 'Audio Player';
  if (s.includes('up-next')) return 'Up Next';
  if (s.includes('share-with-mom')) return 'Share with Mom';
  if (s.includes('share-extension')) return 'Share Extension';
  if (s.includes('sharing-redesign')) return 'Sharing';
  if (s.includes('cross-platform')) return 'Cross-Platform';
  if (s.includes('empty-states')) return 'Empty States';
  if (s.includes('feature-discovery')) return 'Feature Discovery';
  if (s.includes('command-palette') || s.includes('command')) return 'Command Palette';
  if (s.includes('browser-extension')) return 'Browser Extension';
  if (s.includes('link-device')) return 'Link Device';
  if (s.includes('plan-change')) return 'Plan Change';
  if (s.includes('mobile-files')) return 'Mobile Web';
  if (s.includes('storage-dashboard')) return 'Storage Dashboard';
  if (s.includes('security-dashboard')) return 'Security Dashboard';
  if (s.includes('legal-privacy')) return 'Privacy Policy';
  if (s.includes('legal-terms')) return 'Terms';
  if (s.includes('files-light')) return 'Files (Light)';
  if (s.includes('files-grid') || s.includes('-grid')) return 'Files (Grid)';
  if (s.includes('tabbed')) return 'Files (Tabbed)';
  if (s.includes('nested')) return 'Files (Tree)';
  if (s.includes('split')) return 'Files (Split)';
  if (s.includes('column')) return 'Files (Column)';
  if (s.includes('telegram')) return 'Files (Telegram)';
  if (s.includes('menubar')) return 'Menu Bar';
  if (s.includes('changelog') || s.includes('whats-new')) return 'Changelog';
  if (s.includes('player-light')) return 'Player (Light)';
  if (s.includes('transfers-light')) return 'Transfers (Light)';
  if (s.includes('auth')) return 'Auth';
  if (s.includes('resume')) return 'Resume Prompt';
  if (s.includes('subtitles')) return 'Subtitle Picker';
  if (s.includes('conversion')) return 'Conversion';
  if (s.includes('diagnostics')) return 'Diagnostics';
  if (s.includes('error')) return 'Error States';
  if (s.includes('trash')) return 'Trash';
  if (s.includes('files') || s.includes('filebrowser')) return 'Files';
  if (s.includes('transfers')) return 'Transfers';
  if (s.includes('player')) return 'Player';
  if (s.includes('storage')) return 'Storage';
  if (s.includes('settings')) return 'Settings';
  if (s.includes('history')) return 'History';
  if (s.includes('sharing')) return 'Sharing';
  if (s.includes('pricing')) return 'Pricing';
  if (s.includes('home')) return 'Home';
  if (s.includes('search')) return 'Search';
  if (s.includes('browse')) return 'Browse';
  if (s.includes('landing') || s.includes('starry')) return 'Landing';
  if (s.includes('about')) return 'About';
  if (s.includes('onboarding')) return 'Onboarding';
  if (s.includes('downloads')) return 'Downloads';
  if (s.includes('widgets')) return 'Widgets';
  if (s.includes('login')) return 'Login';
  if (s.includes('signup')) return 'Sign Up';
  if (s.includes('2fa')) return '2FA';
  if (s.includes('rss')) return 'RSS';
  if (s.includes('security')) return 'Security';
  if (s.includes('family')) return 'Family';
  if (s.includes('notification')) return 'Notifications';
  if (s.includes('ipad')) return 'iPad';
  if (s.includes('watchos')) return 'watchOS';
  if (s.includes('wearos')) return 'Wear OS';
  if (s.includes('sequoia') || s.includes('windows11')) return 'Files';
  return s;
}

function getPlatform(n) {
  if (n.startsWith('desktop-')) return n.includes('macos') ? 'macOS' : n.includes('windows') ? 'Windows' : 'Linux';
  if (n.includes('browser-extension') || n.includes('extension')) return 'Extension';
  if (n.startsWith('watchos-') || n.startsWith('wearos-')) return 'Watch';
  if (n.startsWith('visionos-')) return 'visionOS';
  if (n.startsWith('cli-')) return 'CLI';
  if (n.startsWith('ios-')) return 'iOS';
  if (n.startsWith('androidtv-')) return 'Android TV';
  if (n.startsWith('android-')) return 'Android';
  if (n.startsWith('tvos-')) return 'tvOS';
  if (n.startsWith('roku-')) return 'Roku';
  if (n.startsWith('webtv-')) return 'Smart TV';
  if (n.startsWith('landing-')) return 'Landing';
  if (n.startsWith('legal-')) return 'Legal';
  if (n.startsWith('about-')) return 'About';
  return 'Web';
}

function getTags(n) {
  const tags = [];
  const v = getVariant(n);
  if (v) tags.push({ label: v.charAt(0).toUpperCase() + v.slice(1), cls: v });
  if (n.includes('v3') || n.includes('-v2.html')) tags.push({ label: n.includes('v3') ? 'v3' : 'v2', cls: 'v3' });
  if (n.includes('light')) tags.push({ label: 'Light', cls: 'light' });
  const author = authorTagByFile[n] || 'claude/opus-4.6';
  const authorCls = author.includes('cursor') ? 'uidotsh' : 'claude';
  tags.push({ label: author, cls: authorCls });
  return tags;
}

function getIconLetter(cat) {
  const m = { web: 'W', ios: 'i', android: 'A', tvos: 'T', androidtv: 'T', webtv: 'T', roku: 'T', desktop: 'D', watch: '⌚', extension: 'E', spatial: 'S', cli: '>', marketing: 'M' };
  return m[cat] || '·';
}

let activePlatform = 'all';
let activeVariant = 'all';
let activeAuthor = 'all';

function render() {
  const filtered = files.filter(f => {
    const cat = getCategory(f);
    const variant = getVariant(f);
    const author = authorTagByFile[f] || 'claude/opus-4.6';

    const matchPlatform = activePlatform === 'all'
      || cat === activePlatform;
    const matchVariant = activeVariant === 'all'
      || variant === activeVariant
      || (activeVariant === 'v3' && f.includes('v3'))
      || (activeVariant === 'v1' && f.includes('-v1'));
    const matchAuthor = activeAuthor === 'all'
      || author === activeAuthor;

    return matchPlatform && matchVariant && matchAuthor;
  });

  document.getElementById('results-count').textContent = filtered.length + ' screens';

  // Group by screen type
  const groups = {};
  filtered.forEach(f => {
    const screen = getScreen(f);
    if (!groups[screen]) groups[screen] = [];
    groups[screen].push(f);
  });

  const list = document.getElementById('list');
  let html = '';
  for (const [group, items] of Object.entries(groups)) {
    if (Object.keys(groups).length > 1) {
      html += `<div class="list-group-header">${group}</div>`;
    }
    items.forEach(f => {
      const cat = getCategory(f);
      const platform = getPlatform(f);
      const tags = getTags(f);
      const tagHtml = tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('');
      html += `<a class="item" href="#" data-file="${f}" onclick="openModal('${f}');return false;">
        <div class="item-icon ${cat}">${getIconLetter(cat)}</div>
        <div class="item-info">
          <div class="item-name">${getScreen(f)} — ${platform}</div>
          <div class="item-meta">${tagHtml}<span>${f.replace('.html','')}</span></div>
        </div>
        <span class="item-arrow">→</span>
      </a>`;
    });
  }
  list.innerHTML = html;
}

document.querySelectorAll('.filter-group').forEach(group => {
  group.addEventListener('click', e => {
    const btn = e.target.closest('.nav-btn');
    if (!btn) return;
    group.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (btn.dataset.group === 'platform') activePlatform = btn.dataset.filter;
    if (btn.dataset.group === 'variant') activeVariant = btn.dataset.filter;
    if (btn.dataset.group === 'author') activeAuthor = btn.dataset.filter;
    render();
  });
});

render();

// Modal
let currentFile = null;
let currentList = [];

function getFrameType(file) {
  if (file.includes('browser-extension')) return 'extension';
  if (file.startsWith('wearos-')) return 'wearos';
  if (file.startsWith('watchos-')) return 'watch';
  if (file.startsWith('ios-')) return 'mobile';
  if (file.startsWith('android-') && !file.startsWith('androidtv-')) return 'android';
  if (file.startsWith('tvos-') || file.startsWith('androidtv-') || file.startsWith('webtv-')) return 'tv';
  if (file.startsWith('roku-')) return 'tv';
  if (file.startsWith('desktop-')) return 'desktop';
  if (file.startsWith('visionos-') || file.startsWith('cli-')) return 'other';
  return 'web';
}

function scaleFrame() {
  const frame = document.getElementById('modal-frame');
  const iframe = document.getElementById('modal-iframe');
  const iw = iframe.offsetWidth;
  const ih = iframe.offsetHeight;
  if (!iw || !ih) return;

  const pad = 80;
  const headerH = 48;
  const availW = window.innerWidth - pad * 2;
  const availH = window.innerHeight - pad - headerH;

  // Include border in calculations
  const style = getComputedStyle(frame);
  const bw = parseFloat(style.borderLeftWidth) + parseFloat(style.borderRightWidth);
  const bh = parseFloat(style.borderTopWidth) + parseFloat(style.borderBottomWidth);

  let maxScale = 1;
  if (frame.classList.contains('frame-mobile') || frame.classList.contains('frame-android')) maxScale = 0.85;
  if (frame.classList.contains('frame-extension')) maxScale = 0.85;
  if (frame.classList.contains('frame-watch') || frame.classList.contains('frame-wearos')) maxScale = 0.9;
  const scale = Math.min(availW / (iw + bw), availH / (ih + bh), maxScale);

  // Scale iframe inside the frame, size frame to match
  iframe.style.transform = `scale(${scale})`;
  iframe.style.transformOrigin = '0 0';
  frame.style.width = (iw * scale) + 'px';
  frame.style.height = (ih * scale) + 'px';
}

function openModal(file) {
  const modal = document.getElementById('modal');
  const frame = document.getElementById('modal-frame');
  const iframe = document.getElementById('modal-iframe');
  const title = document.getElementById('modal-title');
  const newtab = document.getElementById('modal-newtab');

  currentFile = file;
  // Build current visible list for arrow nav
  currentList = Array.from(document.querySelectorAll('.item[data-file]')).map(el => el.dataset.file);

  title.textContent = file.replace('.html','').replace(/-/g, ' ');
  newtab.href = file;

  // Set frame type
  frame.className = 'modal-frame';
  const type = getFrameType(file);
  if (type === 'android') {
    frame.classList.add('frame-android');
  } else {
    frame.classList.add('frame-' + type);
  }

  frame.classList.remove('ready');
  modal.classList.add('open');
  document.body.style.overflow = 'hidden';

  iframe.onload = () => {
    // Hide scrollbars inside iframe
    try {
      const doc = iframe.contentDocument;
      const style = doc.createElement('style');
      style.textContent = '::-webkit-scrollbar{display:none}html{scrollbar-width:none}';
      doc.head.appendChild(style);
    } catch(e) {}
    scaleFrame();
    frame.classList.add('ready');
  };
  iframe.src = file;
}

function closeModal() {
  const modal = document.getElementById('modal');
  const iframe = document.getElementById('modal-iframe');
  document.getElementById('modal-frame').classList.remove('ready');
  iframe.onload = null;
  iframe.src = '';
  modal.classList.remove('open');
  document.body.style.overflow = '';
  currentFile = null;
}

function navigateModal(dir) {
  if (!currentFile || !currentList.length) return;
  const idx = currentList.indexOf(currentFile);
  if (idx === -1) return;
  const next = idx + dir;
  if (next < 0 || next >= currentList.length) return;
  openModal(currentList[next]);
}

document.getElementById('modal-close').addEventListener('click', closeModal);

document.getElementById('modal').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});

document.addEventListener('keydown', e => {
  if (!document.getElementById('modal').classList.contains('open')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowRight') { e.preventDefault(); navigateModal(1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); navigateModal(-1); }
  // Up/down scroll the iframe content
  if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
    e.preventDefault();
    try {
      const iframe = document.getElementById('modal-iframe');
      const amount = e.key === 'ArrowDown' ? 120 : -120;
      iframe.contentWindow.scrollBy({ top: amount, behavior: 'smooth' });
    } catch(err) {}
  }
});

window.addEventListener('resize', () => {
  if (currentFile) scaleFrame();
});
</script>
