<style>

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #000000;
    --surface: #111113;
    --surface-2: #1C1C1E;
    --border: rgba(255,255,255,0.08);
    --border-subtle: rgba(255,255,255,0.05);
    --text: #FAFAFA;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --green: #30D158;
    --red: #FF453A;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }

  .auth-frame {
    width: 1920px;
    height: 1080px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* ── Logo ── */
  .logo {
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -0.03em;
    margin-bottom: 56px;
  }
  .logo span { color: var(--yellow); }

  /* ── Kaomoji ── */
  .kaomoji {
    font-size: 48px;
    font-weight: 400;
    color: var(--text-2);
    margin-bottom: 56px;
    font-family: 'Inter', monospace;
    letter-spacing: 0.02em;
  }

  /* ── Instruction ── */
  .instruction {
    font-size: 24px;
    font-weight: 400;
    color: var(--text-2);
    margin-bottom: 12px;
    letter-spacing: -0.01em;
  }
  .instruction-link {
    font-size: 36px;
    font-weight: 700;
    color: var(--yellow);
    letter-spacing: -0.02em;
    margin-bottom: 64px;
  }

  /* ── Code Boxes ── */
  .code-row {
    display: flex;
    gap: 16px;
    margin-bottom: 48px;
  }
  .code-box {
    width: 80px;
    height: 96px;
    background: var(--surface-2);
    border: 2px solid var(--border);
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 44px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0;
    transition: all 0.2s;
  }
  .code-box.filled {
    border-color: rgba(255,255,255,0.15);
    background: var(--surface);
  }

  /* ── Expiry ── */
  .expiry {
    font-size: 18px;

  }

  /* ── Subtle glow behind code ── */
  .code-glow {
    position: relative;
  }
  .code-glow::before {
    content: '';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 640px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(253,206,69,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  .code-row {
    position: relative;
    z-index: 1;
  }
