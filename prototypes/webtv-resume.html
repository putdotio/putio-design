<title>put.io — Web TV Resume Playback</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #131315; --bg-3: #1A1A1E; --bg-4: #26262C;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --green: #30A46C; --blue: #3B82F6; --red: #FF6369;
    --badge-bg: rgba(255,255,255,0.08);
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .tv-frame {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
  }

  /* Cinematic background */
  .video-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0a0a1a 0%, #141428 40%, #0a0a1a 100%);
  }

  /* Semi-transparent overlay */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0, 0, 0, 0.5);
  }

  /* Centered content */
  .prompt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    z-index: 10;
  }

  .prompt-content {
    width: 550px;
    text-align: center;
  }

  /* Title */
  .title {
    font-size: 36px; font-weight: 600; color: #fff;
    line-height: 1.2;
  }

  /* Badges row */
  .badges {
    display: flex; align-items: center; justify-content: center;
    gap: 9px;
    margin-top: 10px;
  }

  .badge {
    font-size: 14px; font-weight: 600;
    text-transform: uppercase;
    background: var(--badge-bg);
    color: var(--text-2);
    padding: 4px 12px; border-radius: 6px;
    line-height: 1.4;
  }

  /* File info */
  .file-info {
    font-size: 18px; color: var(--text-2);
    margin-top: 8px;
  }

  /* Progress bar section */
  .progress-section {
    margin-top: 32px;
  }

  .progress-track {
    width: 100%; height: 6px;
    background: rgba(255, 255, 255, 0.15);
    border-radius: 3px;
    overflow: hidden;
  }

  .progress-fill {
    width: 82%; height: 100%;
    background: var(--yellow);
    border-radius: 3px;
  }

  .progress-times {
    display: flex; justify-content: space-between;
    margin-top: 8px;
  }

  .time-current {
    font-size: 16px; font-weight: 500; color: var(--yellow);
  }

  .time-total {
    font-size: 16px; font-weight: 500; color: var(--text-2);
  }

  /* Buttons */
  .buttons {
    margin-top: 36px;
    display: flex; flex-direction: column; gap: 12px;
  }

  .btn {
    width: 100%; padding: 20px;
    border-radius: 12px;
    font-family: inherit;
    font-size: 22px;
    text-align: center;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
  }

  .btn-continue {
    font-weight: 600; color: var(--text);
    background: rgba(255, 255, 255, 0.06);
    border: 2px solid var(--yellow);
  }

  .btn-continue .play-icon {
    width: 18px; height: 18px;
    flex-shrink: 0;
  }

  .btn-start-over {
    font-weight: 500; color: var(--text-2);
    background: transparent;
    border: 2px solid rgba(255, 255, 255, 0.1);
  }
</style>

<div class="tv-frame">

  <!-- Cinematic background simulating poster/screenshot -->
  <div class="video-bg"></div>

  <!-- Dark overlay -->
  <div class="overlay"></div>

  <!-- Resume prompt -->
  <div class="prompt">
    <div class="prompt-content">

      <!-- Title + badges -->
      <h1 class="title">The Wire</h1>
      <div class="badges">
        <span class="badge">S3 · E4</span>
        <span class="badge">1080p</span>
        <span class="badge">MKV</span>
      </div>
      <div class="file-info">1.8 GB · 51 min</div>

      <!-- Progress bar -->
      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill"></div>
        </div>
        <div class="progress-times">
          <span class="time-current">42:17</span>
          <span class="time-total">51:00</span>
        </div>
      </div>

      <!-- Action buttons -->
      <div class="buttons">
        <button class="btn btn-continue">
          <svg class="play-icon" viewBox="0 0 18 18" fill="none">
            <path d="M4 2.5v13l11.5-6.5L4 2.5z" fill="currentColor"/>
          </svg>
          Continue playing from 42:17

        <button class="btn btn-start-over">Start from the beginning</button>
      </div>

    </div>
  </div>

</div>
