<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io -- tvOS Player (v13 Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #0A0A0C;
    --surface: rgba(255,255,255,0.05);
    --text: #F5F5F5;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --text-4: #4A4A52;
    --yellow: #FDCE45;
  }

  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
  }

  .player-frame {
    width: 1920px;
    height: 1080px;
    position: relative;
    background: var(--bg);
  }

  /* ── Video Placeholder ── */
  .video-bg {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-bg-text {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-4);
    opacity: 0.3;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  /* ── Gradient Overlays ── */
  .gradient-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 240px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0.35) 50%, transparent 100%);
    z-index: 2;
  }
  .gradient-bottom {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 360px;
    background: linear-gradient(to top, rgba(0,0,0,0.88) 0%, rgba(0,0,0,0.45) 50%, transparent 100%);
    z-index: 2;
  }

  /* ── Top Info ── */
  .top-info {
    position: absolute;
    top: 48px;
    left: 88px;
    right: 88px;
    z-index: 3;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
  }
  .top-filename {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
    max-width: 1400px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .top-size {
    font-size: 18px;
    font-weight: 400;
    color: var(--text-3);
    flex-shrink: 0;
    margin-left: 32px;
  }

  /* ── Center Controls ── */
  .center-controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 64px;
  }
  .ctrl-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    cursor: pointer;
    transition: all 0.2s;
  }
  .ctrl-skip {
    width: 48px;
    height: 48px;
    opacity: 0.6;
  }
  .ctrl-skip:hover { opacity: 1; }
  .ctrl-play {
    width: 80px;
    height: 80px;
    background: rgba(44, 44, 48, 0.6);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.12);
  }
  .ctrl-play:hover {
    background: rgba(255,255,255,0.15);
    transform: scale(1.05);
  }
  .ctrl-play.focused {
    background: rgba(253,206,69,0.12);
    border-color: rgba(253,206,69,0.3);
    transform: scale(1.05);
  }

  /* ── Bottom Controls ── */
  .bottom-controls {
    position: absolute;
    bottom: 48px;
    left: 88px;
    right: 88px;
    z-index: 3;
  }

  /* ── Scrubber ── */
  .scrubber-row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 28px;
  }
  .time {
    font-size: 20px;
    font-weight: 500;
    color: var(--text-2);
    min-width: 72px;
    font-variant-numeric: tabular-nums;
  }
  .time.end { text-align: right; }
  .scrubber {
    flex: 1;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
    position: relative;
    cursor: pointer;
  }
  .scrubber-fill {
    height: 100%;
    background: var(--yellow);
    border-radius: 2px;
    position: relative;
  }
  .scrubber-dot {
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 16px;
    height: 16px;
    background: var(--yellow);
    border-radius: 50%;
    box-shadow: 0 0 16px rgba(253,206,69,0.4);
  }

  /* ── Controls Pill ── */
  .controls-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 6px 8px;
    background: rgba(44, 44, 48, 0.6);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border: 0.5px solid rgba(255, 255, 255, 0.1);
    border-radius: 20px;
    width: fit-content;
  }
  .control-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .control-item:hover {
    background: rgba(255,255,255,0.06);
  }
  .control-item.focused {
    background: rgba(255,255,255,0.1);
  }
  .control-item.focused .control-label {
    color: var(--yellow);
  }
  .control-item.focused .control-icon svg {
    stroke: var(--yellow);
  }
  .control-icon {
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .control-label {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-2);
    transition: color 0.15s;
    white-space: nowrap;
  }

  /* ── Up Next Sheet ── */
  .up-next {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 32px 88px 48px;
    background: rgba(44, 44, 48, 0.7);
    backdrop-filter: blur(40px) saturate(180%);
    -webkit-backdrop-filter: blur(40px) saturate(180%);
    border-top: 0.5px solid rgba(255, 255, 255, 0.1);
    display: none;
  }
  .up-next.visible { display: block; }
  .up-next-header {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-3);
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 16px;
  }
  .up-next-row {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  .up-next-name {
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .up-next-toggle {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-3);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .toggle-track {
    width: 44px;
    height: 26px;
    background: rgba(253,206,69,0.3);
    border-radius: 13px;
    position: relative;
  }
  .toggle-dot {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 20px;
    height: 20px;
    background: var(--yellow);
    border-radius: 50%;
  }
</style>
</head>
<body>
<div class="player-frame">

  <!-- Video BG -->
  <div class="video-bg">
    <div class="video-bg-text">Video</div>
  </div>

  <!-- Gradients -->
  <div class="gradient-top"></div>
  <div class="gradient-bottom"></div>

  <!-- Top Info -->
  <div class="top-info">
    <div class="top-filename">The.Wire.S03E04.Back.Burners.1080p.BluRay.x264-DEMAND.mkv</div>
    <div class="top-size">1.2 GB</div>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back -->
    <div class="ctrl-btn ctrl-skip">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M24 8C15.16 8 8 15.16 8 24s7.16 16 16 16 16-7.16 16-16" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round"/>
        <text x="24" y="28" text-anchor="middle" fill="#F5F5F5" font-family="Inter" font-size="11" font-weight="600">10</text>
        <path d="M38 8v8h-8" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" transform="scale(-1,1) translate(-48,0)"/>
      </svg>
    </div>

    <!-- Play/Pause -->
    <div class="ctrl-btn ctrl-play focused">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none">
        <path d="M8 5v14l11-7L8 5z" fill="#F5F5F5"/>
      </svg>
    </div>

    <!-- Skip Forward -->
    <div class="ctrl-btn ctrl-skip">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M24 8c8.84 0 16 7.16 16 16s-7.16 16-16 16S8 32.84 8 24" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round"/>
        <text x="24" y="28" text-anchor="middle" fill="#F5F5F5" font-family="Inter" font-size="11" font-weight="600">10</text>
        <path d="M10 8v8h8" stroke="#F5F5F5" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">

    <!-- Scrubber -->
    <div class="scrubber-row">
      <div class="time">32:14</div>
      <div class="scrubber">
        <div class="scrubber-fill" style="width: 45%">
          <div class="scrubber-dot"></div>
        </div>
      </div>
      <div class="time end">1:11:46</div>
    </div>

    <!-- Controls Pill -->
    <div class="controls-pill">
      <div class="control-item focused">
        <div class="control-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="4" width="20" height="16" rx="2"/>
            <path d="M7 13h4M7 16h10M13 13h4"/>
          </svg>
        </div>
        <div class="control-label">Subtitles: English</div>
      </div>

      <div class="control-item">
        <div class="control-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/>
          </svg>
        </div>
        <div class="control-label">Audio: 5.1</div>
      </div>

      <div class="control-item">
        <div class="control-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A1A1AA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
          </svg>
        </div>
        <div class="control-label">Speed: 1x</div>
      </div>
    </div>

  </div>

  <!-- Up Next (shown near end of playback) -->
  <div class="up-next visible">
    <div class="up-next-header">Up Next</div>
    <div class="up-next-row">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="4" width="20" height="16" rx="2" stroke="#A1A1AA" stroke-width="1.5" fill="none"/>
        <path d="M2 8h20" stroke="#A1A1AA" stroke-width="1.5"/>
        <path d="M10 13l5 3-5 3v-6z" fill="#A1A1AA"/>
      </svg>
      <div class="up-next-name">The.Wire.S03E05.Straight.And.True.1080p.BluRay.x264-DEMAND.mkv</div>
      <div class="up-next-toggle">
        Autoplay
        <div class="toggle-track">
          <div class="toggle-dot"></div>
        </div>
      </div>
    </div>
  </div>

</div>
</body>
</html>
