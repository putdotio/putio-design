  .popup {

    overflow: hidden;
    background: var(--bg);

  /* CRT scanline overlay */
  .popup::after {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(

      transparent,
      transparent 2px,
      rgba(0, 0, 0, 0.12) 2px,
      rgba(0, 0, 0, 0.12) 4px

    pointer-events: none;
    z-index: 10;
  }

  .popup > * { position: relative; z-index: 1; }

  /* ===== HEADER ===== */
  .popup-header {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 2px solid var(--yellow);

    flex-shrink: 0;

  .popup-logo {

  .popup-header-spacer { flex: 1; }

  .status-pill {

    text-overflow: ellipsis;
  }

  .scan-url::before {

  .transfer-name {
