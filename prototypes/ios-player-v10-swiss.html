<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>put.io -- iOS Player (v10 Swiss)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0A;
    --bg-2: #111111;
    --bg-3: #1A1A1A;
    --bg-4: #222222;
    --text: #EDEDED;
    --text-2: #999999;
    --text-3: #666666;
    --text-4: #444444;
    --line: rgba(255,255,255,0.06);
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
  }
  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }
  .phone {
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column; background: var(--bg);
  }

  /* Status Bar */
  .status-bar {
    display: flex; align-items: center; padding: 14px 24px 8px;
    font-size: 15px; font-weight: 600; height: 54px; flex-shrink: 0;
  }
  .time { flex: 1; }
  .icons { display: flex; align-items: center; gap: 6px; }

  /* Video */
  .video-area {
    width: 100%; height: 220px; background: #000;
    position: relative; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .play-btn {
    width: 56px; height: 56px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid var(--yellow); cursor: pointer;
  }
  .video-badge {
    position: absolute; top: 12px; left: 16px;
    font-size: 10px; font-weight: 700; color: var(--text);
    text-transform: uppercase; letter-spacing: 0.08em;
    background: var(--bg-3); padding: 4px 8px;
  }
  .video-time {
    position: absolute; bottom: 12px; right: 16px;
    font-size: 11px; color: var(--text-2); font-variant-numeric: tabular-nums;
  }

  /* Scrubber */
  .scrubber { padding: 16px 24px 8px; flex-shrink: 0; }
  .scrub-track { width: 100%; height: 2px; background: var(--bg-4); }
  .scrub-fill { height: 100%; width: 35%; background: var(--yellow); }
  .scrub-times { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }

  /* Title */
  .title-area { padding: 20px 24px 12px; flex-shrink: 0; }
  .video-title { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 4px; }
  .video-meta { font-size: 12px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }

  /* Controls -- strict grid, no rounded corners */
  .controls {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
    margin: 12px 24px; flex-shrink: 0;
    background: var(--line);
  }
  .ctrl-btn {
    height: 52px; display: flex; align-items: center; justify-content: center;
    background: var(--bg-2); cursor: pointer;
  }
  .ctrl-btn.main { background: var(--yellow); }

  /* Info grid */
  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1px;
    margin: 0 24px; background: var(--line); flex-shrink: 0;
  }
  .info-cell {
    background: var(--bg-2); padding: 14px 16px;
  }
  .info-label { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .info-value { font-size: 14px; font-weight: 700; letter-spacing: -0.01em; }

  /* Subtitle list */
  .sub-section { padding: 24px 24px 0; flex: 1; overflow-y: auto; }
  .sub-title { font-size: 10px; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px; font-weight: 700; }
  .sub-row { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .sub-row:last-child { border-bottom: none; }
  .sub-lang { font-size: 13px; color: var(--text); font-weight: 500; flex: 1; }
  .sub-active { font-size: 10px; color: var(--yellow); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
  .sub-indicator { width: 8px; height: 2px; background: var(--yellow); margin-right: 8px; }

  /* Tab Bar */
  .tab-bar {
    display: flex; border-top: 1px solid var(--line);
    padding: 8px 0 34px; flex-shrink: 0; background: var(--bg);
  }
  .tab-item {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 10px; font-weight: 500; color: var(--text-3); padding: 4px 0;
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .tab-item.active { color: var(--text); }
  .tab-bar-indicator { width: 16px; height: 2px; background: var(--yellow); margin-top: 2px; }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="8" width="3" height="4" fill="#EDEDED"/><rect x="4.5" y="5" width="3" height="7" fill="#EDEDED"/>
        <rect x="9" y="2" width="3" height="10" fill="#EDEDED"/><rect x="13.5" y="0" width="3" height="12" fill="#EDEDED"/>
      </svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
        <rect x="0.5" y="0.5" width="23" height="12" rx="2" stroke="#EDEDED" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="18" height="9" rx="1" fill="#EDEDED"/>
        <rect x="25" y="4" width="2" height="5" fill="#EDEDED" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <div class="video-area">

  <div class="title-area">

  </div>

  <div class="controls">
    <div class="ctrl-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round">
        <polyline points="11 19 2 12 11 5"/><polyline points="22 19 13 12 22 5"/>
      </svg>
    </div>
    <div class="ctrl-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round">
        <path d="M1 4v6h6"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>

    <div class="ctrl-btn main">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#0A0A0A">
        <rect x="5" y="4" width="5" height="16"/><rect x="14" y="4" width="5" height="16"/>
      </svg>
    </div>
    <div class="ctrl-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round">
        <path d="M23 4v6h-6"/><path d="M20.49 15a9 9 0 1 1-2.13-9.36L23 10"/>
      </svg>
    </div>
    <div class="ctrl-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-2)" stroke-width="2" stroke-linecap="round">
        <polyline points="13 19 22 12 13 5"/><polyline points="2 19 11 12 2 5"/>
      </svg>
    </div>
  </div>

  <div class="info-grid">
    <div class="info-cell"><div class="info-label">Quality</div><div class="info-value">2160p</div></div>
    <div class="info-cell"><div class="info-label">Audio</div><div class="info-value">DTS-HD 5.1</div></div>
    <div class="info-cell"><div class="info-label">Size</div><div class="info-value">4.2 GB</div></div>
    <div class="info-cell"><div class="info-label">Codec</div><div class="info-value">HEVC</div></div>
  </div>

  <div class="sub-section">
    <div class="sub-title">Subtitles</div>
    <div class="sub-row"><div class="sub-indicator"></div><span class="sub-lang">English</span><span class="sub-active">Active</span></div>
    <div class="sub-row"><span class="sub-lang" style="padding-left:16px;">Turkish</span></div>
    <div class="sub-row"><span class="sub-lang" style="padding-left:16px;">Spanish</span></div>
    <div class="sub-row"><span class="sub-lang" style="padding-left:16px;">Off</span></div>
  </div>

  <div class="tab-bar">
    <div class="tab-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 8h6l2 2h10v10H3z"/></svg>
      Files

      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 4v12M8 12l4 4 4-4"/><path d="M5 18h14"/></svg>

    </div>
    <div class="tab-item active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="16" height="16"/><polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/></svg>
      Player
      <div class="tab-bar-indicator"></div>
    </div>
    <div class="tab-item">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2"/></svg>

    </div>
  </div>
</div>
</body>
</html>
