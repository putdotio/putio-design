<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#000000">
<title>put.io — iOS Share Extension (v12 Linear Neutral)</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #000000;
    --surface: #1C1C1E;
    --surface-elevated: #2C2C2E;
    --bg-card: rgba(255,255,255,0.04);
    --bg-elevated: rgba(255,255,255,0.06);
    --text: #F5F5F5;
    --text-2: #A1A1AA;
    --text-3: #71717A;
    --line: rgba(255,255,255,0.06);
    --yellow: #FDCE45;
    --yellow-dim: rgba(253,206,69,0.12);
    --red: #FF453A;
    --green: #30D158;
    --blue: #0A84FF;
    --radius: 12px;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .phone {
    width: 390px; height: 844px; overflow: hidden;
    display: flex; flex-direction: column; position: relative;
    background: var(--bg);
  }

  /* Status Bar */
  .status-bar {
    display: flex; align-items: center; padding: 14px 28px 8px;
    font-size: 15px; font-weight: 600; height: 54px; flex-shrink: 0;
    color: var(--text);
  }
  .status-bar .time { flex: 1; letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }

  /* Background app content (blurred / dimmed) */
  .bg-content {
    flex: 1;
    padding: 0 24px;
    opacity: 0.3;
    filter: blur(1px);
  }
  .bg-nav {
    font-size: 34px; font-weight: 700; color: var(--text);
    letter-spacing: -0.03em;
    padding: 4px 0 20px;
  }
  .bg-row {
    height: 52px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 2px;
  }

  /* Dimmed overlay */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 10;
  }

  /* Share Sheet */
  .share-sheet {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    z-index: 20;
    background: var(--surface);
    border-radius: 14px 14px 0 0;
    padding-bottom: 34px;
    box-shadow: 0 -8px 40px rgba(0,0,0,0.4);
  }

  /* Drag Handle */
  .drag-handle {
    width: 36px; height: 5px;
    border-radius: 999px;
    background: rgba(255,255,255,0.2);
    margin: 8px auto 0;
  }

  /* Sheet Header */
  .sheet-header {
    display: flex; align-items: center; gap: 12px;
    padding: 20px 24px 16px;
  }
  .sheet-logo {
    width: 36px; height: 36px;
    border-radius: 8px;
    background: var(--yellow);
    display: flex; align-items: center; justify-content: center;
  }
  .sheet-title {
    font-size: 18px; font-weight: 600; color: var(--text);
    letter-spacing: -0.01em;
  }

  /* URL Preview */
  .url-preview {
    margin: 0 24px 20px;
    padding: 14px 16px;
    background: var(--surface-elevated);
    border-radius: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .url-icon {
    width: 32px; height: 32px;
    border-radius: 7px;
    background: rgba(255,255,255,0.06);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .url-text {
    font-size: 14px; font-weight: 400; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }

  /* Destination */
  .destination {
    margin: 0 24px 24px;
    display: flex; align-items: center; gap: 12px;
    cursor: pointer;
  }
  .dest-label {
    font-size: 13px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.06em;
    margin-bottom: 8px;
  }
  .dest-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    background: var(--surface-elevated);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .dest-row:active { background: rgba(255,255,255,0.08); }
  .dest-icon {
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .dest-name {
    font-size: 16px; font-weight: 500; color: var(--text);
    flex: 1;
  }
  .dest-chevron {
    flex-shrink: 0;
    opacity: 0.3;
  }

  /* Progress (shown when downloading) */
  .progress-section {
    margin: 0 24px 24px;
    padding: 14px 16px;
    background: var(--surface-elevated);
    border-radius: 10px;
  }
  .progress-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .progress-status {
    font-size: 14px; font-weight: 500; color: var(--text);
    display: flex; align-items: center; gap: 8px;
  }
  .progress-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(253,206,69,0.2);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .progress-pct {
    font-size: 13px; font-weight: 600; color: var(--yellow);
    font-variant-numeric: tabular-nums;
  }
  .progress-bar {
    height: 3px; background: rgba(255,255,255,0.06);
    border-radius: 999px; overflow: hidden;
  }
  .progress-fill {
    height: 100%; width: 34%;
    background: var(--yellow);
    border-radius: 999px;
    transition: width 0.3s ease;
  }

  /* Buttons */
  .sheet-actions {
    margin: 0 24px;
    display: flex; flex-direction: column; gap: 10px;
  }
  .btn-save {
    width: 100%;
    padding: 16px;
    background: var(--yellow);
    color: #000;
    font-size: 17px; font-weight: 600;
    border: none; border-radius: 12px;
    cursor: pointer;
    text-align: center;
    letter-spacing: -0.01em;
    transition: opacity 0.12s;
  }
  .btn-save:active { opacity: 0.8; }
  .btn-cancel {
    width: 100%;
    padding: 14px;
    background: none;
    color: var(--text-3);
    font-size: 17px; font-weight: 400;
    border: none;
    cursor: pointer;
    text-align: center;
    transition: color 0.12s;
  }
  .btn-cancel:active { color: var(--text-2); }
</style>
</head>
<body>

<div class="phone">
  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">9:41</span>
    <div class="icons">
      <svg width="17" height="12" fill="none"><g fill="#F5F5F5"><rect x="0" y="3" width="3" height="9" rx="0.5" opacity=".4"/><rect x="4.5" y="2" width="3" height="10" rx="0.5" opacity=".6"/><rect x="9" y="0.5" width="3" height="11.5" rx="0.5" opacity=".8"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></g></svg>
      <svg width="16" height="12" fill="none"><path d="M8 2.4C10.6 2.4 12.9 3.5 14.5 5.2L15.6 4.1C13.7 2.1 11 .8 8 .8S2.3 2.1 .4 4.1L1.5 5.2C3.1 3.5 5.4 2.4 8 2.4Z" fill="#F5F5F5"/><path d="M8 6.3C9.7 6.3 11.2 7 12.3 8.1L13.4 7C12 5.6 10.1 4.7 8 4.7S4 5.6 2.6 7L3.7 8.1C4.8 7 6.3 6.3 8 6.3Z" fill="#F5F5F5"/><path d="M8 10.2C8.9 10.2 9.7 10.6 10.3 11.2L8 13.6 5.7 11.2C6.3 10.6 7.1 10.2 8 10.2Z" fill="#F5F5F5"/></svg>
      <svg width="27" height="12" fill="none"><rect x="0" y="1" width="22" height="10" rx="2" stroke="#F5F5F5" stroke-opacity=".35"/><rect x="1.5" y="2.5" width="17" height="7" rx="1" fill="#F5F5F5"/><path d="M23.5 4.5v3a1.5 1.5 0 000-3z" fill="#F5F5F5" opacity=".4"/></svg>
    </div>
  </div>

  <!-- Background app content (Safari or other app) -->
  <div class="bg-content">
    <div class="bg-nav">Safari</div>
    <div class="bg-row"></div>
    <div class="bg-row" style="width: 80%;"></div>
    <div class="bg-row" style="width: 60%; margin-top: 16px;"></div>
    <div class="bg-row" style="margin-top: 16px;"></div>
    <div class="bg-row"></div>
    <div class="bg-row" style="width: 70%;"></div>
  </div>

  <!-- Dimmed overlay -->
  <div class="overlay"></div>

  <!-- Share Sheet -->
  <div class="share-sheet">
    <div class="drag-handle"></div>

    <!-- Header -->
    <div class="sheet-header">
      <div class="sheet-logo">
        <svg width="20" height="20" fill="none"><path d="M5 5l5-3 5 3v7l-5 3-5-3V5z" fill="#000" opacity="0.8"/><path d="M10 8v6" stroke="#000" stroke-width="1.8" stroke-linecap="round"/><path d="M7.5 10.5L10 8l2.5 2.5" stroke="#000" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="sheet-title">Save to put.io</div>
    </div>

    <!-- URL Preview -->
    <div class="url-preview">
      <div class="url-icon">
        <svg width="16" height="16" fill="none" stroke="#A1A1AA" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 9.5a3.5 3.5 0 005-5"/><path d="M9.5 6.5a3.5 3.5 0 00-5 5"/><path d="M8.5 7.5l-1 1"/></svg>
      </div>
      <div class="url-text">magnet:?xt=urn:btih:a3f2b8c9d1e4...&dn=Dune.Part.Three.2026</div>
    </div>

    <!-- Destination folder -->
    <div style="margin: 0 24px 24px;">
      <div class="dest-label">Save to</div>
      <div class="dest-row">
        <div class="dest-icon">
          <svg width="20" height="20" fill="none"><path d="M2 5.5C2 4.67 2.67 4 3.5 4H8l1.5 2H16.5c.83 0 1.5.67 1.5 1.5V14.5c0 .83-.67 1.5-1.5 1.5H3.5c-.83 0-1.5-.67-1.5-1.5V5.5Z" fill="#FDCE45"/></svg>
        </div>
        <div class="dest-name">Your Files</div>
        <svg class="dest-chevron" width="8" height="14" fill="none" stroke="#F5F5F5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 1l6 6-6 6"/></svg>
      </div>
    </div>

    <!-- Progress (downloading state) -->
    <div class="progress-section">
      <div class="progress-header">
        <div class="progress-status">
          <div class="progress-spinner"></div>
          Downloading...
        </div>
        <div class="progress-pct">34%</div>
      </div>
      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="sheet-actions" style="margin-top: 4px;">
      <button class="btn-save" style="opacity: 0.4; pointer-events: none;">Saving...</button>
      <button class="btn-cancel">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>
