<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>put.io — Web TV Player</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #141416; --bg-3: #1E1E22; --bg-4: #28282E;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.15);
    --badge-bg: rgba(255,255,255,0.08);
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .tv-frame {
    width: 1280px; height: 720px; position: relative; overflow: hidden;
  }

  /* Full-screen video background */
  .video-bg {
    position: absolute; inset: 0;
    background: linear-gradient(135deg, #0a0a1a 0%, #141428 40%, #0a0a1a 100%);
  }

  /* Title bar (top) */
  .title-bar {
    position: absolute; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    padding: 14px 48px;
    display: flex; align-items: center; gap: 12px;
    z-index: 10;
  }
  .title-bar-name {
    font-size: 15px; font-weight: 600; color: #fff;
  }
  .title-bar-badges {
    display: flex; align-items: center; gap: 6px;
  }
  .title-badge {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase;
    background: var(--badge-bg);
    color: var(--text-2);
    padding: 2px 8px; border-radius: 4px;
    line-height: 1.4;
  }
  .title-bar-spacer { flex: 1; }
  .title-bar-meta {
    font-size: 12px; color: var(--text-2);
  }

  /* Subtitle display */
  .subtitle-container {
    position: absolute; bottom: 160px; left: 50%; transform: translateX(-50%);
    z-index: 10;
  }
  .subtitle-text {
    color: #fff; font-size: 22px; font-weight: 500;
    text-align: center; line-height: 1.4;
    text-shadow: 0 2px 8px rgba(0,0,0,0.8);
  }

  /* Transport bar (bottom) */
  .transport-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.8);
    padding: 18px 48px 22px;
    z-index: 20;
  }

  /* Row 1: Scrubber */
  .scrubber-row {
    display: flex; align-items: center; gap: 14px;
    margin-bottom: 18px;
  }
  .time-label {
    font-size: 13px; font-weight: 500; color: #fff;
    font-variant-numeric: tabular-nums;
    min-width: 40px;
  }
  .time-label-right {
    font-size: 13px; font-weight: 500; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    min-width: 48px; text-align: right;
  }
  .progress-track {
    flex: 1; height: 3px; background: #333;
    border-radius: 2px; position: relative;
  }
  .progress-fill {
    height: 100%; width: 42%; background: var(--yellow);
    border-radius: 2px;
  }
  .progress-dot {
    width: 10px; height: 10px; background: #fff;
    border-radius: 50%; position: absolute; top: 50%; left: 42%;
    transform: translate(-50%, -50%);
  }

  /* Row 2: Control buttons */
  .controls-row {
    display: flex; align-items: center; justify-content: center;
    gap: 32px;
  }
  .ctrl-btn {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85);
    width: 28px; height: 28px;
    position: relative;
  }
  .ctrl-btn svg { display: block; }
  .ctrl-btn.focused {
    color: var(--yellow);
  }
  .ctrl-btn.focused svg {
    width: 36px; height: 36px;
  }

  /* Play button */
  .ctrl-btn.play-btn {
    width: 36px; height: 36px;
    background: #fff;
    border-radius: 50%;
    color: #000;
  }
  .ctrl-btn.play-btn.focused {
    width: 44px; height: 44px;
    background: var(--yellow);
    color: #000;
    border: 2px solid var(--yellow);
  }

  /* Text-based control buttons */
  .ctrl-btn-text {
    background: none; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    color: rgba(255,255,255,0.85);
    font-family: 'Inter', -apple-system, sans-serif;
    font-size: 13px; font-weight: 600;
    height: 28px;
    position: relative;
  }
  .ctrl-btn-text.focused {
    color: var(--yellow);
  }

  /* Gap separator */
  .controls-gap {
    width: 48px;
  }

  /* Info panel (right side overlay) */
  .info-panel {
    position: absolute; top: 0; right: 0; bottom: 0;
    width: 380px;
    background: rgba(0,0,0,0.85);
    padding: 48px 28px;
    z-index: 15;
    display: flex; flex-direction: column;
  }
  .info-panel-header {
    margin-bottom: 24px;
  }
  .info-panel-title {
    font-size: 16px; font-weight: 600; color: #fff;
    margin-bottom: 8px;
  }
  .info-panel-badges {
    display: flex; align-items: center; gap: 6px;
  }
  .info-badge {
    font-size: 10px; font-weight: 600;
    text-transform: uppercase;
    background: var(--badge-bg);
    color: var(--text-2);
    padding: 2px 8px; border-radius: 4px;
    line-height: 1.4;
  }
  .info-row {
    display: flex; align-items: baseline; justify-content: space-between;
    padding: 10px 0;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .info-row:last-child { border-bottom: none; }
  .info-label {
    font-size: 12px; font-weight: 500; color: var(--text-2);
    flex-shrink: 0;
  }
  .info-value {
    font-size: 13px; font-weight: 500; color: #fff;
    text-align: right;
  }

  /* D-pad hints */
  .bottom-hints {
    position: absolute; bottom: 104px; left: 0; right: 0;
    text-align: center;
    z-index: 25;
    pointer-events: none;
  }
  .bottom-hints span {
    font-size: 11px; color: rgba(255,255,255,0.3);
    letter-spacing: 0.02em;
  }
</style>
</head>
<body>
<div class="tv-frame">
  <!-- Full-Screen Video Background -->
  <div class="video-bg"></div>

  <!-- Title Bar (top) — parsed filename -->
  <div class="title-bar">
    <span class="title-bar-name">The Wire</span>
    <div class="title-bar-badges">
      <span class="title-badge">S3 &middot; E2</span>
      <span class="title-badge">1080p</span>
    </div>
    <div class="title-bar-spacer"></div>
    <span class="title-bar-meta">1.9 GB &middot; MKV</span>
  </div>

  <!-- Subtitle -->
  <div class="subtitle-container">
    <div class="subtitle-text">You come at the king, you best not miss.</div>
  </div>

  <!-- Info Panel (right side) — parsed metadata -->
  <div class="info-panel">
    <div class="info-panel-header">
      <div class="info-panel-title">The Wire</div>
      <div class="info-panel-badges">
        <span class="info-badge">S3 &middot; E2</span>
        <span class="info-badge">1080p</span>
        <span class="info-badge">MKV</span>
      </div>
    </div>
    <div class="info-row">
      <span class="info-label">Duration</span>
      <span class="info-value">55:00</span>
    </div>
    <div class="info-row">
      <span class="info-label">Resolution</span>
      <span class="info-value">1920&times;1080</span>
    </div>
    <div class="info-row">
      <span class="info-label">Size</span>
      <span class="info-value">1.9 GB</span>
    </div>
    <div class="info-row">
      <span class="info-label">Format</span>
      <span class="info-value">MKV / H.264</span>
    </div>
    <div class="info-row">
      <span class="info-label">Audio</span>
      <span class="info-value">English 5.1, English 2.0</span>
    </div>
    <div class="info-row">
      <span class="info-label">Subtitles</span>
      <span class="info-value">English, Turkish, Spanish</span>
    </div>
  </div>

  <!-- D-pad Hints -->
  <div class="bottom-hints">
    <span>OK Play/Pause &nbsp;&nbsp; &#x25C0;&#x25B6; Seek &nbsp;&nbsp; &#x25BC; Info &nbsp;&nbsp; Back Exit</span>
  </div>

  <!-- Transport Bar (bottom) -->
  <div class="transport-bar">
    <!-- Row 1: Scrubber -->
    <div class="scrubber-row">
      <span class="time-label">23:14</span>
      <div class="progress-track">
        <div class="progress-fill"></div>
        <div class="progress-dot"></div>
      </div>
      <span class="time-label-right">-31:46</span>
    </div>

    <!-- Row 2: Control buttons -->
    <div class="controls-row">
      <!-- Skip back 10s -->
      <button class="ctrl-btn" title="Skip back 10s">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/>
          <path d="M1 10a10 10 0 1 1 2.51 7.36"/>
        </svg>
        <span style="position:absolute;font-size:9px;font-weight:700;color:currentColor;top:50%;left:50%;transform:translate(-50%,-50%);margin-top:1px;">10</span>
      </button>

      <!-- Previous -->
      <button class="ctrl-btn" title="Previous">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <rect x="3" y="5" width="3" height="14" rx="1"/>
          <path d="M20 5.5v13a1 1 0 0 1-1.54.84l-9-6.5a1 1 0 0 1 0-1.68l9-6.5A1 1 0 0 1 20 5.5z"/>
        </svg>
      </button>

      <!-- Play (focused) -->
      <button class="ctrl-btn play-btn focused" title="Play">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 4l15 8-15 8V4z"/>
        </svg>
      </button>

      <!-- Next -->
      <button class="ctrl-btn" title="Next">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
          <rect x="18" y="5" width="3" height="14" rx="1"/>
          <path d="M4 18.5v-13a1 1 0 0 1 1.54-.84l9 6.5a1 1 0 0 1 0 1.68l-9 6.5A1 1 0 0 1 4 18.5z"/>
        </svg>
      </button>

      <!-- Skip forward 10s -->
      <button class="ctrl-btn" title="Skip forward 10s">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 4v6h-6"/>
          <path d="M23 10A10 10 0 1 0 20.49 17.36"/>
        </svg>
        <span style="position:absolute;font-size:9px;font-weight:700;color:currentColor;top:50%;left:50%;transform:translate(-50%,-50%);margin-top:1px;">10</span>
      </button>

      <!-- Gap -->
      <div class="controls-gap"></div>

      <!-- CC / Subtitles -->
      <button class="ctrl-btn" title="Subtitles">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2"/>
          <line x1="5" y1="12" x2="11" y2="12"/>
          <line x1="13" y1="12" x2="19" y2="12"/>
          <line x1="5" y1="16" x2="15" y2="16"/>
        </svg>
      </button>

      <!-- Audio track -->
      <button class="ctrl-btn" title="Audio track">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
        </svg>
      </button>

      <!-- More -->
      <button class="ctrl-btn-text" title="More">
        &middot;&middot;&middot;
      </button>
    </div>
  </div>
</div>
</body>
</html>
