<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg">
<meta name="theme-color" content="#111113">
<title>put.io — TV Conversion (Glass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #111113; --bg-2: #19191B; --bg-3: #222225; --bg-4: #2C2C30;
    --glass: rgba(255,255,255,0.05); --glass-hover: rgba(255,255,255,0.08);
    --glass-border: rgba(255,255,255,0.08); --glass-border-strong: rgba(255,255,255,0.12);
    --glass-inset: inset 0 1px 1px rgba(255,255,255,0.04);
    --text: #EEEEF0; --text-2: #ABABB2; --text-3: #77777F; --text-4: #55555E;
    --yellow: #FDCE45; --yellow-dim: rgba(253,206,69,0.12); --yellow-glow: rgba(253,206,69,0.20);
    --green: #30A46C; --red: #E5484D;
    --blur-heavy: blur(40px); --blur-medium: blur(24px); --blur-light: blur(16px);
    --radius: 16px; --radius-sm: 10px;
    --badge-bg: rgba(255,255,255,0.08);
  }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text); background: var(--bg);
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    font-feature-settings: 'cv11' 1, 'ss01' 1;
  }

  .tv-frame {
    width: 1920px; height: 1080px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #111118, #131320, #111113);
    display: flex; align-items: center; justify-content: center;
  }

  /* Ambient glow orbs */
  .tv-frame::before {
    content: ''; position: absolute;
    top: -150px; right: 350px;
    width: 700px; height: 700px;
    background: radial-gradient(circle, rgba(253,206,69,0.08) 0%, rgba(253,206,69,0.02) 40%, transparent 70%);
    pointer-events: none; z-index: 0;
  }
  .tv-frame::after {
    content: ''; position: absolute;
    bottom: -150px; left: 350px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(253,206,69,0.05) 0%, transparent 60%);
    pointer-events: none; z-index: 0;
  }

  .content {
    display: flex; flex-direction: column; align-items: center;
    max-width: 600px; width: 100%;
    position: relative; z-index: 1;
  }

  .poster {
    width: 320px; height: 180px; border-radius: var(--radius);
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 1px solid var(--glass-border-strong);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4), var(--glass-inset);
  }

  .file-info { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .file-title { font-size: 32px; font-weight: 600; color: var(--text); line-height: 1.2; }
  .file-badges { display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 14px; font-weight: 600; text-transform: uppercase;
    background: var(--badge-bg); color: var(--text-2);
    padding: 4px 12px; border-radius: 6px; line-height: 1.4;
    backdrop-filter: var(--blur-light); -webkit-backdrop-filter: var(--blur-light);
  }

  .progress-section { margin-top: 32px; display: flex; flex-direction: column; align-items: center; width: 100%; }
  .progress-percentage {
    font-size: 56px; font-weight: 700; color: var(--yellow); line-height: 1.1;
    text-shadow: 0 0 24px var(--yellow-glow);
  }
  .progress-bar-track {
    width: 480px; height: 8px;
    background: rgba(255,255,255,0.06); border-radius: 4px;
    margin-top: 20px; overflow: hidden;
  }
  .progress-bar-fill {
    width: 63%; height: 100%;
    background: var(--yellow); border-radius: 4px;
    box-shadow: 0 0 16px var(--yellow-glow);
  }
  .progress-label { font-size: 20px; color: var(--text-2); margin-top: 16px; text-align: center; }

  .spinner-row { margin-top: 8px; display: flex; align-items: center; gap: 10px; }
  .spinner {
    width: 20px; height: 20px;
    border: 2px solid rgba(255,255,255,0.06);
    border-top-color: var(--yellow);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
    filter: drop-shadow(0 0 4px var(--yellow-glow));
  }
  .spinner-text { font-size: 16px; color: var(--text-3); }
  @keyframes spin { to { transform: rotate(360deg); } }

  .cancel-btn {
    margin-top: 40px; font-size: 20px; font-weight: 600;
    color: var(--text-2);
    background: var(--glass);
    backdrop-filter: var(--blur-medium); -webkit-backdrop-filter: var(--blur-medium);
    border: 2px solid var(--text-3);
    border-radius: var(--radius-sm); padding: 14px 48px;
    cursor: pointer; font-family: inherit;
    box-shadow: var(--glass-inset);
    transition: border-color 0.15s, background 0.15s;
  }
  .cancel-btn:focus {
    outline: none;
    border-color: var(--yellow);
    background: var(--glass-hover);
    box-shadow: var(--glass-inset), 0 0 20px rgba(253,206,69,0.1);
  }
</style>
</head>
<body>

<div class="tv-frame">
  <div class="content">

    <div class="poster">
      <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
        <path d="M18 12L38 24L18 36V12Z" fill="rgba(255,255,255,0.2)"/>
      </svg>
    </div>

    <div class="file-info">
      <div class="file-title">The Wire</div>
      <div class="file-badges">
        <span class="badge">S03 · E04</span>
        <span class="badge">1080p</span>
      </div>
    </div>

    <div class="progress-section">
      <div class="progress-percentage">63%</div>
      <div class="progress-bar-track"><div class="progress-bar-fill"></div></div>
      <div class="progress-label">Converting your file...</div>
    </div>

    <div class="spinner-row">
      <div class="spinner"></div>
      <span class="spinner-text">This may take a few minutes</span>
    </div>

    <button class="cancel-btn">Cancel</button>

  </div>
</div>

</body>
</html>
