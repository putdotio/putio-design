<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1440">
<title>put.io — Share with Mom (Scandinavian)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg: #12110F;
    --surface: #1C1A17;
    --surface-2: #232019;
    --border: #2A2723;
    --text: #E8E4DD;
    --text-2: #C8C4BE;
    --text-3: #8A857D;
    --text-4: #5C5850;
    --yellow: #FDCE45;
    --yellow-soft: rgba(253, 206, 69, 0.08);
    --green: #5BB98B;
    --red: #E5484D;
    --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    --radius: 16px;
    --radius-sm: 12px;
    --radius-xs: 8px;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    width: 1440px;
    height: 900px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    position: relative;
  }

  /* Top brand bar */
  .brand-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 28px 48px;
  }

  .logo {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: -0.03em;
  }

  .logo-dot { color: var(--yellow); }

  .brand-link {
    font-size: 14px;
    color: var(--text-3);
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s ease;
  }

  .brand-link:hover { color: var(--yellow); }

  /* Main card */
  .share-card {
    width: 680px;
    background: var(--surface);
    border-radius: 24px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.3);
    overflow: hidden;
  }

  .share-header {
    padding: 36px 40px 0;
  }

  .share-from {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--text-4);
    margin-bottom: 8px;
  }

  .share-title {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.03em;
    color: var(--text);
    margin-bottom: 4px;
  }

  .share-meta {
    font-size: 14px;
    color: var(--text-3);
    font-weight: 500;
    margin-bottom: 24px;
  }

  /* Video preview */
  .video-preview {
    margin: 0 40px;
    background: var(--surface-2);
    border-radius: var(--radius);
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  .play-btn {
    width: 64px;
    height: 64px;
    background: var(--yellow);
    border-radius: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(253, 206, 69, 0.25);
    transition: all 0.2s ease;
  }

  .play-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 28px rgba(253, 206, 69, 0.35);
  }

  .play-btn svg { color: var(--bg); }

  .video-duration {
    position: absolute;
    bottom: 16px;
    right: 16px;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: var(--radius-xs);
  }

  /* File info row */
  .file-info-row {
    display: flex;
    align-items: center;
    margin: 20px 40px 0;
    padding: 16px 20px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    gap: 14px;
  }

  .file-icon {
    width: 40px;
    height: 40px;
    background: var(--yellow-soft);
    border-radius: var(--radius-xs);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .file-icon svg { color: var(--yellow); }

  .file-details { flex: 1; }

  .file-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }

  .file-size {
    font-size: 12px;
    color: var(--text-3);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
  }

  /* Expiry */
  .expiry-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 16px 40px 0;
    padding: 14px 20px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    font-size: 13px;
    color: var(--text-3);
    font-weight: 500;
  }

  .expiry-row svg { color: var(--text-4); flex-shrink: 0; }

  .expiry-time {
    font-weight: 700;
    color: var(--yellow);
  }

  /* Actions */
  .share-actions {
    padding: 24px 40px;
    display: flex;
    gap: 10px;
  }

  .btn-download {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--yellow);
    color: var(--bg);
    font-size: 14px;
    font-weight: 600;
    padding: 14px 32px;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    flex: 1;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(253, 206, 69, 0.2);
    transition: all 0.2s ease;
  }

  .btn-download:hover {
    box-shadow: 0 4px 20px rgba(253, 206, 69, 0.3);
    transform: translateY(-1px);
  }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--surface-2);
    color: var(--text-2);
    font-size: 14px;
    font-weight: 500;
    padding: 14px 24px;
    border: none;
    cursor: pointer;
    font-family: var(--font);
    border-radius: var(--radius-sm);
    transition: all 0.2s ease;
  }

  .btn-secondary:hover {
    background: var(--border);
    color: var(--text);
  }

  /* Sign-up teaser */
  .signup-teaser {
    margin: 0 40px 32px;
    padding: 20px 24px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .teaser-text { flex: 1; }

  .teaser-title {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 2px;
  }

  .teaser-sub {
    font-size: 13px;
    color: var(--text-3);
    font-weight: 400;
  }

  .btn-signup {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: transparent;
    color: var(--yellow);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 18px;
    border: 1px solid var(--yellow);
    border-radius: var(--radius-xs);
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: all 0.2s ease;
  }

  .btn-signup:hover {
    background: var(--yellow);
    color: var(--bg);
  }

  /* Footer */
  .page-footer {
    position: absolute;
    bottom: 28px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-4);
    font-weight: 500;
  }
</style>
</head>
<body>
<div class="page">

  <div class="brand-bar">
    <div class="logo">put<span class="logo-dot">.</span>io</div>
    <a class="brand-link" href="#">What is put.io?</a>
  </div>

  <div class="share-card">

    <div class="share-header">
      <div class="share-from">Shared by Hasan</div>
      <h1 class="share-title">Cosmos Laundromat.mp4</h1>
      <div class="share-meta">Shared with you via put.io</div>
    </div>

    <div class="video-preview">
      <div class="play-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="9,5 20,12 9,19"/>
        </svg>
      </div>
      <div class="video-duration">12:14</div>
    </div>

    <div class="file-info-row">
      <div class="file-icon">
        <svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="8,5 16,10 8,15"/>
        </svg>
      </div>
      <div class="file-details">
        <div class="file-name">Cosmos Laundromat.mp4</div>
        <div class="file-size">209.89 MB</div>
      </div>
    </div>

    <div class="expiry-row">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="8" cy="8" r="6"/>
        <polyline points="8,4 8,8 11,10"/>
      </svg>
      Expires in <span class="expiry-time">6 days, 23 hours</span>
    </div>

    <div class="share-actions">
      <button class="btn-download">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="8,2 8,11"/>
          <polyline points="4,8 8,11 12,8"/>
          <line x1="3" y1="14" x2="13" y2="14"/>
        </svg>
        Download
      </button>
      <button class="btn-secondary">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="5" height="5" rx="1"/>
          <rect x="9" y="9" width="5" height="5" rx="1"/>
          <path d="M9 5h2v2"/>
          <path d="M7 11H5V9"/>
        </svg>
        Save to my put.io
      </button>
    </div>

    <div class="signup-teaser">
      <div class="teaser-text">
        <div class="teaser-title">Don't have put.io yet? (^_~)</div>
        <div class="teaser-sub">Fetch, store, and stream anything. Your cloud, your rules.</div>
      </div>
      <button class="btn-signup">
        Sign Up Free
        <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="2" y1="6" x2="10" y2="6"/>
          <polyline points="7,3 10,6 7,9"/>
        </svg>
      </button>
    </div>

  </div>

  <div class="page-footer">put.io -- your files, anywhere (^_^)</div>
</div>
</body>
</html>
