<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>put.io — Android TV Search (Leanback)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0A0A0C; --bg-2: #141416; --bg-3: #1E1E22; --bg-4: #28282E;
    --line: #333339; --border: #444450; --solid: #6C6C78;
    --text-2: #9C9CA8; --text: #EEEEF0;
    --yellow: #FDCE45; --yellow-hover: #FDD868;
    --yellow-subtle: rgba(253, 206, 69, 0.15);
    --green: #30A46C; --red: #FF6369;
  }
  body { font-family: 'Inter', 'Roboto', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .tv-frame { width: 1920px; height: 1080px; overflow: hidden; display: flex; flex-direction: column; padding: 48px 80px; }

  /* Top Header */
  .atv-header {
    display: flex; align-items: center; gap: 24px;
    margin-bottom: 32px; flex-shrink: 0;
  }
  .atv-logo { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; }
  .atv-logo span { color: var(--yellow); }
  .atv-spacer { flex: 1; }
  .atv-header-btn {
    width: 56px; height: 56px; border-radius: 999px;
    background: var(--bg-3); border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .atv-header-btn svg { width: 28px; height: 28px; fill: var(--text-2); }
  .atv-avatar {
    width: 56px; height: 56px; border-radius: 999px;
    background: var(--bg-3); border: 2px solid transparent;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Search Input Area */
  .search-area { margin-bottom: 28px; flex-shrink: 0; }
  .search-input-display {
    display: flex; align-items: center; gap: 16px;
    background: var(--bg-2); border: 2px solid var(--yellow);
    border-radius: 16px; padding: 20px 28px;
    box-shadow: 0 0 24px rgba(253,206,69,0.1);
  }
  .search-input-display svg { width: 32px; height: 32px; fill: var(--yellow); flex-shrink: 0; }
  .search-typed {
    font-size: 32px; font-weight: 500; color: var(--text); flex: 1;
  }
  .search-cursor {
    display: inline-block; width: 3px; height: 36px; background: var(--yellow);
    margin-left: 2px; vertical-align: middle;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }
  .voice-hint {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; color: var(--solid);
    background: var(--bg-4); border-radius: 12px;
    padding: 12px 20px; cursor: pointer; flex-shrink: 0;
    border: none; font-family: inherit;
  }
  .voice-hint svg { width: 24px; height: 24px; fill: var(--text-2); }

  /* Recent Searches */
  .recent-section { margin-bottom: 24px; flex-shrink: 0; }
  .recent-label {
    font-size: 18px; font-weight: 600; color: var(--solid);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 12px;
  }
  .recent-chips { display: flex; gap: 12px; flex-wrap: wrap; }
  .recent-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    border-radius: 999px; padding: 12px 22px;
    font-size: 20px; color: var(--text-2); cursor: pointer;
  }
  .recent-chip:hover { border-color: var(--text-2); color: var(--text); }
  .recent-chip svg { width: 20px; height: 20px; fill: currentColor; }

  /* Results Section */
  .results-section { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .results-label {
    font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 16px;
    flex-shrink: 0;
  }

  /* File List (flat, NOT cards) */
  .file-list { flex: 1; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }

  .file-row {
    display: grid;
    grid-template-columns: 56px 1fr 160px 56px;
    align-items: center; gap: 16px;
    padding: 16px 24px;
    background: var(--bg-2);
    border-radius: 10px;
    cursor: pointer;
    border: 2px solid transparent;
    transition: all 0.12s;
  }
  .file-row:hover { background: var(--bg-3); }
  .file-row.focused {
    background: var(--bg-3);
    border-color: rgba(255,255,255,0.15);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }

  .file-icon {
    width: 48px; height: 48px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
  }
  .file-icon.folder { background: var(--yellow-subtle); }
  .file-icon.folder svg { fill: var(--yellow); width: 28px; height: 28px; }
  .file-icon.video { background: var(--bg-4); }
  .file-icon.video svg { fill: var(--text-2); width: 26px; height: 26px; }
  .file-icon.audio { background: rgba(48,164,108,0.12); }
  .file-icon.audio svg { fill: var(--green); width: 26px; height: 26px; }

  .file-name-cell { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  .file-name {
    font-size: 26px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; align-items: center; gap: 10px;
  }
  .file-meta {
    font-size: 18px; color: var(--solid);
    display: flex; align-items: center; gap: 8px;
  }
  .q-badge {
    font-size: 14px; background: var(--yellow-subtle); color: var(--yellow);
    padding: 2px 8px; border-radius: 5px; font-weight: 700;
    flex-shrink: 0;
  }

  .size-cell {
    font-size: 22px; color: var(--text-2); font-variant-numeric: tabular-nums;
    text-align: right;
  }
  .chevron { display: flex; align-items: center; justify-content: center; }
  .chevron svg { width: 28px; height: 28px; fill: var(--solid); }
  .file-row.focused .chevron svg { fill: var(--text); }

  /* D-pad hint */
  .dpad-hint {
    position: fixed; bottom: 36px; right: 80px;
    display: flex; align-items: center; gap: 12px;
    font-size: 16px; color: var(--solid);
  }
  .dpad-key {
    display: inline-flex; align-items: center; justify-content: center;
    width: 36px; height: 36px; border-radius: 8px;
    background: var(--bg-3); border: 1px solid var(--border);
    font-size: 14px; font-weight: 600; color: var(--text-2);
  }
  .dpad-key svg { width: 18px; height: 18px; fill: currentColor; }
</style>
</head>
<body>
<div class="tv-frame">
