<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>put.io — Roku Files (Glass)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #08081A;
    --glass: rgba(255,255,255,0.06);
    --glass-border: rgba(255,255,255,0.08);
    --glass-hover: rgba(255,255,255,0.10);
    --glass-focus: rgba(255,255,255,0.14);
    --text: #F0F0FA;
    --text-2: rgba(255,255,255,0.50);
    --text-3: rgba(255,255,255,0.30);
    --yellow: #FDCE45;
    --yellow-glow: rgba(253,206,69,0.12);
    --green: #4CC38A;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .tv-frame {
    width: 1280px; height: 720px; overflow: hidden; display: flex; flex-direction: column;
    background: linear-gradient(140deg, #161640 0%, #08081A 35%, #0A1A22 65%, #08081A 100%);
    position: relative;
  }
  .tv-frame::before {
    content: ''; position: absolute; top: -120px; right: -80px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(253,206,69,0.08) 0%, transparent 60%);
    pointer-events: none;
  }
  .tv-frame::after {
    content: ''; position: absolute; bottom: -100px; left: -60px;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(76,195,138,0.05) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Top Bar */
  .top-bar {
    display: flex; align-items: center; gap: 20px;
    padding: 28px 48px 0;
    flex-shrink: 0;
    position: relative; z-index: 1;
  }
  .logo { font-size: 32px; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--yellow); }
  .top-spacer { flex: 1; }
  .top-bar-btn {
    width: 44px; height: 44px; border-radius: 999px;
    background: var(--glass);
    backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
  }
  .top-bar-btn svg { width: 22px; height: 22px; fill: var(--text-2); }

  /* Content */
  .content {
    flex: 1; padding: 24px 48px 24px;
    display: flex; flex-direction: column; overflow: hidden;
    position: relative; z-index: 1;
  }

  .page-header {
    display: flex; align-items: center; gap: 16px; margin-bottom: 20px;
  }
  .page-title { font-size: 36px; font-weight: 700; letter-spacing: -0.01em; }
  .page-spacer { flex: 1; }
  .sort-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; color: var(--text-2);
    background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    padding: 10px 20px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
  }
  .sort-pill svg { width: 18px; height: 18px; fill: currentColor; }

  /* File list */
  .file-list { flex: 1; display: flex; flex-direction: column; gap: 6px; overflow: hidden; }

  .section-header {
    font-size: 14px; font-weight: 600; color: var(--text-3);
    text-transform: uppercase; letter-spacing: 0.08em;
    padding: 8px 0 6px;
  }

  .file-row {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 20px;
    background: var(--glass);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--glass-border);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .file-row:hover { background: var(--glass-hover); }
  .file-row.focused {
    background: var(--glass-focus);
    border-color: var(--yellow);
    box-shadow: 0 0 24px rgba(253,206,69,0.1), inset 0 0 24px rgba(253,206,69,0.04);
  }

  .f-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .f-icon.folder { background: var(--yellow-glow); }
  .f-icon.folder svg { fill: var(--yellow); width: 24px; height: 24px; }
  .f-icon.video { background: rgba(76,195,138,0.10); }
  .f-icon.video svg { fill: var(--green); width: 22px; height: 22px; }
  .f-icon.audio { background: rgba(138,130,255,0.10); }
  .f-icon.audio svg { fill: #8A82FF; width: 22px; height: 22px; }

  .f-name {
    flex: 1; font-size: 22px; font-weight: 500;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .f-badge {
    font-size: 14px; font-weight: 600;
    background: var(--yellow-glow);
    color: var(--yellow);
    padding: 3px 10px; border-radius: 8px;
    border: 1px solid rgba(253,206,69,0.12);
    flex-shrink: 0;
  }

  .f-size {
    font-size: 18px; color: var(--text-2);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0; min-width: 90px; text-align: right;
  }

  .f-chevron svg { width: 22px; height: 22px; fill: var(--text-3); }
  .file-row.focused .f-chevron svg { fill: var(--yellow); }

  /* Footer */
  .footer-hint {
    display: flex; align-items: center; justify-content: center; gap: 24px;
    padding: 14px 0 0; flex-shrink: 0;
    font-size: 16px; color: var(--text-3);
  }
  .hint-key {
    display: inline-flex; align-items: center; gap: 6px;
  }
  .key-box {
    display: inline-flex; align-items: center; justify-content: center;
    width: 30px; height: 26px; border-radius: 6px;
    background: var(--glass);
    border: 1px solid var(--glass-border);
    font-size: 13px; font-weight: 600; color: var(--text-2);
  }
</style>
</head>
