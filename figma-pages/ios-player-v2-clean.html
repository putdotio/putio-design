<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>put.io — iOS Player (Clean Modern)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000; --bg-2: #1C1C1E; --bg-3: #2C2C2E; --bg-4: #3A3A3C;
    --line: #38383A; --solid: #8E8E93; --text-2: #AEAEB2; --text: #FFFFFF;
    --yellow: #FDCE45; --yellow-subtle: rgba(253, 206, 69, 0.15);
    --green: #30D158; --red: #FF453A; --blue: #0A84FF;
  }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    background: var(--bg); color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .phone {
    width: 390px; height: 844px; overflow: hidden;
    position: relative;
  }

  /* Video Background */
  .video-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 35% 30%, rgba(30, 45, 70, 0.6) 0%, transparent 50%),
      radial-gradient(ellipse at 70% 60%, rgba(25, 20, 45, 0.7) 0%, transparent 45%),
      radial-gradient(ellipse at 50% 80%, rgba(15, 30, 50, 0.5) 0%, transparent 50%),
      linear-gradient(180deg, #0c0c18 0%, #10102a 30%, #0e1a30 60%, #080810 100%);
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; padding: 14px 24px 0; height: 54px;
  }
  .status-time { flex: 1; font-size: 15px; font-weight: 600; color: #fff; }
  .status-icons { display: flex; gap: 5px; align-items: center; }

  /* Top Bar with frosted glass */
  .top-bar {
    position: absolute; top: 44px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.65) 0%, transparent 100%);
  }
  .top-btn {
    width: 36px; height: 36px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-radius: 50%; border: none;
    display: flex; align-items: center; justify-content: center;
    color: #fff; cursor: pointer;
  }
  .top-title-area { flex: 1; min-width: 0; }
  .top-title {
    font-size: 16px; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .top-meta { font-size: 13px; color: rgba(255,255,255,0.5); margin-top: 1px; }

  /* Subtitle overlay */
  .subtitle-overlay {
    position: absolute; bottom: 260px; left: 50%; transform: translateX(-50%);
    z-index: 15; width: 340px; text-align: center;
  }
  .subtitle-text {
    display: inline;
    background: rgba(0,0,0,0.75);
    color: #fff; font-size: 16px; font-weight: 400;
    padding: 4px 14px; border-radius: 4px;
    line-height: 1.6;
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }

  /* Center controls */
  .center-controls {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; display: flex; align-items: center; gap: 40px;
  }
  .center-btn {
    background: none; border: none; color: rgba(255,255,255,0.85);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .center-btn.main-play {
    width: 68px; height: 68px;
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.2);
  }
  .skip-num {
    position: absolute; font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.85); margin-top: 2px;
  }

  /* Bottom controls with frosted glass */
  .bottom-controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    background: linear-gradient(to top, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 0 20px 40px;
  }

  /* Scrubber */
  .scrubber-section { margin-bottom: 16px; }
  .scrubber-times {
    display: flex; justify-content: space-between; margin-bottom: 8px;
  }
  .scrubber-time {
    font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.6);
    font-variant-numeric: tabular-nums;
  }
  .scrubber-track {
    width: 100%; height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 2px; position: relative;
  }
  .scrubber-loaded {
    position: absolute; top: 0; left: 0; height: 100%;
    background: rgba(255,255,255,0.12); border-radius: 2px; width: 68%;
  }
  .scrubber-fill {
    height: 100%; background: var(--yellow); border-radius: 2px; width: 38%;
    position: relative; z-index: 1;
    box-shadow: 0 0 8px rgba(253, 206, 69, 0.25);
  }
  .scrubber-dot {
    width: 16px; height: 16px; background: var(--yellow);
    border-radius: 50%; position: absolute; top: 50%; left: 38%;
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow: 0 0 12px rgba(253, 206, 69, 0.5), 0 0 4px rgba(253, 206, 69, 0.8);
  }

  /* Bottom actions */
  .bottom-actions {
    display: flex; align-items: center; justify-content: space-between;
  }
  .bottom-action-btn {
    background: none; border: none; color: rgba(255,255,255,0.7);
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    padding: 6px 8px;
  }
  .bottom-action-label {
    font-size: 10px; font-weight: 500; color: rgba(255,255,255,0.45);
  }
  .speed-pill {
    font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.1); padding: 4px 10px;
    border-radius: 6px; border: none; cursor: pointer;
    font-family: inherit;
  }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: rgba(255,255,255,0.3);
    border-radius: 3px; z-index: 50;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="video-bg"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="status-time">9:41</span>
    <div class="status-icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="white"><rect x="0" y="9" width="3" height="3" rx="0.5"/><rect x="4.5" y="6" width="3" height="6" rx="0.5"/><rect x="9" y="3" width="3" height="9" rx="0.5"/><rect x="13.5" y="0" width="3" height="12" rx="0.5"/></svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="white"><path d="M8,11.5a1.5,1.5,0,1,0,0-3,1.5,1.5,0,0,0,0,3Z"/><path d="M4.93,7.56a4.5,4.5,0,0,1,6.14,0" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/><path d="M2.1,4.73a8,8,0,0,1,11.8,0" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none"><rect x="0.5" y="0.5" width="23" height="12" rx="3" stroke="white" stroke-opacity="0.35"/><rect x="2" y="2" width="18" height="9" rx="1.5" fill="white"/><path d="M25,4.5v4a2,2,0,0,0,0-4Z" fill="white" fill-opacity="0.4"/></svg>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <!-- Back -->
    <button class="top-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
    </button>
    <div class="top-title-area">
      <div class="top-title">Cosmos Laundromat</div>
      <div class="top-meta">720p</div>
    </div>
    <!-- AirPlay -->
    <button class="top-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5,17H4a2,2,0,0,1-2-2V5A2,2,0,0,1,4,3H20a2,2,0,0,1,2,2V15a2,2,0,0,1-2,2H19"/>
        <polygon points="12,15 17,21 7,21"/>
      </svg>
    </button>
    <!-- PiP -->
    <button class="top-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <rect x="12" y="9" width="8" height="6" rx="1" fill="rgba(255,255,255,0.3)"/>
        <path d="M7,10L4,13" stroke-width="1.5"/>
        <polyline points="4,10 4,13 7,13" stroke-width="1.5"/>
      </svg>
    </button>
  </div>

  <!-- Subtitle -->
  <div class="subtitle-overlay">
    <span class="subtitle-text">The cosmos is all that is, or ever was, or ever will be.</span>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back 15s -->
    <button class="center-btn">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1,4V10H7"/>
        <path d="M1,10A10,10,0,1,1,3.51,17.36"/>
      </svg>
      <span class="skip-num">15</span>
    </button>

    <!-- Play/Pause -->
    <button class="center-btn main-play">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8,5.14V19.14L19,12.14Z"/>
      </svg>
    </button>

    <!-- Skip Forward 15s -->
    <button class="center-btn">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23,4V10H17"/>
        <path d="M23,10A10,10,0,1,1,20.49,17.36"/>
      </svg>
      <span class="skip-num">15</span>
    </button>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">
    <!-- Scrubber -->
    <div class="scrubber-section">
      <div class="scrubber-times">
        <span class="scrubber-time">04:32</span>
        <span class="scrubber-time">-07:28</span>
      </div>
      <div class="scrubber-track">
        <div class="scrubber-loaded"></div>
        <div class="scrubber-fill"></div>
        <div class="scrubber-dot"></div>
      </div>
    </div>

    <!-- Bottom actions -->
    <div class="bottom-actions">
      <!-- Subtitles -->
      <button class="bottom-action-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2"/>
          <line x1="5" y1="12" x2="11" y2="12"/>
          <line x1="13" y1="12" x2="19" y2="12"/>
          <line x1="5" y1="16" x2="15" y2="16"/>
        </svg>
        <span class="bottom-action-label">Subs</span>
      </button>

      <!-- Audio -->
      <button class="bottom-action-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
          <path d="M19.07,4.93a10,10,0,0,1,0,14.14"/>
        </svg>
        <span class="bottom-action-label">Audio</span>
      </button>

      <!-- Speed -->
      <button class="speed-pill">1.0x</button>

      <!-- Lock -->
      <button class="bottom-action-btn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7,11V7a5,5,0,0,1,10,0v4"/>
        </svg>
        <span class="bottom-action-label">Lock</span>
      </button>
    </div>
  </div>

  <!-- Home indicator -->
  <div class="home-indicator"></div>
</div>
</body>
</html>
