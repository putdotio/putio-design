<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>put.io Design System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #09090B; --bg-2: #111113; --bg-3: #19191B; --bg-4: #222225;
    --line: #27272A; --border: #3F3F46; --solid: #71717A;
    --text-2: #A1A1AA; --text: #FAFAFA;
    --yellow: #FDCE45;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; line-height: 1.5; }

  .container { max-width: 960px; margin: 0 auto; padding: 64px 24px; }

  /* Hero */
  .hero { margin-bottom: 48px; }
  .hero h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 8px; }
  .hero h1 span { color: var(--yellow); }
  .hero p { font-size: 15px; color: var(--text-2); max-width: 520px; line-height: 1.6; margin-bottom: 20px; }
  .stats { display: flex; gap: 24px; }
  .stat { font-family: 'JetBrains Mono', monospace; }
  .stat-value { font-size: 20px; font-weight: 700; color: var(--yellow); }
  .stat-label { font-size: 11px; color: var(--solid); text-transform: uppercase; letter-spacing: 0.08em; }

  /* Search */
  .search-bar {
    width: 100%; background: var(--bg-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 9px 12px; font-size: 13px;
    color: var(--text); font-family: inherit; outline: none; margin-bottom: 12px;
  }
  .search-bar:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(253,206,69,0.1); }
  .search-bar::placeholder { color: var(--solid); }

  /* Nav */
  .nav {
    display: flex; align-items: center; gap: 4px; margin-bottom: 24px;
    position: sticky; top: 0; background: var(--bg); padding: 10px 0;
    z-index: 10; border-bottom: 1px solid var(--line);
    overflow-x: auto; white-space: nowrap;
    -ms-overflow-style: none; scrollbar-width: none;
  }
  .nav::-webkit-scrollbar { display: none; }
  .nav-btn {
    background: none; border: none; border-radius: 5px;
    padding: 4px 10px; font-size: 12px; color: var(--solid);
    cursor: pointer; font-family: inherit; transition: all 0.15s;
    white-space: nowrap; flex-shrink: 0;
  }
  .nav-btn:hover { color: var(--text-2); background: var(--bg-3); }
  .nav-btn.active { color: var(--bg); background: var(--yellow); font-weight: 600; }
  .nav-btn .count { font-family: 'JetBrains Mono', monospace; font-size: 10px; opacity: 0.6; margin-left: 2px; }
  .nav-sep { width: 1px; height: 16px; background: var(--line); flex-shrink: 0; }

  /* Results count */
  .results-count { font-size: 12px; color: var(--solid); margin-bottom: 16px; font-family: 'JetBrains Mono', monospace; }

  /* List layout */
  .list { display: flex; flex-direction: column; gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .list:empty { display: none; }

  .list-group-header {
    padding: 8px 16px; font-size: 11px; font-weight: 600; color: var(--solid);
    text-transform: uppercase; letter-spacing: 0.06em; background: var(--bg-3);
  }

  .item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 16px; background: var(--bg-2);
    text-decoration: none; color: inherit; transition: background 0.1s;
  }
  .item:hover { background: var(--bg-3); }

  .item-icon {
    width: 32px; height: 32px; border-radius: 7px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600;
  }
  .item-icon.web { background: rgba(59,130,246,0.12); color: #60A5FA; }
  .item-icon.ios { background: rgba(52,211,153,0.12); color: #34D399; }
  .item-icon.android { background: rgba(163,230,53,0.12); color: #A3E635; }
  .item-icon.tv { background: rgba(244,114,182,0.12); color: #F472B6; }
  .item-icon.other { background: rgba(253,206,69,0.12); color: var(--yellow); }
  .item-icon.marketing { background: rgba(139,92,246,0.12); color: #A78BFA; }

  .item-info { flex: 1; min-width: 0; }
  .item-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item-meta { font-size: 11px; color: var(--solid); display: flex; gap: 6px; align-items: center; margin-top: 1px; }

  .tag {
    font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500;
    font-family: 'JetBrains Mono', monospace;
  }
  .tag.clean { background: rgba(59,130,246,0.12); color: #60A5FA; }
  .tag.mono { background: rgba(139,92,246,0.12); color: #A78BFA; }
  .tag.brutalist { background: rgba(253,206,69,0.12); color: var(--yellow); }
  .tag.editorial { background: rgba(244,114,182,0.12); color: #F472B6; }
  .tag.native { background: rgba(52,211,153,0.12); color: #34D399; }
  .tag.v3 { background: rgba(251,146,60,0.12); color: #FB923C; }
  .tag.light { background: rgba(250,250,250,0.1); color: #D4D4D8; }

  .item-arrow { color: var(--border); font-size: 14px; flex-shrink: 0; transition: color 0.1s; }
  .item:hover .item-arrow { color: var(--yellow); }

  .footer { text-align: center; padding: 48px 0; font-size: 12px; color: var(--solid); margin-top: 48px; }
  .footer a { color: var(--yellow); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>put<span>.</span>io design system</h1>
    <p>Design exploration across 9 platforms, 4 variants, 3 iterations. Every screen is self-contained HTML.</p>
    <div class="stats">
      <div class="stat"><div class="stat-value">133</div><div class="stat-label">Screens</div></div>
      <div class="stat"><div class="stat-value">9</div><div class="stat-label">Platforms</div></div>
      <div class="stat"><div class="stat-value">4</div><div class="stat-label">Variants</div></div>
    </div>
  </div>

  <input class="search-bar" type="text" placeholder="Search... files, player, ios, brutalist, v3" id="search" />

  <div class="nav" id="nav">
    <button class="nav-btn active" data-filter="all">All<span class="count">133</span></button>
    <button class="nav-btn" data-filter="web">Web<span class="count">61</span></button>
    <button class="nav-btn" data-filter="ios">iOS<span class="count">25</span></button>
    <button class="nav-btn" data-filter="android">Android<span class="count">14</span></button>
    <button class="nav-btn" data-filter="tv">TV<span class="count">17</span></button>
    <button class="nav-btn" data-filter="other">Other<span class="count">8</span></button>
    <button class="nav-btn" data-filter="marketing">Marketing<span class="count">6</span></button>
    <div class="nav-sep"></div>
    <button class="nav-btn" data-filter="clean">Clean</button>
    <button class="nav-btn" data-filter="mono">Mono</button>
    <button class="nav-btn" data-filter="brutalist">Brutalist</button>
    <button class="nav-btn" data-filter="editorial">Editorial</button>
    <button class="nav-btn" data-filter="native">Native</button>
    <button class="nav-btn" data-filter="v3">v3</button>
  </div>

  <div class="results-count" id="results-count"></div>
  <div class="list" id="list"></div>

  <div class="footer">
    put.io · istanbul · since 2011 · <a href="https://github.com/putdotio/putio-design">source</a> · ᕦ(ò_óˇ)ᕤ
  </div>
</div>

<script>
const files = ["about-v3-brutalist.html","about-v4-editorial.html","android-downloads.html","android-files-m3-v3.html","android-files-v2-mono.html","android-files-v3-brutalist.html","android-files-v4-editorial.html","android-files.html","android-player-m3-v3.html","android-player.html","android-storage-m3-v3.html","android-transfers-m3-v3.html","android-transfers-v2-mono.html","android-transfers-v3-brutalist.html","android-transfers-v4-editorial.html","android-transfers.html","androidtv-browse-native.html","androidtv-files.html","androidtv-home-native.html","androidtv-home.html","androidtv-player.html","androidtv-search.html","cli-app.html","components-web.html","ios-downloads.html","ios-files-light-v2-clean.html","ios-files-native-v3.html","ios-files-v2-clean-v3.html","ios-files-v2-clean.html","ios-files-v2-mono.html","ios-files-v3-brutalist.html","ios-files-v4-editorial.html","ios-files.html","ios-now-playing.html","ios-player-native-v3.html","ios-player-v2-clean.html","ios-player-v2-mono.html","ios-player-v4-editorial.html","ios-player.html","ios-rss.html","ios-settings.html","ios-share-extension.html","ios-storage-dashboard.html","ios-transfers-native-v3.html","ios-transfers-v2-clean.html","ios-transfers-v2-mono.html","ios-transfers-v3-brutalist.html","ios-transfers-v4-editorial.html","ios-widgets.html","landing-v2-clean.html","landing-v2-mono.html","landing-v3-brutalist.html","landing-v4-editorial.html","roku-files.html","tokens.html","tvos-filebrowser.html","tvos-files-native.html","tvos-files-v2.html","tvos-home-native.html","tvos-home-v2.html","tvos-home.html","tvos-player.html","tvos-search.html","tvos-settings.html","tvos-transfers.html","visionos-player.html","watchos-glances.html","web-audio-player.html","web-command-palette.html","web-cross-platform-flow.html","web-empty-states-v2.html","web-empty-states.html","web-files-dark.html","web-files-grid-v4-editorial.html","web-files-grid.html","web-files-light-v2-clean.html","web-files-light-v2-mono.html","web-files-light-v3-brutalist.html","web-files-light-v4-editorial.html","web-files-v2-clean-v3.html","web-files-v2-clean.html","web-files-v2-mono.html","web-files-v3-brutalist-v2.html","web-files-v3-brutalist.html","web-files-v4-editorial-v2.html","web-files-v4-editorial.html","web-history-v2-clean-v3.html","web-history-v2-clean.html","web-history-v2-mono.html","web-history-v3-brutalist.html","web-history-v4-editorial.html","web-onboarding-v2-clean-v3.html","web-onboarding-v4-editorial.html","web-onboarding.html","web-player-dark.html","web-player-v2-clean-v3.html","web-player-v2-clean.html","web-player-v2-mono.html","web-player-v3-brutalist-v2.html","web-player-v3-brutalist.html","web-player-v4-editorial-v2.html","web-player-v4-editorial.html","web-pricing-v3-brutalist.html","web-pricing.html","web-rss-v2-clean-v3.html","web-rss-v2-clean.html","web-rss-v2-mono.html","web-rss-v3-brutalist.html","web-rss-v4-editorial.html","web-settings-v2-clean-v3.html","web-settings-v4-editorial.html","web-settings.html","web-sharing-redesign.html","web-sharing-v2-clean-v3.html","web-sharing-v2-clean.html","web-sharing-v2-mono.html","web-sharing-v3-brutalist.html","web-sharing-v4-editorial.html","web-storage-dashboard.html","web-storage-v2-clean-v3.html","web-storage-v2-clean.html","web-storage-v2-editorial-v2.html","web-storage-v2-mono.html","web-storage-v3-brutalist.html","web-storage-v4-editorial.html","web-transfers-dark.html","web-transfers-v2-clean-v3.html","web-transfers-v2-clean.html","web-transfers-v2-mono.html","web-transfers-v3-brutalist-v2.html","web-transfers-v3-brutalist.html","web-transfers-v4-editorial-v2.html","web-transfers-v4-editorial.html"];

function getCategory(n) {
  if (n.startsWith('web-') || n === 'tokens.html' || n === 'components-web.html') return 'web';
  if (n.startsWith('ios-')) return 'ios';
  if (n.startsWith('android-') && !n.startsWith('androidtv-')) return 'android';
  if (n.startsWith('tvos-') || n.startsWith('androidtv-') || n.startsWith('roku-')) return 'tv';
  if (n.startsWith('landing-') || n.startsWith('about-')) return 'marketing';
  return 'other';
}

function getVariant(n) {
  if (n.includes('native') || n.includes('m3-v3')) return 'native';
  if (n.includes('-editorial')) return 'editorial';
  if (n.includes('-brutalist')) return 'brutalist';
  if (n.includes('-mono')) return 'mono';
  if (n.includes('-clean') || n.includes('v2-clean')) return 'clean';
  return '';
}

function getScreen(n) {
  const s = n.replace('.html','');
  const parts = s.split('-');
  // Extract the core screen name
  if (parts.includes('files') || parts.includes('filebrowser')) return 'Files';
  if (parts.includes('transfers')) return 'Transfers';
  if (parts.includes('player')) return 'Player';
  if (parts.includes('storage')) return 'Storage';
  if (parts.includes('settings')) return 'Settings';
  if (parts.includes('history')) return 'History';
  if (parts.includes('sharing') || parts.includes('share')) return 'Sharing';
  if (parts.includes('rss')) return 'RSS';
  if (parts.includes('onboarding')) return 'Onboarding';
  if (parts.includes('pricing')) return 'Pricing';
  if (parts.includes('home')) return 'Home';
  if (parts.includes('search')) return 'Search';
  if (parts.includes('landing')) return 'Landing';
  if (parts.includes('about')) return 'About';
  if (parts.includes('downloads')) return 'Downloads';
  if (parts.includes('widgets')) return 'Widgets';
  if (parts.includes('browse')) return 'Browse';
  if (s.includes('now-playing')) return 'Now Playing';
  if (s.includes('audio')) return 'Audio Player';
  if (s.includes('command')) return 'Command Palette';
  if (s.includes('cross-platform')) return 'Cross-Platform Flow';
  if (s.includes('empty-states')) return 'Empty States';
  if (s.includes('grid')) return 'Files (Grid)';
  if (s.includes('tokens')) return 'Tokens';
  if (s.includes('components')) return 'Components';
  if (s.includes('cli')) return 'CLI';
  if (s.includes('visionos')) return 'visionOS Player';
  if (s.includes('watchos')) return 'watchOS';
  if (s.includes('roku')) return 'Roku Files';
  return s;
}

function getPlatform(n) {
  if (n.startsWith('ios-')) return 'iOS';
  if (n.startsWith('androidtv-')) return 'Android TV';
  if (n.startsWith('android-')) return 'Android';
  if (n.startsWith('tvos-')) return 'tvOS';
  if (n.startsWith('roku-')) return 'Roku';
  if (n.startsWith('watchos-')) return 'watchOS';
  if (n.startsWith('visionos-')) return 'visionOS';
  if (n.startsWith('cli-')) return 'CLI';
  if (n.startsWith('landing-')) return 'Landing';
  if (n.startsWith('about-')) return 'About';
  return 'Web';
}

function getTags(n) {
  const tags = [];
  const v = getVariant(n);
  if (v) tags.push({ label: v.charAt(0).toUpperCase() + v.slice(1), cls: v });
  if (n.includes('v3') || n.includes('-v2.html')) tags.push({ label: n.includes('v3') ? 'v3' : 'v2', cls: 'v3' });
  if (n.includes('light')) tags.push({ label: 'Light', cls: 'light' });
  return tags;
}

function getIconLetter(cat) {
  const m = { web: 'W', ios: 'i', android: 'A', tv: 'T', other: '·', marketing: 'M' };
  return m[cat] || '·';
}

function render(filter, search) {
  const filtered = files.filter(f => {
    const cat = getCategory(f);
    const variant = getVariant(f);
    const matchFilter = filter === 'all' || cat === filter || variant === filter || (filter === 'v3' && f.includes('v3'));
    const matchSearch = !search || f.toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  document.getElementById('results-count').textContent = filtered.length + ' screens';

  // Group by screen type
  const groups = {};
  filtered.forEach(f => {
    const screen = getScreen(f);
    if (!groups[screen]) groups[screen] = [];
    groups[screen].push(f);
  });

  const list = document.getElementById('list');
  let html = '';
  for (const [group, items] of Object.entries(groups)) {
    if (Object.keys(groups).length > 1) {
      html += `<div class="list-group-header">${group}</div>`;
    }
    items.forEach(f => {
      const cat = getCategory(f);
      const platform = getPlatform(f);
      const tags = getTags(f);
      const tagHtml = tags.map(t => `<span class="tag ${t.cls}">${t.label}</span>`).join('');
      html += `<a class="item" href="${f}" target="_blank">
        <div class="item-icon ${cat}">${getIconLetter(cat)}</div>
        <div class="item-info">
          <div class="item-name">${getScreen(f)} — ${platform}</div>
          <div class="item-meta">${tagHtml}<span>${f.replace('.html','')}</span></div>
        </div>
        <span class="item-arrow">→</span>
      </a>`;
    });
  }
  list.innerHTML = html;
}

document.getElementById('nav').addEventListener('click', e => {
  const btn = e.target.closest('.nav-btn');
  if (btn) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render(btn.dataset.filter, document.getElementById('search').value);
  }
});

document.getElementById('search').addEventListener('input', e => {
  const active = document.querySelector('.nav-btn.active');
  render(active.dataset.filter, e.target.value);
});

render('all', '');
</script>
</body>
</html>
