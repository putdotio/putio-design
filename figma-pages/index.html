<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>put.io Design System</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0C0C0E; --bg-2: #141416; --bg-3: #1C1C20; --bg-4: #262629;
    --line: #2A2A2E; --border: #38383D; --solid: #6E6E78;
    --text-2: #A0A0AB; --text: #EDEDF0;
    --yellow: #FDCE45;
  }
  body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  .container { max-width: 1200px; margin: 0 auto; padding: 48px 24px; }

  .hero { margin-bottom: 64px; }
  .hero h1 { font-size: 48px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 12px; }
  .hero h1 span { color: var(--yellow); }
  .hero p { font-size: 18px; color: var(--text-2); max-width: 600px; line-height: 1.6; }
  .hero .stats { display: flex; gap: 32px; margin-top: 24px; }
  .hero .stat { font-family: 'JetBrains Mono', monospace; }
  .hero .stat-value { font-size: 28px; font-weight: 700; color: var(--yellow); }
  .hero .stat-label { font-size: 12px; color: var(--solid); text-transform: uppercase; letter-spacing: 0.06em; }

  .nav { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 48px; position: sticky; top: 0; background: var(--bg); padding: 16px 0; z-index: 10; border-bottom: 1px solid var(--line); }
  .nav-btn { background: var(--bg-3); border: 1px solid var(--border); border-radius: 8px; padding: 8px 16px; font-size: 13px; color: var(--text-2); cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .nav-btn:hover { background: var(--bg-4); color: var(--text); border-color: var(--solid); }
  .nav-btn.active { background: var(--yellow); color: #0C0C0E; border-color: var(--yellow); font-weight: 600; }
  .nav-btn .count { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; margin-left: 4px; }

  .section { margin-bottom: 48px; }
  .section-title { font-size: 20px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 10px; }
  .section-title .badge { font-size: 11px; background: var(--bg-4); color: var(--solid); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .section-desc { font-size: 13px; color: var(--solid); margin-bottom: 20px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card {
    background: var(--bg-2); border: 1px solid var(--line); border-radius: 10px;
    overflow: hidden; cursor: pointer; transition: all 0.15s;
    text-decoration: none; color: inherit; display: block;
  }
  .card:hover { border-color: var(--yellow); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
  .card .preview { height: 160px; background: var(--bg-3); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
  .card .preview iframe { width: 200%; height: 200%; border: none; transform: scale(0.5); transform-origin: 0 0; pointer-events: none; }
  .card .preview .platform-badge { position: absolute; top: 8px; right: 8px; font-size: 10px; background: rgba(0,0,0,0.6); color: var(--text-2); padding: 2px 8px; border-radius: 4px; font-family: 'JetBrains Mono', monospace; }
  .card .info { padding: 14px 16px; }
  .card .info .name { font-size: 13px; font-weight: 500; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .info .meta { font-size: 11px; color: var(--solid); font-family: 'JetBrains Mono', monospace; display: flex; gap: 8px; }
  .card .info .variant-tag { font-size: 10px; padding: 1px 6px; border-radius: 3px; font-weight: 500; }
  .card .info .variant-tag.clean { background: rgba(59,130,246,0.15); color: #60A5FA; }
  .card .info .variant-tag.mono { background: rgba(139,92,246,0.15); color: #A78BFA; }
  .card .info .variant-tag.brutalist { background: rgba(253,206,69,0.15); color: var(--yellow); }
  .card .info .variant-tag.editorial { background: rgba(244,114,182,0.15); color: #F472B6; }
  .card .info .variant-tag.native { background: rgba(52,211,153,0.15); color: #34D399; }

  .footer { text-align: center; padding: 48px 0; font-size: 13px; color: var(--solid); border-top: 1px solid var(--line); margin-top: 48px; }
  .footer a { color: var(--yellow); text-decoration: none; }

  [data-category] { display: none; }
  [data-category].visible { display: block; }

  .search-bar { width: 100%; background: var(--bg-3); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; font-size: 14px; color: var(--text); font-family: inherit; outline: none; margin-bottom: 24px; }
  .search-bar:focus { border-color: var(--yellow); box-shadow: 0 0 0 2px rgba(253,206,69,0.15); }
  .search-bar::placeholder { color: var(--solid); }
</style>
</head>
<body>
<div class="container">
  <div class="hero">
    <h1>put<span>.</span>io design system</h1>
    <p>Design exploration across 9 platforms, 4 design variants, 3 iterations deep. Every screen is a self-contained HTML file with inline CSS and SVGs.</p>
    <div class="stats">
      <div class="stat"><div class="stat-value">133</div><div class="stat-label">Screens</div></div>
      <div class="stat"><div class="stat-value">9</div><div class="stat-label">Platforms</div></div>
      <div class="stat"><div class="stat-value">4</div><div class="stat-label">Variants</div></div>
      <div class="stat"><div class="stat-value">87K</div><div class="stat-label">Lines</div></div>
    </div>
  </div>

  <input class="search-bar" type="text" placeholder="Search screens... (e.g. 'files', 'player', 'ios', 'brutalist')" id="search" />

  <div class="nav" id="nav">
    <button class="nav-btn active" data-filter="all">All<span class="count">133</span></button>
    <button class="nav-btn" data-filter="web">Web<span class="count">61</span></button>
    <button class="nav-btn" data-filter="ios">iOS<span class="count">25</span></button>
    <button class="nav-btn" data-filter="android">Android<span class="count">14</span></button>
    <button class="nav-btn" data-filter="tv">TV<span class="count">17</span></button>
    <button class="nav-btn" data-filter="other">Other<span class="count">8</span></button>
    <button class="nav-btn" data-filter="marketing">Marketing<span class="count">6</span></button>
    <button class="nav-btn" data-filter="clean">Clean</button>
    <button class="nav-btn" data-filter="mono">Mono</button>
    <button class="nav-btn" data-filter="brutalist">Brutalist</button>
    <button class="nav-btn" data-filter="editorial">Editorial</button>
    <button class="nav-btn" data-filter="native">Native</button>
    <button class="nav-btn" data-filter="v3">v3 (best)</button>
  </div>

  <div id="cards"></div>

  <div class="footer">
    put.io design system — istanbul — since 2011 — <a href="https://github.com/AltayAydemir/putio-design">github</a> — ᕦ(ò_óˇ)ᕤ
  </div>
</div>

<script>
const files = ["about-v3-brutalist.html", "about-v4-editorial.html", "android-downloads.html", "android-files-m3-v3.html", "android-files-v2-mono.html", "android-files-v3-brutalist.html", "android-files-v4-editorial.html", "android-files.html", "android-player-m3-v3.html", "android-player.html", "android-storage-m3-v3.html", "android-transfers-m3-v3.html", "android-transfers-v2-mono.html", "android-transfers-v3-brutalist.html", "android-transfers-v4-editorial.html", "android-transfers.html", "androidtv-browse-native.html", "androidtv-files.html", "androidtv-home-native.html", "androidtv-home.html", "androidtv-player.html", "androidtv-search.html", "cli-app.html", "components-web.html", "ios-downloads.html", "ios-files-light-v2-clean.html", "ios-files-native-v3.html", "ios-files-v2-clean-v3.html", "ios-files-v2-clean.html", "ios-files-v2-mono.html", "ios-files-v3-brutalist.html", "ios-files-v4-editorial.html", "ios-files.html", "ios-now-playing.html", "ios-player-native-v3.html", "ios-player-v2-clean.html", "ios-player-v2-mono.html", "ios-player-v4-editorial.html", "ios-player.html", "ios-rss.html", "ios-settings.html", "ios-share-extension.html", "ios-storage-dashboard.html", "ios-transfers-native-v3.html", "ios-transfers-v2-clean.html", "ios-transfers-v2-mono.html", "ios-transfers-v3-brutalist.html", "ios-transfers-v4-editorial.html", "ios-widgets.html", "landing-v2-clean.html", "landing-v2-mono.html", "landing-v3-brutalist.html", "landing-v4-editorial.html", "roku-files.html", "tokens.html", "tvos-filebrowser.html", "tvos-files-native.html", "tvos-files-v2.html", "tvos-home-native.html", "tvos-home-v2.html", "tvos-home.html", "tvos-player.html", "tvos-search.html", "tvos-settings.html", "tvos-transfers.html", "visionos-player.html", "watchos-glances.html", "web-audio-player.html", "web-command-palette.html", "web-cross-platform-flow.html", "web-empty-states-v2.html", "web-empty-states.html", "web-files-dark.html", "web-files-grid-v4-editorial.html", "web-files-grid.html", "web-files-light-v2-clean.html", "web-files-light-v2-mono.html", "web-files-light-v3-brutalist.html", "web-files-light-v4-editorial.html", "web-files-v2-clean-v3.html", "web-files-v2-clean.html", "web-files-v2-mono.html", "web-files-v3-brutalist-v2.html", "web-files-v3-brutalist.html", "web-files-v4-editorial-v2.html", "web-files-v4-editorial.html", "web-history-v2-clean-v3.html", "web-history-v2-clean.html", "web-history-v2-mono.html", "web-history-v3-brutalist.html", "web-history-v4-editorial.html", "web-onboarding-v2-clean-v3.html", "web-onboarding-v4-editorial.html", "web-onboarding.html", "web-player-dark.html", "web-player-v2-clean-v3.html", "web-player-v2-clean.html", "web-player-v2-mono.html", "web-player-v3-brutalist-v2.html", "web-player-v3-brutalist.html", "web-player-v4-editorial-v2.html", "web-player-v4-editorial.html", "web-pricing-v3-brutalist.html", "web-pricing.html", "web-rss-v2-clean-v3.html", "web-rss-v2-clean.html", "web-rss-v2-mono.html", "web-rss-v3-brutalist.html", "web-rss-v4-editorial.html", "web-settings-v2-clean-v3.html", "web-settings-v4-editorial.html", "web-settings.html", "web-sharing-redesign.html", "web-sharing-v2-clean-v3.html", "web-sharing-v2-clean.html", "web-sharing-v2-mono.html", "web-sharing-v3-brutalist.html", "web-sharing-v4-editorial.html", "web-storage-dashboard.html", "web-storage-v2-clean-v3.html", "web-storage-v2-clean.html", "web-storage-v2-editorial-v2.html", "web-storage-v2-mono.html", "web-storage-v3-brutalist.html", "web-storage-v4-editorial.html", "web-transfers-dark.html", "web-transfers-v2-clean-v3.html", "web-transfers-v2-clean.html", "web-transfers-v2-mono.html", "web-transfers-v3-brutalist-v2.html", "web-transfers-v3-brutalist.html", "web-transfers-v4-editorial-v2.html", "web-transfers-v4-editorial.html"];

function getCategory(name) {
  if (name.startsWith('web-') || name.startsWith('tokens') || name.startsWith('components')) return 'web';
  if (name.startsWith('ios-')) return 'ios';
  if (name.startsWith('android-') && !name.startsWith('androidtv-')) return 'android';
  if (name.startsWith('tvos-') || name.startsWith('androidtv-') || name.startsWith('roku-')) return 'tv';
  if (name.startsWith('landing-') || name.startsWith('about-')) return 'marketing';
  return 'other';
}

function getVariant(name) {
  if (name.includes('native') || name.includes('m3-v3')) return 'native';
  if (name.includes('v4-editorial') || name.includes('-editorial')) return 'editorial';
  if (name.includes('v3-brutalist') || name.includes('-brutalist')) return 'brutalist';
  if (name.includes('v2-mono') || name.includes('-mono')) return 'mono';
  if (name.includes('v2-clean') || name.includes('-clean')) return 'clean';
  return '';
}

function getVariantLabel(variant) {
  const labels = { clean: 'Clean', mono: 'Mono', brutalist: 'Brutalist', editorial: 'Editorial', native: 'Native' };
  return labels[variant] || '';
}

function getPlatformLabel(name) {
  if (name.startsWith('ios-')) return 'iOS';
  if (name.startsWith('androidtv-')) return 'Android TV';
  if (name.startsWith('android-')) return 'Android';
  if (name.startsWith('tvos-')) return 'tvOS';
  if (name.startsWith('roku-')) return 'Roku';
  if (name.startsWith('watchos-')) return 'watchOS';
  if (name.startsWith('visionos-')) return 'visionOS';
  if (name.startsWith('cli-')) return 'CLI';
  if (name.startsWith('landing-')) return 'Landing';
  if (name.startsWith('about-')) return 'About';
  if (name.startsWith('web-')) return 'Web';
  return '';
}

function getDisplayName(name) {
  return name.replace('.html', '').replace(/-/g, ' ').replace(/\bv(\d)\b/g, 'v$1').replace(/\bm3\b/g, 'M3');
}

function renderCards(filter, search) {
  const container = document.getElementById('cards');
  const filtered = files.filter(f => {
    const cat = getCategory(f);
    const variant = getVariant(f);
    const matchFilter = filter === 'all' || cat === filter || variant === filter || (filter === 'v3' && f.includes('v3'));
    const matchSearch = !search || f.toLowerCase().includes(search.toLowerCase());
    return matchFilter && matchSearch;
  });

  container.innerHTML = filtered.map(f => {
    const variant = getVariant(f);
    const variantLabel = getVariantLabel(variant);
    const platform = getPlatformLabel(f);
    return `<a class="card" href="${f}" target="_blank">
      <div class="preview">
        <span class="platform-badge">${platform}</span>
      </div>
      <div class="info">
        <div class="name">${getDisplayName(f)}</div>
        <div class="meta">
          ${variantLabel ? `<span class="variant-tag ${variant}">${variantLabel}</span>` : ''}
          <span>${platform}</span>
        </div>
      </div>
    </a>`;
  }).join('');
}

// Nav filtering
document.getElementById('nav').addEventListener('click', e => {
  if (e.target.classList.contains('nav-btn')) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
    renderCards(e.target.dataset.filter, document.getElementById('search').value);
  }
});

// Search
document.getElementById('search').addEventListener('input', e => {
  const activeFilter = document.querySelector('.nav-btn.active').dataset.filter;
  renderCards(activeFilter, e.target.value);
});

renderCards('all', '');
</script>
</body>
</html>
