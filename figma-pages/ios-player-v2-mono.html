<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=390">
<title>put.io -- iOS Player v2 Mono</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #000000; --bg-2: #111111; --bg-3: #1A1A1A; --bg-4: #2A2A2A;
    --line: #2A2A2A; --solid: #6B6B6B; --text-2: #999999; --text: #E0E0E0;
    --yellow: #FDCE45; --green: #30D158; --red: #FF453A; --blue: #0A84FF;
    --dim: #555555;
  }
  body { font-family: 'JetBrains Mono', monospace; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }

  .phone {
    width: 390px; height: 844px; overflow: hidden; position: relative;
  }

  /* Video Background -- terminal-dark */
  .video-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 35% 30%, rgba(20, 30, 40, 0.5) 0%, transparent 50%),
      radial-gradient(ellipse at 65% 60%, rgba(15, 10, 25, 0.6) 0%, transparent 45%),
      linear-gradient(180deg, #080810 0%, #0a0a14 30%, #060610 60%, #000000 100%);
  }

  /* Scanline overlay */
  .scanlines {
    position: absolute; inset: 0; z-index: 1;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(255,255,255,0.01) 2px,
      rgba(255,255,255,0.01) 4px
    );
    pointer-events: none;
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; padding: 12px 24px 0; height: 54px;
    font-size: 13px; font-weight: 500; letter-spacing: 0.05em;
  }
  .status-bar .time { flex: 1; }
  .status-bar .icons { display: flex; gap: 6px; align-items: center; }

  /* Top Bar */
  .top-bar {
    position: absolute; top: 44px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 10px 16px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
  }
  .top-btn {
    width: 34px; height: 34px;
    background: rgba(255,255,255,0.06); border: 1px solid var(--line);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text); cursor: pointer;
  }
  .top-title-area { flex: 1; min-width: 0; }
  .top-title {
    font-size: 14px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    letter-spacing: -0.01em;
  }
  .top-meta { font-size: 11px; color: var(--dim); margin-top: 1px; }

  /* Subtitle overlay -- terminal style */
  .subtitle-overlay {
    position: absolute; bottom: 280px; left: 50%; transform: translateX(-50%);
    z-index: 15; width: 350px; text-align: center;
  }
  .subtitle-text {
    display: inline;
    background: rgba(0,0,0,0.85);
    color: var(--green); font-size: 13px; font-weight: 400;
    padding: 3px 12px; border-radius: 2px;
    line-height: 1.7;
    border: 1px solid rgba(48,209,88,0.15);
    -webkit-box-decoration-break: clone;
    box-decoration-break: clone;
  }
  .subtitle-text::before { content: '> '; color: var(--dim); }

  /* Center controls */
  .center-controls {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 20; display: flex; align-items: center; gap: 36px;
  }
  .center-btn {
    background: none; border: none; color: rgba(255,255,255,0.7);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .center-btn.main-play {
    width: 64px; height: 64px;
    background: rgba(255,255,255,0.06);
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .skip-num {
    position: absolute; font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.7); margin-top: 2px;
  }

  /* File Info Panel */
  .file-info {
    position: absolute; top: 120px; left: 16px; z-index: 10;
    font-size: 10px; color: var(--dim);
    line-height: 1.8; letter-spacing: 0.02em;
    opacity: 0.6;
  }
  .file-info .key { color: var(--yellow); }
  .file-info .val { color: var(--text-2); }

  /* Bottom controls */
  .bottom-controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.5) 60%, transparent 100%);
    padding: 0 16px 36px;
  }

  /* Scrubber -- ASCII style */
  .scrubber-section { margin-bottom: 12px; }
  .scrubber-times {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums;
  }
  .scrubber-track {
    width: 100%; height: 3px; background: var(--bg-4);
    border-radius: 0; position: relative;
  }
  .scrubber-loaded {
    position: absolute; top: 0; left: 0; height: 100%;
    background: rgba(255,255,255,0.06); width: 70%;
  }
  .scrubber-fill {
    height: 100%; background: var(--yellow); width: 38%;
    position: relative; z-index: 1;
  }
  .scrubber-dot {
    width: 12px; height: 12px; background: var(--yellow);
    border-radius: 2px; position: absolute; top: 50%; left: 38%;
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow: 0 0 8px rgba(253,206,69,0.4);
  }

  /* ASCII scrubber readout */
  .scrubber-ascii {
    font-size: 10px; color: var(--dim); margin-top: 6px;
    text-align: center; letter-spacing: 0;
  }
  .scrubber-ascii .filled { color: var(--yellow); }

  /* Bottom actions */
  .bottom-actions {
    display: flex; align-items: center; justify-content: space-between;
  }
  .bottom-action-btn {
    background: none; border: none; color: rgba(255,255,255,0.5);
    cursor: pointer; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
    padding: 4px 6px;
  }
  .bottom-action-label {
    font-size: 9px; font-weight: 500; color: var(--dim);
    text-transform: uppercase; letter-spacing: 0.06em;
  }
  .speed-pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 600; color: var(--yellow);
    background: rgba(253,206,69,0.08); padding: 3px 8px;
    border-radius: 2px; border: 1px solid rgba(253,206,69,0.2);
    cursor: pointer;
  }

  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: rgba(255,255,255,0.2);
    border-radius: 3px; z-index: 50;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="video-bg"></div>
  <div class="scanlines"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">09:41</span>
    <div class="icons">
      <svg width="17" height="12" viewBox="0 0 17 12" fill="none">
        <rect x="0" y="8" width="3" height="4" rx="0.5" fill="#E0E0E0"/>
        <rect x="4.5" y="5" width="3" height="7" rx="0.5" fill="#E0E0E0"/>
        <rect x="9" y="2" width="3" height="10" rx="0.5" fill="#E0E0E0"/>
        <rect x="13.5" y="0" width="3" height="12" rx="0.5" fill="#E0E0E0"/>
      </svg>
      <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
        <path d="M8 11.5a1.2 1.2 0 100-2.4 1.2 1.2 0 000 2.4z" fill="#E0E0E0"/>
        <path d="M5 8.2a4.5 4.5 0 016 0" stroke="#E0E0E0" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M2.5 5.5a8 8 0 0111 0" stroke="#E0E0E0" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
      <svg width="27" height="13" viewBox="0 0 27 13" fill="none">
        <rect x="0.5" y="0.5" width="23" height="12" rx="2.5" stroke="#E0E0E0" stroke-opacity="0.35"/>
        <rect x="2" y="2" width="20" height="9" rx="1.5" fill="#E0E0E0"/>
        <path d="M25 4.5v4a2 2 0 000-4z" fill="#E0E0E0" fill-opacity="0.4"/>
      </svg>
    </div>
  </div>

  <!-- File Info -- key:value display -->
  <div class="file-info">
    <div><span class="key">file:</span> <span class="val">Cosmos.Laundromat.720p.mkv</span></div>
    <div><span class="key">codec:</span> <span class="val">H.264 / AAC</span></div>
    <div><span class="key">res:</span> <span class="val">1280x720</span></div>
    <div><span class="key">size:</span> <span class="val">209.89 MB</span></div>
    <div><span class="key">dur:</span> <span class="val">00:12:00</span></div>
    <div><span class="key">fps:</span> <span class="val">24</span></div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <!-- Back -->
    <button class="top-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0E0E0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15,18 9,12 15,6"/>
      </svg>
    </button>
    <div class="top-title-area">
      <div class="top-title">Cosmos.Laundromat.mkv</div>
      <div class="top-meta">720p // H.264 // 209.89 MB</div>
    </div>
    <!-- AirPlay -->
    <button class="top-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5,17H4a2,2,0,0,1-2-2V5A2,2,0,0,1,4,3H20a2,2,0,0,1,2,2V15a2,2,0,0,1-2,2H19"/>
        <polygon points="12,15 17,21 7,21"/>
      </svg>
    </button>
    <!-- PiP -->
    <button class="top-btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E0E0E0" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <rect x="12" y="9" width="8" height="6" rx="1" fill="rgba(255,255,255,0.15)"/>
      </svg>
    </button>
  </div>

  <!-- Subtitle -->
  <div class="subtitle-overlay">
    <span class="subtitle-text">The cosmos is all that is, or ever was, or ever will be.</span>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back -->
    <button class="center-btn">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1,4V10H7"/>
        <path d="M1,10A10,10,0,1,1,3.51,17.36"/>
      </svg>
      <span class="skip-num">15</span>
    </button>

    <!-- Play/Pause -->
    <button class="center-btn main-play">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor">
        <path d="M8,5.14V19.14L19,12.14Z"/>
      </svg>
    </button>

    <!-- Skip Forward -->
    <button class="center-btn">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23,4V10H17"/>
        <path d="M23,10A10,10,0,1,1,20.49,17.36"/>
      </svg>
      <span class="skip-num">15</span>
    </button>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">
    <!-- Scrubber -->
    <div class="scrubber-section">
      <div class="scrubber-times">
        <span>04:32</span>
        <span>-07:28</span>
      </div>
      <div class="scrubber-track">
        <div class="scrubber-loaded"></div>
        <div class="scrubber-fill"></div>
        <div class="scrubber-dot"></div>
      </div>
      <div class="scrubber-ascii">
        [<span class="filled">=========</span><span style="color:var(--dim);">-----------------</span>] 37.8%
      </div>
    </div>

    <!-- Bottom actions -->
    <div class="bottom-actions">
      <!-- Subs -->
      <button class="bottom-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2"/>
          <line x1="5" y1="12" x2="11" y2="12"/>
          <line x1="13" y1="12" x2="19" y2="12"/>
          <line x1="5" y1="16" x2="15" y2="16"/>
        </svg>
        <span class="bottom-action-label">subs</span>
      </button>

      <!-- Audio -->
      <button class="bottom-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
          <path d="M19.07,4.93a10,10,0,0,1,0,14.14"/>
        </svg>
        <span class="bottom-action-label">audio</span>
      </button>

      <!-- Speed -->
      <button class="speed-pill">1.0x</button>

      <!-- Lock -->
      <button class="bottom-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"/>
          <path d="M7,11V7a5,5,0,0,1,10,0v4"/>
        </svg>
        <span class="bottom-action-label">lock</span>
      </button>

      <!-- Info -->
      <button class="bottom-action-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <line x1="12" y1="16" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12.01" y2="8"/>
        </svg>
        <span class="bottom-action-label">info</span>
      </button>
    </div>
  </div>

  <!-- Home indicator -->
  <div class="home-indicator"></div>
</div>
</body>
</html>
