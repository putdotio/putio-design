<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=412">
<title>put.io — Android Phone Player (Material 3)</title>
<script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --md-surface: #141218;
    --md-surface-container: #1D1B20;
    --md-surface-container-high: #2B2930;
    --md-on-surface: #E6E1E5;
    --md-on-surface-variant: #CAC4D0;
    --md-outline: #938F99;
    --md-outline-variant: #49454F;
    --md-primary: #FDCE45;
    --md-on-primary: #3D2E00;
    --md-primary-container: #574400;
    --md-on-primary-container: #FFE17A;
    --yellow: #FDCE45;
    --green: #4CC38A;
  }
  body {
    font-family: 'Inter', 'Roboto', sans-serif;
    background: #000; color: var(--md-on-surface);
    -webkit-font-smoothing: antialiased;
  }
  .phone { width: 412px; height: 915px; overflow: hidden; position: relative; }

  /* Video Background */
  .video-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 35% 40%, rgba(20,30,50,0.8) 0%, transparent 55%),
      radial-gradient(ellipse at 70% 60%, rgba(30,20,40,0.6) 0%, transparent 50%),
      linear-gradient(180deg, #0a0a14 0%, #101028 40%, #081828 70%, #060610 100%);
  }

  /* Status Bar */
  .status-bar {
    position: absolute; top: 0; left: 0; right: 0; z-index: 50;
    display: flex; align-items: center; padding: 10px 24px;
    font-size: 14px; font-weight: 500; height: 40px;
  }
  .status-bar .time { flex: 1; color: #fff; }
  .status-bar .icons { display: flex; gap: 8px; align-items: center; }
  .status-bar .icons svg { width: 16px; height: 16px; fill: #fff; }

  /* Top Bar */
  .top-bar {
    position: absolute; top: 36px; left: 0; right: 0; z-index: 40;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 8px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.75) 0%, transparent 100%);
  }
  .top-btn {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; color: #fff;
  }
  .top-btn:hover { background: rgba(255,255,255,0.08); }
  .top-btn svg { width: 24px; height: 24px; }
  .top-title-area { flex: 1; min-width: 0; }
  .top-title {
    font-size: 18px; font-weight: 600; color: #fff;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .top-meta { font-size: 14px; color: rgba(255,255,255,0.5); margin-top: 2px; }
  .cast-btn {
    width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(253,206,69,0.12); border: none; cursor: pointer;
  }
  .cast-btn svg { width: 26px; height: 26px; fill: var(--yellow); }

  /* Double-tap seek hint */
  .seek-hint {
    position: absolute; z-index: 25;
    width: 120px; height: 120px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .seek-hint.left { top: 50%; left: 40px; transform: translateY(-50%); }
  .seek-hint.right { top: 50%; right: 40px; transform: translateY(-50%); }
  .seek-hint svg { width: 28px; height: 28px; fill: rgba(255,255,255,0.6); }
  .seek-hint span { font-size: 13px; font-weight: 600; color: rgba(255,255,255,0.6); }

  /* Center Controls */
  .center-controls {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    z-index: 30; display: flex; align-items: center; gap: 48px;
  }
  .center-btn {
    background: none; border: none; color: rgba(255,255,255,0.85);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    position: relative;
  }
  .center-btn.main-play {
    width: 72px; height: 72px;
    background: rgba(255,255,255,0.1);
    backdrop-filter: blur(12px);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
  }
  .skip-num {
    position: absolute; font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.85);
  }

  /* Bottom Controls */
  .bottom-controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    background: linear-gradient(to top, rgba(0,0,0,0.92) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
    padding: 0 20px 24px;
  }

  /* Progress Scrubber */
  .scrubber-section { margin-bottom: 16px; }
  .scrubber-times {
    display: flex; justify-content: space-between; margin-bottom: 10px;
  }
  .scrubber-time {
    font-size: 14px; font-weight: 500; color: rgba(255,255,255,0.6);
    font-variant-numeric: tabular-nums;
  }
  .scrubber-track {
    width: 100%; height: 4px; background: rgba(255,255,255,0.2);
    border-radius: 2px; position: relative;
  }
  .scrubber-loaded {
    position: absolute; top: 0; left: 0; height: 100%;
    background: rgba(255,255,255,0.12); border-radius: 2px; width: 70%;
  }
  .scrubber-fill {
    height: 100%; background: var(--yellow); border-radius: 2px; width: 38%;
    position: relative; z-index: 1;
    box-shadow: 0 0 8px rgba(253,206,69,0.25);
  }
  .scrubber-dot {
    width: 18px; height: 18px; background: var(--yellow);
    border-radius: 50%; position: absolute; top: 50%; left: 38%;
    transform: translate(-50%, -50%); z-index: 2;
    box-shadow: 0 0 12px rgba(253,206,69,0.5), 0 0 3px rgba(253,206,69,0.8);
  }

  /* Bottom Actions */
  .bottom-actions {
    display: flex; align-items: center; justify-content: space-around;
  }
  .bottom-action-btn {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: rgba(255,255,255,0.7);
    cursor: pointer; padding: 8px 12px; border-radius: 12px;
    font-family: inherit;
  }
  .bottom-action-btn:hover { background: rgba(255,255,255,0.06); }
  .bottom-action-btn svg { width: 24px; height: 24px; }
  .bottom-action-btn span { font-size: 11px; font-weight: 500; }
  .speed-chip {
    font-size: 14px; font-weight: 700; color: rgba(255,255,255,0.7);
    background: rgba(255,255,255,0.1); padding: 6px 14px;
    border-radius: 8px; border: none; cursor: pointer;
    font-family: inherit;
  }

  /* Gesture Overlay Hints */
  .gesture-overlay {
    position: absolute; top: 50%; z-index: 15;
    display: flex; align-items: center; gap: 6px;
    opacity: 0.35;
  }
  .gesture-overlay.left-hint { left: 60px; transform: translateY(-50%); }
  .gesture-overlay.right-hint { right: 60px; transform: translateY(-50%); }
  .gesture-overlay svg { width: 20px; height: 20px; fill: rgba(255,255,255,0.5); }
  .gesture-overlay span { font-size: 12px; color: rgba(255,255,255,0.5); font-weight: 500; }

  /* Navigation bar hint (Android 3-button or gesture) */
  .nav-hint {
    position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%);
    width: 134px; height: 5px; background: rgba(255,255,255,0.2);
    border-radius: 3px; z-index: 50;
  }
</style>
</head>
<body>
<div class="phone">
  <div class="video-bg"></div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="time">12:34</span>
    <div class="icons">
      <svg viewBox="0 0 24 24"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M2 22h4V12H2v10zm6 0h4V7H8v15zm6 0h4V2h-4v20z"/></svg>
      <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <!-- Back -->
    <button class="top-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5"/>
        <polyline points="12,19 5,12 12,5"/>
      </svg>
    </button>
    <div class="top-title-area">
      <div class="top-title">Big Buck Bunny</div>
      <div class="top-meta">2008 -- 4K -- MKV</div>
    </div>
    <!-- Chromecast (FIRST CLASS) -->
    <button class="cast-btn">
      <svg viewBox="0 0 24 24"><path d="M1 18v3h3c0-1.66-1.34-3-3-3zm0-4v2c2.76 0 5 2.24 5 5h2c0-3.87-3.13-7-7-7zm0-4v2c4.97 0 9 4.03 9 9h2c0-6.08-4.93-11-11-11zm20-7H3c-1.1 0-2 .9-2 2v3h2V5h18v14h-7v2h7c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2z"/></svg>
    </button>
    <!-- PiP -->
    <button class="top-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2"/>
        <rect x="12" y="9" width="8" height="6" rx="1" fill="rgba(255,255,255,0.25)"/>
      </svg>
    </button>
  </div>

  <!-- Double-tap seek hints -->
  <div class="seek-hint left" style="opacity:0.35;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="19,20 9,12 19,4"/>
      <line x1="5" y1="19" x2="5" y2="5"/>
    </svg>
    <span>-10s</span>
  </div>
  <div class="seek-hint right" style="opacity:0.35;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="5,4 15,12 5,20"/>
      <line x1="19" y1="5" x2="19" y2="19"/>
    </svg>
    <span>+10s</span>
  </div>

  <!-- Center Controls -->
  <div class="center-controls">
    <!-- Skip Back 10s -->
    <button class="center-btn" style="position:relative;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M1,4V10H7"/>
        <path d="M1,10A10,10,0,1,1,3.51,17.36"/>
      </svg>
      <span class="skip-num">10</span>
    </button>

    <!-- Play/Pause -->
    <button class="center-btn main-play">
      <svg width="36" height="36" viewBox="0 0 256 256" fill="currentColor">
        <rect x="72" y="56" width="36" height="144" rx="6"/>
        <rect x="148" y="56" width="36" height="144" rx="6"/>
      </svg>
    </button>

    <!-- Skip Forward 10s -->
    <button class="center-btn" style="position:relative;">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23,4V10H17"/>
        <path d="M23,10A10,10,0,1,1,20.49,17.36"/>
      </svg>
      <span class="skip-num">10</span>
    </button>
  </div>

  <!-- Bottom Controls -->
  <div class="bottom-controls">
    <!-- Scrubber -->
    <div class="scrubber-section">
      <div class="scrubber-times">
        <span class="scrubber-time">03:42</span>
        <span class="scrubber-time">09:56</span>
      </div>
      <div class="scrubber-track">
        <div class="scrubber-loaded"></div>
        <div class="scrubber-fill"></div>
        <div class="scrubber-dot"></div>
      </div>
    </div>

    <!-- Bottom actions -->
    <div class="bottom-actions">
      <!-- Subtitles -->
      <button class="bottom-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2"/>
          <line x1="5" y1="12" x2="11" y2="12"/>
          <line x1="13" y1="12" x2="19" y2="12"/>
          <line x1="5" y1="16" x2="15" y2="16"/>
        </svg>
        <span>Subtitles</span>
      </button>

      <!-- Audio Track -->
      <button class="bottom-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
          <path d="M15.54,8.46a5,5,0,0,1,0,7.07"/>
          <path d="M19.07,4.93a10,10,0,0,1,0,14.14"/>
        </svg>
        <span>Audio</span>
      </button>

      <!-- Speed -->
      <button class="speed-chip">1.0x</button>

      <!-- Quality -->
      <button class="bottom-action-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="3" width="20" height="14" rx="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        <span>4K</span>
      </button>
    </div>
  </div>

  <!-- Nav hint -->
  <div class="nav-hint"></div>
</div>
</body>
</html>
